         after t=0 use immediateRender:false, and each from-state equals the previous end-state
         on the same property, so any seek order renders the right frame. */

      /* frame.md word-by-word */
      function wordIn(node, at) {
        tl.fromTo(
          node,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          at,
        );
      }

      /* frame.md accent-pill: trace from the left (rotation settles -8 -> 0), then the letters write inside */
      function pillIn(pill, bg, chars, at) {
        tl.fromTo(
          bg,
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
          at,
        );
        tl.fromTo(pill, { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo(
          chars,
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.16, ease: "power2.out", stagger: 0.02, immediateRender: false },
          at + 0.18,
        );
      }

      function on(node, at) {
        tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, at);
      }
      function off(node, at) {
        tl.fromTo(node, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, at);
      }

      /* ================= Scene 1 (0.00-2.20): vague request -> bland site ================= */

      /* small chat-input at the left */
      tl.fromTo(ask1, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false }, 0);
      tl.fromTo(ask1, { y: 18 }, { y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 0);

      /* phrase 1, word by word on the voice */
      wordIn(a[0], 0.15); /* Mais 0.18 */
      wordIn(a[1], 0.37); /* parler 0.40 */
      wordIn(a[2], 0.59); /* une 0.62 */
      wordIn(a[3], 0.73); /* langue 0.76 */
      pillIn(pill1, pill1Bg, pill1Ch, 1.14); /* ça 1.20 ... pas 1.78 */

      /* typing « Fais-moi un site. » (0.10-0.60) in keystroke bursts behind an accent caret */
      var PROMPT = "Fais-moi un site.";
      var T_FIRST = 0.1;
      var T_LAST = 0.6;
      var BURSTS = [2, 3, 2, 2, 3, 2, 3];
      var cuts = [];
      var n = 0;
      var k = 0;
      while (n < PROMPT.length) {
        n = Math.min(PROMPT.length, n + BURSTS[k % BURSTS.length]);
        cuts.push(n);
        k += 1;
      }
      var weights = cuts.map(function (cut, i) {
        if (i === 0) return 0;
        return PROMPT.charAt(cuts[i - 1] - 1) === " " ? 1.7 : 1;
      });
      var total = weights.reduce(function (acc, w) {
        return acc + w;
      }, 0);
      var times = [];
      var acc = 0;
      cuts.forEach(function (cut, i) {
        acc += weights[i];
        times.push(T_FIRST + (T_LAST - T_FIRST) * (acc / total));
      });

      prompt1.textContent = "";
      function makeCaret() {
        var anchor = document.createElement("span");
        anchor.className = "f08-cara";
        var caret = document.createElement("span");
        caret.className = "f08-caret-s";
        anchor.appendChild(caret);
        prompt1.appendChild(anchor);
        return caret;
      }
      var carets = [makeCaret()];
      var steps = [];
      var prevCut = 0;
      cuts.forEach(function (cut) {
        var span = document.createElement("span");
        span.className = "f08-k";
        span.textContent = PROMPT.slice(prevCut, cut);
        prompt1.appendChild(span);
        steps.push(span);
        carets.push(makeCaret());
        prevCut = cut;
      });
      on(carets[0], 0);
      off(carets[0], times[0]);
      steps.forEach(function (span, i) {
        on(span, times[i]);
        on(carets[i + 1], times[i]);
        if (i < steps.length - 1) off(carets[i + 1], times[i + 1]);
      });
      var SEND_AT = 0.63;
      off(carets[carets.length - 1], SEND_AT + 0.05); /* sent: the caret leaves */

      /* send: press + ripple */
      tl.fromTo(send1, { scale: 1 }, { scale: 0.9, duration: 0.07, ease: "power2.in", immediateRender: false }, SEND_AT);
      tl.fromTo(send1, { scale: 0.9 }, { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, SEND_AT + 0.07);
      tl.fromTo(ripple1, { scale: 0.8 }, { scale: 3.2, duration: 0.55, ease: "power2.out", immediateRender: false }, SEND_AT + 0.01);
      tl.fromTo(ripple1, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, SEND_AT + 0.01);
      tl.fromTo(ripple1, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, SEND_AT + 0.05);

      /* the bland site lands at 0.80, slightly tilted, its grey rows fill in */
      tl.fromTo(
        site,
        { opacity: 0, x: -50, scale: 0.92, rotation: 0 },
        { opacity: 1, x: 0, scale: 1, rotation: -2, duration: 0.6, ease: "power3.out", immediateRender: false },
        0.8,
      );
      tl.fromTo(
        siteRows,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.05, immediateRender: false },
        0.88,
      );
      /* "suffit" (1.54): the empty site sags a little more (the joke) */
      tl.fromTo(
        site,
        { rotation: -2, y: 0 },
        { rotation: -5, y: 16, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        1.54,
      );

      /* ================= Seam 1 -> 2 ================= */

      /* phrase: waterfall cut, phrase 1 rips leftward word by word, the last fade dies at CUT */
      var CUT = 2.34;
      var EX_MOVE = 0.34;
      var EX_FADE = 0.18;
      var EX_FADE_LAG = 0.07;
      var EX_STAG = 0.022;
      var exitUnits = [a[0], a[1], a[2], a[3], pill1];
      var lastExit = CUT - EX_FADE - EX_FADE_LAG;
      exitUnits.forEach(function (unit, i) {
        var s = lastExit - (exitUnits.length - 1 - i) * EX_STAG;
        tl.fromTo(unit, { x: 0 }, { x: -230, duration: EX_MOVE, ease: "power4.in", immediateRender: false }, s);
        tl.fromTo(
          unit,
          { opacity: 1 },
          { opacity: 0, duration: EX_FADE, ease: "power1.in", immediateRender: false },
          s + EX_FADE_LAG,
        );
      });

      /* scale-swap: Scene 1 rushes away (power2.in), the clean stage arrives (expo.out, frame.md bans back.out) */
      var SWAP_OUT = 2.16;
      var EXIT_DUR = 0.3;
      var OVERLAP = 0.14;
      var SWAP_IN = SWAP_OUT + EXIT_DUR - OVERLAP; /* 2.32 */
      tl.fromTo(
        s1,
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 0.72, opacity: 0, filter: "blur(18px)", duration: EXIT_DUR, ease: "power2.in", immediateRender: false },
        SWAP_OUT,
      );
      tl.fromTo(
        s2,
        { opacity: 0, scale: 0.72, filter: "blur(18px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: false },
        SWAP_IN,
      );
      tl.fromTo(halo, { x: 0, y: 0 }, { x: -350, y: -56, duration: 0.8, ease: "expo.out", immediateRender: false }, 2.2);

      /* ================= Scene 2 (2.20-3.90): « Il faut savoir [quoi dire,] » + lone caret ================= */

      function slideIn(node, at) {
        tl.fromTo(
          node,
          { x: 230, filter: "blur(8px)" },
          { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out", immediateRender: false },
          at,
        );
        tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, at);
      }
      slideIn(b[0], 2.34); /* Il 2.37 */
      slideIn(b[1], 2.47); /* faut 2.50 */
      slideIn(b[2], 2.63); /* savoir 2.66 */
      pillIn(pill2, pill2Bg, pill2Ch, 3.0); /* quoi 3.06, dire 3.34 */

      /* the caret blinks in finite steps (0.5 s period), then stays on */
      on(caretL, 2.5);
      off(caretL, 2.75);
      on(caretL, 3.0);
      off(caretL, 3.25);
      on(caretL, 3.5);
      off(caretL, 3.75);
      on(caretL, 4.0);

      /* ================= Scene 3 (3.90-7.10): the input shrinks up, three prompt-cards ================= */

      tl.fromTo(
        ask2,
        { scale: 1, y: 0 },
        { scale: 0.44, y: -276, duration: 0.55, ease: "power3.inOut", immediateRender: false },
        3.86,
      );
      tl.fromTo(halo, { x: -350, y: -56 }, { x: -350, y: -6, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 3.9);

      /* the empty column is established (dashed home slots 1, 2, 3) */
      holes.forEach(function (hole, i) {
        tl.fromTo(hole, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 3.98 + i * 0.06);
      });

      /* split-tilt-cards: each card slides in from its own side and pivots into its tilt (overshoot settles).
         Scrambled column, top to bottom = 2, 3, 1. Offsets are in the column's native px (column scale 0.88). */
      var PITCH = 186;
      var OVERSHOOT = 8;
      var SLIDE = 320;
      var CARDS = [
        { slot: slot1, at: 4.06, dur: 0.6, x: 100, y: 2 * PITCH, tilt: -13, rot: 2 } /* 1 lands in the bottom slot */,
        { slot: slot2, at: 5.06, dur: 0.6, x: 125, y: -PITCH, tilt: -14, rot: 3 } /* 2 lands in the top slot */,
        { slot: slot3, at: 5.69, dur: 0.4, x: -135, y: -PITCH, tilt: 14, rot: -3 } /* 3 lands in the middle slot */,
      ];
      CARDS.forEach(function (cd) {
        var side = cd.x > 0 ? 1 : -1;
        tl.fromTo(
          cd.slot,
          { x: cd.x + side * SLIDE, y: cd.y, rotationY: cd.tilt - side * OVERSHOOT, rotation: cd.rot, opacity: 0 },
          {
            x: cd.x,
            y: cd.y,
            rotationY: cd.tilt,
            rotation: cd.rot,
            opacity: 1,
            duration: cd.dur,
            ease: "power3.out",
            immediateRender: false,
          },
          cd.at,
        );
        /* copy fades up during the settle (from-state hidden, so the default immediate render is safe) */
        tl.fromTo(
          cd.slot.querySelectorAll(".f08-pcard-head, .f08-pcard-text"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 },
          cd.at + 0.14,
        );
      });

      /* 6.12 "ordre": all three straighten and snap into the order 1, 2, 3 (power3.out, 0.5 s) */
      var SNAP_AT = 6.12;
      CARDS.forEach(function (cd) {
        tl.fromTo(
          cd.slot,
          { x: cd.x, y: cd.y, rotationY: cd.tilt, rotation: cd.rot },
          { x: 0, y: 0, rotationY: 0, rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
          SNAP_AT,
        );
      });
      /* card 1 is lifted over the others on its way to the top */
      tl.fromTo(slot1, { scale: 1 }, { scale: 1.04, duration: 0.2, ease: "power2.out", immediateRender: false }, SNAP_AT);
      tl.fromTo(slot1, { scale: 1.04 }, { scale: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, SNAP_AT + 0.2);

      /* phrase 3 at the bottom, word by word (no pill: the sentence already has one) */
      wordIn(c[0], 4.07); /* quoi 4.10 */
      wordIn(c[1], 4.27); /* demander 4.30 */
      wordIn(c[2], 5.07); /* comment 5.10 */
      wordIn(c[3], 5.7); /* dans 5.73 */
      wordIn(c[4], 6.01); /* quel 6.04 */
      wordIn(c[5], 6.09); /* ordre 6.12 */

      /* hold to the end of the frame (no exit) */
      tl.set({}, {}, DURATION);

      window.__timelines[FID] = tl;
    })();
  </script>
</template>
