        ft(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };

      // ---------- Opening: the bubble pops above you (figures already on stage, same places as frame 02) ----------
      ft(byId("bub"), { opacity: 0, scale: 0.7, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);

      // word-by-word: each word ON its voice timestamp.
      all(byId("phrase"), ".f07-w").forEach(function (w) {
        ft(
          w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
          Math.max(0, Number(w.dataset.t) - 0.02)
        );
      });

      // ---------- The translator steps aside: dashed outline at 35%, then glides down out of frame by 1.30 ----------
      ft(byId("mid-solid"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, CUE.traducteur);
      ft(byId("ghost"), { opacity: 0 }, { opacity: 0.35, duration: 0.3, ease: "power1.out" }, CUE.traducteur);
      ft(byId("mid"), { y: 0 }, { y: 600, duration: 0.74, ease: "power3.in" }, 0.56);

      // ---------- accent-pill « plus indispensable. »: traces first (scaleX from the left, -8deg -> 0), then the letters write inside ----------
      var PILL_AT = CUE.plus - 0.06;
      ft(byId("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out" }, PILL_AT);
      ft(byId("pill-bg"), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out" }, PILL_AT);
      all(byId("pill"), ".f07-ch").forEach(function (c, i) {
        ft(c, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out" }, PILL_AT + 0.18 + i * 0.02);
      });

      // ---------- The direct line: your words go straight to the computer (svg-path-draw) ----------
      var LINE_AT = 1.12;
      ft(byId("halo"), { opacity: 0.6 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, LINE_AT);
      ft(byId("bub-face"), { scale: 1 }, { scale: 1.03, duration: 0.12, ease: "power2.out" }, LINE_AT - 0.02);
      ft(byId("bub-face"), { scale: 1.03 }, { scale: 1, duration: 0.26, ease: "power3.out" }, LINE_AT + 0.1);
      var dot = byId("dot");
      ft(dot, { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 7 }, duration: 0.18, ease: "power3.out" }, LINE_AT - 0.02);
      var line = byId("line");
      var arrow = byId("arrow");
      var lineLen = prep(line, 600);
      var arrowLen = prep(arrow, 50);
      draw(line, lineLen, 0.32, LINE_AT);
      // The arrowhead starts at ~75% of the line's draw so the stroke reads as one continuous trace.
      draw(arrow, arrowLen, 0.1, LINE_AT + 0.24);

      // ---------- The computer receives: jolt + bloom, the code cuts out upward, the French sentence cuts in ----------
      var LAND = 1.42;
      var PING = byId("ping");
      ft(PING, { scale: 1 }, { scale: 1.035, duration: 0.12, ease: "power2.out" }, LAND);
      ft(PING, { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power3.out" }, LAND + 0.12);
      ft(byId("bloom"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, LAND);
      ft(byId("glow"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, LAND);

      // cut-the-curve (upward, screen scale): exit ramps on power4.in, fade dies right at the cut, entry picks up on power4.out.
      var CUT = 1.44;
      var code = byId("code");
      ft(code, { y: 0 }, { y: -12, duration: 0.16, ease: "power4.in" }, CUT - 0.16);
      ft(code, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.in" }, CUT - 0.14);
      ft(byId("say"), { opacity: 0.35, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, CUT);

      // Accent check drawn on the screen at 1.50: ring from 12 o'clock, then the tick.
      var ring = byId("ring");
      var tick = byId("tick");
      var ringLen = prep(ring, 107);
      var tickLen = prep(tick, 24);
      draw(ring, ringLen, 0.28, 1.5);
      draw(tick, tickLen, 0.16, 1.5 + 0.2);

      // Hold to the end (no exit, no idle loop).
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-indispensable"] = tl;
    })();
  </script>
</template>
