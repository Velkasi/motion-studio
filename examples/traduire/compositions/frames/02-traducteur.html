        <div class="f02-line"><span class="f02-w" data-t="0.04">Et</span> <span class="f02-w" data-t="0.22">comme</span> <span class="f02-w" data-t="0.44">tu</span> <span class="f02-w" data-t="0.56">ne</span> <span class="f02-w" data-t="0.72">la</span> <span class="f02-w" data-t="0.88">parlais</span> <span class="f02-w" data-t="1.02">pas,</span></div>
        <div class="f02-line"><span class="f02-w" data-t="1.69">tu</span> <span class="f02-w" data-t="1.86">payais</span> <span id="f02-pill" class="f02-pill"><span id="f02-pill-bg" class="f02-pill-bg"></span><span class="f02-ch">u</span><span class="f02-ch">n</span><span class="f02-ch"> </span><span class="f02-ch">t</span><span class="f02-ch">r</span><span class="f02-ch">a</span><span class="f02-ch">d</span><span class="f02-ch">u</span><span class="f02-ch">c</span><span class="f02-ch">t</span><span class="f02-ch">e</span><span class="f02-ch">u</span><span class="f02-ch">r</span><span class="f02-ch">,</span></span></div>
        <div class="f02-line"><span class="f02-w" data-t="3.28">un</span> <span class="f02-w" data-t="3.56">d&eacute;veloppeur,</span> <span class="f02-w" data-t="4.47">une</span> <span class="f02-w" data-t="4.68">agence,</span> <span class="f02-w" data-t="5.38">un</span> <span class="f02-w" data-t="5.62">prestataire.</span></div>
      </div>
    </div>

    <div id="f02-grain" class="clip f02-grain" data-start="0" data-duration="6.8" data-track-index="2"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById("f02-" + name);
      };
      var all = function (scope, sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      var DURATION = 6.3;
      // Voice word cues: the single timing spine every reveal reads from.
      var CUE = {
        pas: 1.02,
        payais: 1.86,
        un1: 2.04,
        un2: 3.28,
        une: 4.47,
        un3: 5.38
      };

      var tl = gsap.timeline({ paused: true });
      // Every tween is an explicit fromTo that never renders before its own start.
      var ft = function (el, from, to, at) {
        to.immediateRender = false;
        tl.fromTo(el, from, to, at);
      };

      // ---------- Ground ----------
      ft(byId("halo-gap"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // ---------- Scene 1 (0.00-1.55): split stage, you | computer ----------
      // comparison-split signature: opposite-wing entry, mirrored book-open rotateY, left first, right 0.18s behind.
      ft(
        byId("side-l"),
        { x: -240, rotationY: 36, scale: 0.85, transformPerspective: 1400 },
        { x: 0, rotationY: 8, scale: 1, transformPerspective: 1400, duration: 0.8, ease: "expo.out" },
        0.02
      );
      ft(byId("side-l"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.02);
      ft(
        byId("side-r"),
        { x: 240, rotationY: -36, scale: 0.85, transformPerspective: 1400 },
        { x: 0, rotationY: -8, scale: 1, transformPerspective: 1400, duration: 0.8, ease: "expo.out" },
        0.2
      );
      ft(byId("side-r"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.2);

      // word-by-word: each word ON its voice timestamp.
      all(byId("phrase"), ".f02-w").forEach(function (w) {
        ft(
          w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
          Math.max(0, Number(w.dataset.t) - 0.02)
        );
      });

      // Speech bubble pops above you, then flies at the screen and bounces off.
      var BUB = byId("bub");
      ft(BUB, { opacity: 0, scale: 0.7, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.34);
      var HOME = { x: 0, y: 0, scale: 1, rotation: 0 };
      var HIT = { x: 882, y: 156, scale: 0.5, rotation: 7 };
      var BOUNCED = { x: 662, y: 228, scale: 0.46, rotation: -18 };
      var AT_TRANSLATOR = { x: 392, y: -24, scale: 0.9, rotation: 0 };
      var AT_SCREEN = { x: 932, y: 168, scale: 0.36, rotation: 0 };
      var mv = function (from, to, dur, ease, at) {
        var t = { x: to.x, y: to.y, scale: to.scale, rotation: to.rotation, duration: dur, ease: ease };
        ft(BUB, { x: from.x, y: from.y, scale: from.scale, rotation: from.rotation }, t, at);
      };
      mv(HOME, HIT, 0.13, "power2.in", 0.9);
      mv(HIT, BOUNCED, 0.33, "power3.out", 1.03);
      ft(BUB, { opacity: 1 }, { opacity: 0.55, duration: 0.2, ease: "none" }, 1.03);
      mv(BOUNCED, HOME, 0.3, "power3.inOut", 1.36);
      ft(BUB, { opacity: 0.55 }, { opacity: 1, duration: 0.24, ease: "none" }, 1.4);

      // Impact: the computer jolts, the SVG ✕ pops (it does not understand).
      var PING = byId("ping");
      ft(PING, { x: 0 }, { x: 9, duration: 0.05, ease: "power2.out" }, 1.03);
      ft(PING, { x: 9 }, { x: -5, duration: 0.07, ease: "power2.inOut" }, 1.08);
      ft(PING, { x: -5 }, { x: 0, duration: 0.14, ease: "power3.out" }, 1.15);
      var NOPE = byId("nope");
      ft(NOPE, { opacity: 0, scale: 0, rotation: -25 }, { opacity: 1, scale: 1.2, rotation: 0, duration: 0.12, ease: "power3.out" }, CUE.pas);
      ft(NOPE, { scale: 1.2 }, { scale: 1, duration: 0.18, ease: "power2.out" }, CUE.pas + 0.12);
      ft(NOPE, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.7, duration: 0.2, ease: "power2.in" }, 1.55);

      // ---------- Scene 2 (1.55-3.10): the translator steps in between ----------
      ft(byId("mid"), { y: 250 }, { y: 0, duration: 0.75, ease: "expo.out" }, 1.6);
      ft(byId("mid"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 1.6);
      ft(byId("halo-mid"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 1.6);

      // You -> translator; the bubble turns into a code line; translator -> computer.
      mv(HOME, AT_TRANSLATOR, 0.3, "power3.inOut", 1.74);
      ft(byId("bub-face"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.94, duration: 0.1, ease: "power1.in" }, 2.02);
      ft(byId("chip"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power1.out" }, 2.14);
      mv(AT_TRANSLATOR, AT_SCREEN, 0.3, "power2.inOut", 2.28);
      ft(BUB, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in" }, 2.5);

      // The computer lights up: screen glow, bloom, line 4 lands with its highlight row.
      var LIT = 2.56;
      ft(byId("glow"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, LIT);
      ft(byId("bloom"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, LIT);
      var sideR = byId("side-r");
      var hl = sideR.querySelector(".f02-comp-hl");
      gsap.set(hl, { transformOrigin: "0% 50%" });
      ft(hl, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, LIT);
      all(sideR, ".f02-comp-l4").forEach(function (el) {
        ft(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, LIT + 0.04);
      });
      ft(PING, { scale: 1 }, { scale: 1.035, duration: 0.12, ease: "power2.out" }, LIT);
      ft(PING, { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power3.out" }, LIT + 0.12);

      // « € » pill: you -> translator on « payais », over a small arc.
      var EURO = byId("euro");
      ft(EURO, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power3.out" }, CUE.payais);
      ft(EURO, { x: 0 }, { x: 375, duration: 0.46, ease: "power2.inOut" }, CUE.payais + 0.08);
      ft(EURO, { y: 0 }, { y: -110, duration: 0.23, ease: "power2.out" }, CUE.payais + 0.08);
      ft(EURO, { y: -110 }, { y: 10, duration: 0.23, ease: "power2.in" }, CUE.payais + 0.31);

      // accent-pill « un traducteur, »: traces first (scaleX from the left, -8deg -> 0), then the letters write inside.
      var PILL_AT = CUE.un1 - 0.06;
      ft(byId("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out" }, PILL_AT);
      ft(byId("pill-bg"), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out" }, PILL_AT);
      all(byId("pill"), ".f02-ch").forEach(function (c, i) {
        ft(c, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out" }, PILL_AT + 0.18 + i * 0.02);
      });

      // ---------- Scene 3 (3.10-6.30): the role card hard-swaps on each beat ----------
      // kinetic-beat-slam: one beat array drives the card, its swaps and the camera kicks.
      var BEATS = [CUE.un2, CUE.une, CUE.un3];
      var CAM = byId("cam");
      var KICK_ROT = [-0.4, 0.35, -0.3];
      BEATS.forEach(function (b, k) {
        ft(CAM, { scale: 1.014, y: -8, rotation: KICK_ROT[k] }, { scale: 1, y: 0, rotation: 0, duration: 0.34, ease: "power4.out" }, b);
      });

      var CARD = byId("idcard");
      var DEV = byId("role-dev");
      var AG = byId("role-ag");
      var PR = byId("role-pr");
      // Beat 1: the card slams in (scale + blur, power4.out) carrying « Développeur ».
      ft(CARD, { scale: 1.28, y: -12, filter: "blur(12px)" }, { scale: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, BEATS[0]);
      ft(CARD, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, BEATS[0]);
      ft(DEV, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, BEATS[0] + 0.02);

      // card-morph-anchor: one tween carries scale + borderRadius (pre-scale) + boxShadow; old content fades
      // in the first 40%, the new content lands just after the beat with its own distinct entrance.
      var SH_BASE = "inset 0px 1px 0px 0px rgba(255,255,255,0.14), 0px 50px 120px 0px rgba(0,0,0,0.7), 0px 0px 0px 0px rgba(194,91,40,0)";
      var SH_DEEP = "inset 0px 1px 0px 0px rgba(255,255,255,0.14), 0px 64px 140px 0px rgba(0,0,0,0.8), 0px 0px 0px 0px rgba(194,91,40,0)";
      var SH_GLOW = "inset 0px 1px 0px 0px rgba(255,255,255,0.14), 0px 50px 120px 0px rgba(0,0,0,0.7), 0px 0px 44px 0px rgba(194,91,40,0.3)";
      var MORPH_DUR = 0.56;
      var morph = function (beat, oldEl, fromScale, toScale, fromShadow, toShadow) {
        var start = beat - 0.28;
        ft(
          CARD,
          { scale: fromScale, borderRadius: 14 / fromScale, boxShadow: fromShadow },
          { scale: toScale, borderRadius: 14 / toScale, boxShadow: toShadow, duration: MORPH_DUR, ease: "power2.inOut" },
          start
        );
        ft(oldEl, { opacity: 1 }, { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, start);
      };

      // Beat 2: « Agence », the card grows and deepens; content side-snaps in (expo.out).
      morph(BEATS[1], DEV, 1, 1.08, SH_BASE, SH_DEEP);
      ft(AG, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, BEATS[1] + 0.03);

      // Beat 3: « Prestataire », the card settles smaller with a faint accent glow; content rises + rotates (circ.out).
      morph(BEATS[2], AG, 1.08, 0.97, SH_DEEP, SH_GLOW);
      ft(PR, { opacity: 0, y: 34, rotation: 5 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "circ.out" }, BEATS[2] + 0.03);

      // Hold to the end (no exit, no breathing loop).
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-traducteur"] = tl;
    })();
  </script>
</template>
