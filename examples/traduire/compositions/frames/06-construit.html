      tl.fromTo(

        { scale: 0.85 },
        { scale: 1, duration: RELEASE, ease: "power2.out", immediateRender: false },
        CLICK_AT + PRESS,
      );
      tl.fromTo(send, { scale: 1 }, { scale: 0.94, duration: PRESS, ease: "power2.in", immediateRender: false }, CLICK_AT);
      tl.fromTo(
        send,
        { scale: 0.94 },
        { scale: 1, duration: RELEASE, ease: "power2.out", immediateRender: false },
        CLICK_AT + PRESS,
      );
      tl.fromTo(
        ripple,
        { scale: 0.4 },
        { scale: 4, duration: 0.6, ease: "power2.out", immediateRender: false },
        RIPPLE_AT,
      );
      tl.fromTo(ripple, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, RIPPLE_AT);
      tl.fromTo(
        ripple,
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false },
        RIPPLE_AT + 0.04,
      );

      /* ---------- Scene seam (cut the curve, upward): the input slides up and away ---------- */
      var EXIT_AT = 2.4;
      var EXIT_DUR = 0.36;
      tl.fromTo(
        ask,
        { y: 0, filter: "blur(0px)" },
        { y: -300, filter: "blur(18px)", duration: EXIT_DUR, ease: "power3.in", immediateRender: false },
        EXIT_AT,
      );
      tl.fromTo(ask, { opacity: 1 }, { opacity: 0, duration: 0.26, ease: "none", immediateRender: false }, EXIT_AT + 0.06);

      /* phrase seam (cut catalog: waterfall cut, leftward). The last fade dies at the cut (2.76),
         phrase B continues leftward on its cues. */
      var CUT = 2.76;
      var EX_MOVE = 0.34;
      var EX_FADE = 0.18;
      var EX_FADE_LAG = 0.07;
      var EX_STAG = 0.022;
      var exitUnits = [el("a1"), el("a2"), el("a3"), el("a4"), el("a5"), el("a6"), el("a7"), pill1];
      var lastExit = CUT - EX_FADE - EX_FADE_LAG;
      exitUnits.forEach(function (unit, i) {
        var s = lastExit - (exitUnits.length - 1 - i) * EX_STAG;
        tl.fromTo(unit, { x: 0 }, { x: -230, duration: EX_MOVE, ease: "power4.in", immediateRender: false }, s);
        tl.fromTo(
          unit,
          { opacity: 1 },
          { opacity: 0, duration: EX_FADE, ease: "power1.in", immediateRender: false },
          s + EX_FADE_LAG,
        );
      });

      function slideIn(node, at) {
        tl.fromTo(
          node,
          { x: 230, filter: "blur(8px)" },
          { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out", immediateRender: false },
          at,
        );
        tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, at);
      }
      slideIn(el("b1"), CUT); /* Il@2.79 */
      slideIn(el("b2"), 2.91); /* le@2.94 */
      pillIn(pill2, pill2Bg, pill2Ch, 3.16); /* construit@3.20 */

      /* ---------- Scene 2 (2.50-4.30): the page assembles from scattered blocks ---------- */

      /* the browser shell rises out of depth as the receiving surface (full-frame blur 18px) */
      var SHELL_AT = 2.52;
      tl.fromTo(shell, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false }, SHELL_AT);
      tl.fromTo(
        shell,
        { scale: 0.9, y: 40, filter: "blur(18px)" },
        { scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", immediateRender: false },
        SHELL_AT,
      );
      tl.fromTo(halo, { opacity: 0.75 }, { opacity: 1, duration: 0.8, ease: "expo.out", immediateRender: false }, SHELL_AT);

      /* depth-scatter-assemble: each block parked at an index-derived cloud point
         (golden-angle spread, stepped depth, sin/cos tumble), then it flies flat to its slot.
         Blocks sit at their final layout in CSS, so the flat target is x = y = z = 0. */
      var frags = [el("frag-nav"), el("frag-head"), el("frag-o1"), el("frag-o2"), el("frag-o3")];
      var n = frags.length;
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var PHASE = 1.8; /* rotates the whole cloud so every parked block stays in frame, above y 900 */
      var RADIUS_X = 440;
      var RADIUS_Y = 230;
      var Z_NEAR = 300;
      var Z_FAR = -400;
      var TUMBLE = 56;
      var ASSEMBLE_DUR = 0.72;
      var ASSEMBLE_EASE = "power3.out";
      /* nav + title first, then the three offer cards land (~80% settled) at 2.90 / 3.10 / 3.30 */
      var STARTS = [2.5, 2.56, 2.6, 2.8, 3.0];

      var scatter = frags.map(function (node, i) {
        var a = i * GOLDEN + PHASE;
        var depthT = n > 1 ? i / (n - 1) : 0;
        return {
          x: Math.cos(a) * RADIUS_X,
          y: Math.sin(a) * RADIUS_Y,
          z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(a) * TUMBLE,
          rotationY: Math.cos(a) * TUMBLE,
        };
      });

      /* 1) park every block in the cloud before any tween */
      frags.forEach(function (node, i) {
        var s = scatter[i];
        gsap.set(node, {
          x: s.x,
          y: s.y,
          z: s.z,
          rotationX: s.rotationX,
          rotationY: s.rotationY,
          opacity: 0,
        });
      });
      gsap.set(cloud, { rotationY: -14 });

      /* 2) the cloud turns and settles flat while it collapses (resolves at rotation 0) */
      tl.fromTo(
        cloud,
        { rotationY: -14 },
        { rotationY: 0, duration: 3.72 - 2.5, ease: "power2.out", immediateRender: false },
        2.5,
      );

      /* 3) assemble: cloud point -> flat slot */
      frags.forEach(function (node, i) {
        var s = scatter[i];
        tl.fromTo(
          node,
          { x: s.x, y: s.y, z: s.z, rotationX: s.rotationX, rotationY: s.rotationY, opacity: 0 },
          {
            x: 0,
            y: 0,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            opacity: 1,
            duration: ASSEMBLE_DUR,
            ease: ASSEMBLE_EASE,
            immediateRender: false,
          },
          STARTS[i],
        );
      });

      /* hold on the built page to the end (no exit) */
      tl.set({}, {}, DURATION);

      window.__timelines["06-construit"] = tl;
    })();
  </script>
