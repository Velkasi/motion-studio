          <span class="f03-pill" data-trace="4.02"><span class="f03-pillbg"></span><span class="f03-pw" data-cue="4.08"><span class="f03-l">t</span><span class="f03-l">u</span></span> <span class="f03-pw" data-cue="4.30"><span class="f03-l">p</span><span class="f03-l">a</span><span class="f03-l">y</span><span class="f03-l">a</span><span class="f03-l">i</span><span class="f03-l">s</span><span class="f03-l">.</span></span></span>
        </span>
      </div>
    </div>

    <div id="f03-grain" class="clip" data-start="0" data-duration="5.4" data-track-index="2" data-layout-ignore></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-boucle";
      var DUR = 5.4;
      var root = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function $(id) { return root.querySelector("#f03-" + id) || document.getElementById("f03-" + id); }
      function $$(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }
      function px(v) { return parseFloat(v) || 0; }

      var tl = gsap.timeline({ paused: true });

      // voice cues (word timestamps)
      var T_S1 = 0.10, T_S2 = 1.79, T_S3 = 2.93, T_S4 = 4.08;
      var T_GO = 0.40; // the dot leaves station 1 (hidden under it) once the loop is nearly closed

      // ---------- ground halo ----------
      tl.fromTo($("halo"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.01);

      // =====================================================================
      // loop (lifted with the #f03-loop block)
      // =====================================================================
      var track = $("track");
      var RX = 650, RY = 310, CX = 900, CY = 390;
      var L = Math.PI * (3 * (RX + RY) - Math.sqrt((3 * RX + RY) * (RX + 3 * RY)));
      try { L = track.getTotalLength() || L; } catch (e) {}
      function pointAt(s) {
        try { return track.getPointAtLength(s); } catch (e) {
          var a = (s / L) * Math.PI * 2;
          return { x: CX + RX * Math.sin(a), y: CY - RY * Math.cos(a) };
        }
      }

      // svg-path-draw: the accent loop traces itself from 12 o'clock, clockwise, 0.0 -> 0.5
      var DRAW_DUR = 0.5;
      track.style.strokeDasharray = L + " " + L;
      track.style.strokeDashoffset = String(L);
      tl.set(track, { opacity: 1 }, 0.01);
      tl.fromTo(track, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" }, 0);

      // stations: geometry from inline styles (wrapper coordinates)
      var ST = [1, 2, 3, 4].map(function (n) {
        var el = $("st" + n);
        return { n: n, el: el, x: px(el.style.left), y: px(el.style.top), w: px(el.style.width), h: px(el.style.height) };
      });
      ST.forEach(function (s) { gsap.set(s.el, { scale: 0.94 }); });
      function inside(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
      // arc length where the path enters station i's card (walking back from the station's own point)
      function entryOf(i) {
        var c = i === 0 ? L : (L * i) / 4;
        var s = c;
        for (var k = 0; k < 1200; k++) {
          if (!inside(ST[i], pointAt(s))) return s + 1;
          s -= 1;
        }
        return c;
      }
      var E1 = entryOf(0), E2 = entryOf(1), E3 = entryOf(2), E4 = entryOf(3);

      // dim stations (40%) fade in as the pen reaches them (inverse of power2.out = cubic out)
      function penTime(s) { return DRAW_DUR * (1 - Math.cbrt(1 - Math.min(0.999, s / L))); }
      tl.fromTo(ST[0].el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.02);
      [[1, E2], [2, E3], [3, E4]].forEach(function (p) {
        tl.fromTo(ST[p[0]].el, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, Math.max(0.02, penTime(p[1]) - 0.04));
      });

      // a station lights up when the dot reaches it: 40% -> 100%, scale 0.94 -> 1, ring + halo
      function lightStation(n, t) {
        var st = $("st" + n), card = $("card" + n), ring = $("ring" + n), halo = $("sthalo" + n);
        tl.fromTo(st, { scale: 0.94 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(card, { opacity: 0.4 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(ring, { opacity: 1 }, { opacity: 0.3, duration: 0.6, ease: "power1.out", immediateRender: false }, t + 0.3);
        tl.fromTo(halo, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
        tl.fromTo(halo, { opacity: 1 }, { opacity: 0.45, duration: 0.8, ease: "power1.out", immediateRender: false }, t + 0.35);
      }
      lightStation(1, T_S1);
      lightStation(2, T_S2);
      lightStation(3, T_S3);
      lightStation(4, T_S4);

      // the traveling dot + comet trail: seek-safe proxy, its setter places everything (no update callback)
      var dotPos = $("dotpos"), dotHalo = $("dothalowrap");
      var trails = [$("trail1"), $("trail2"), $("trail3")].map(function (p) {
        var T = px(p.getAttribute("data-len"));
        p.style.strokeDasharray = T + " " + (L + T + 20);
        p.style.strokeDashoffset = String(T);
        return { el: p, T: T };
      });
      function placeDot(s) {
        var sm = ((s % L) + L) % L;
        var pt = pointAt(sm);
        var tr = "translate(" + pt.x.toFixed(2) + "px, " + pt.y.toFixed(2) + "px)";
        dotPos.style.transform = tr;
        dotHalo.style.transform = tr;
        for (var i = 0; i < trails.length; i++) trails[i].el.style.strokeDashoffset = (trails[i].T - sm).toFixed(2);
      }
      var dot = { _s: 0 };
      Object.defineProperty(dot, "s", {
        get: function () { return this._s; },
        set: function (v) { this._s = v; placeDot(v); },
        enumerable: true
      });
      placeDot(0);

      // reaches each station's edge exactly on its cue; constant speed per leg (speed changes hide under the cards)
      var vC = (E4 - E3) / (T_S4 - T_S3);
      var S_END = E4 + vC * (DUR - T_S4);
      tl.fromTo(dot, { s: 0 }, { s: E2, duration: T_S2 - T_GO, ease: "none", immediateRender: false }, T_GO);
      tl.fromTo(dot, { s: E2 }, { s: E3, duration: T_S3 - T_S2, ease: "none", immediateRender: false }, T_S2);
      tl.fromTo(dot, { s: E3 }, { s: E4, duration: T_S4 - T_S3, ease: "none", immediateRender: false }, T_S3);
      tl.fromTo(dot, { s: E4 }, { s: S_END, duration: DUR - T_S4, ease: "none", immediateRender: false }, T_S4);

      tl.fromTo($("dot"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, T_GO);
      tl.fromTo(dotHalo, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, T_GO);
      tl.fromTo(trails.map(function (t) { return t.el; }), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, T_GO);

      // the loop restarts: the dot comes back to station 1, which lights again
      var T_REDO = T_S4 + (E1 - E4) / vC;
      if (T_REDO < DUR - 0.2) {
        tl.fromTo($("ring1"), { opacity: 0.3 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, T_REDO);
        tl.fromTo($("ring1"), { opacity: 1 }, { opacity: 0.55, duration: Math.max(0.1, DUR - T_REDO - 0.3), ease: "power1.out", immediateRender: false }, T_REDO + 0.25);
        tl.fromTo($("sthalo1"), { opacity: 0.45 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, T_REDO);
      }

      // station 1 content: the e-mail body writes itself while you explain
      tl.fromTo($("bar1"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.34);
      tl.fromTo($("bar2"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.8);

      // station 2 content: the three canonical code lines type in (clip steps, one char per step)
      [["cl1", 1.84, 0.3], ["cl2", 2.1, 0.26], ["cl3", 2.36, 0.16]].forEach(function (c) {
        var el = $(c[0]);
        var n = parseInt(el.getAttribute("data-chars"), 10) || 20;
        tl.fromTo(el,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: c[2], ease: "steps(" + n + ")", immediateRender: false },
          c[1]);
      });

      // station 3 content: J+1 -> J+3 -> J+7 -> J+12 by hard cuts, the days fill up
      var days = $$(".f03-day");
      var FLIPS = [
        { t: T_S3, id: "j1", lit: 1 },
        { t: 3.16, id: "j3", lit: 3 },
        { t: 3.42, id: "j7", lit: 7 },
        { t: 3.68, id: "j12", lit: 12 }
      ];
      var prevId = null, prevLit = 0;
      FLIPS.forEach(function (f) {
        if (prevId) {
          tl.set($(prevId), { opacity: 0 }, f.t);
          tl.set($(f.id), { opacity: 1 }, f.t);
          tl.fromTo($("num"), { scale: 1.12 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, f.t);
        }
        days.forEach(function (d, i) {
          if (i >= prevLit && i < f.lit) {
            tl.set(d, { backgroundColor: "#a84d22", boxShadow: "0 0 8px rgba(224, 138, 92, 0.3)" }, f.t);
          }
        });
        prevId = f.id;
        prevLit = f.lit;
      });

      // svg-icon-enrichment: the clock hands spin while you wait (SVG transform attribute, proxy setter)
      var mh = $("mhand"), hh = $("hhand");
      var clock = { _d: 0 };
      Object.defineProperty(clock, "d", {
        get: function () { return this._d; },
        set: function (v) {
          this._d = v;
          mh.setAttribute("transform", "rotate(" + v.toFixed(2) + " 23 23)");
          hh.setAttribute("transform", "rotate(" + (90 + v / 12).toFixed(2) + " 23 23)");
        },
        enumerable: true
      });
      clock.d = 0;
      tl.fromTo(clock, { d: 0 }, { d: 792, duration: DUR - T_S3, ease: "none", immediateRender: false }, T_S3);

      // station 4 content: the amount lands on "payais"
      tl.fromTo($("amt"), { scale: 1.2 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.3);

      // =====================================================================
      // phrase: word by word + one traced accent pill
      // =====================================================================
      $$(".f03-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
          t);
      });
      $$(".f03-pill").forEach(function (p) {
        var t = parseFloat(p.getAttribute("data-trace"));
        var bg = p.querySelector(".f03-pillbg");
        tl.set(bg, { opacity: 1 }, t);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, t);
        tl.fromTo(bg, { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out" }, t);
      });
      $$(".f03-pw").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        var letters = Array.prototype.slice.call(w.querySelectorAll(".f03-l"));
        tl.fromTo(letters,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", stagger: 0.02 },
          t);
      });

      // hold to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
