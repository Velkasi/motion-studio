  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "04-casse";
      var DUR = 4.1;
      var root = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function $(id) { return root.querySelector("#f04-" + id) || document.getElementById("f04-" + id); }
      function $$(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }
      function px(v) { return parseFloat(v) || 0; }
      // seek-safe proxy: the setter does the DOM write, so any seek recomputes the frame
      function proxy(init, fn) {
        var o = { _v: init };
        Object.defineProperty(o, "v", {
          get: function () { return this._v; },
          set: function (n) { this._v = n; fn(n); },
          enumerable: true
        });
        return o;
      }

      var tl = gsap.timeline({ paused: true });

      // ---------- timing (voice cues + beats) ----------
      var T_BREAK = 1.04;      // "cassait"
      var T_SHRINK = 1.45;     // Scene 2: the site shrinks into station 1
      var D_SHRINK = 0.3;
      var T_PEN = 1.48, D_PEN = 0.3;
      var T_ST1 = 1.72;        // station 1 catches the site
      var LAPS = [             // TOUR 2, 3, 4: faster on each lap
        { t0: 1.74, d: 0.42 },
        { t0: 2.16, d: 0.26 },
        { t0: 2.42, d: 0.20 }
      ];
      var T_CUT = 2.62;        // hard cut: the stage is empty
      var T_ON1 = 2.70, T_OFF = 3.10, T_ON2 = 3.40, T_GLOW = 3.55;

      // =====================================================================
      // Scene 1: the site, then it breaks
      // =====================================================================
      var halo = $("halo"), site = $("site"), stage = $("stage");
      // hard cut in: the site is already on screen at the first frame (no empty dark frame at the cut)
      tl.fromTo(halo, { opacity: 0.5 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
      tl.fromTo(site,
        { opacity: 0.7, scale: 1.03, filter: "blur(4px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        0);

      // chromatic-glitch (accent + white channels only): quantized time, deterministic hash, envelope 1 -> 0
      var G_DUR = 0.25, G_STEP = 1 / 24;
      function glitchHash(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      var gLayers = [
        { el: $("gA"), max: 14, sign: 1, op: 0.85 },
        { el: $("gW"), max: 14, sign: -1, op: 0.7 },
        { el: $("tA"), max: 9, sign: 1, op: 0.72 },
        { el: $("uA"), max: 6, sign: 1, op: 0.85 },
        { el: $("uW"), max: 6, sign: -1, op: 0.85 }
      ];
      function applyGlitch(t) {
        var p = Math.min(1, Math.max(0, t / G_DUR));
        var a = p >= 1 ? 0 : 1 - p * p * p; // power3.in decay: most of the violence up front
        var step = Math.floor((T_BREAK + t) / G_STEP + 1e-6);
        var h = glitchHash(step * 13);
        var dir = h > 0.5 ? 1 : -1;
        var mag = 0.35 + 0.65 * glitchHash(step * 17 + 3);
        gLayers.forEach(function (g, layer) {
          var jx = g.sign * dir * mag * g.max * a * (0.75 + 0.25 * glitchHash(step * 5 + layer * 7));
          var jy = (glitchHash(step * 29 + layer * 11) * 2 - 1) * g.max * 0.35 * a;
          g.el.style.transform = "translate(" + jx.toFixed(2) + "px, " + jy.toFixed(2) + "px)";
        });
      }
      applyGlitch(G_DUR); // rest state: every ghost at exactly 0
      var glitch = proxy(0, applyGlitch);
      gLayers.forEach(function (g) { tl.set(g.el, { opacity: g.op }, T_BREAK); });
      tl.fromTo(glitch, { v: 0 }, { v: G_DUR, duration: G_DUR, ease: "none", immediateRender: false }, T_BREAK);
      // clean resolve: clamp the ghosts off, bit-exact
      gLayers.forEach(function (g) { tl.set(g.el, { opacity: 0 }, T_BREAK + G_DUR); });

      // two blocks drop and tilt, the error badge pops
      tl.fromTo($("blkA"), { y: 0, rotation: 0 }, { y: 54, rotation: 8, duration: 0.3, ease: "power2.in", immediateRender: false }, 1.08);
      tl.fromTo($("blkB"), { y: 0, rotation: 0 }, { y: 42, rotation: -9, duration: 0.28, ease: "power2.in", immediateRender: false }, 1.14);
      tl.fromTo($("badge"),
        { opacity: 0, scale: 0.55, rotation: -12 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "expo.out" },
        1.12);

      // =====================================================================
      // Scene 2: the site shrinks into station 1 of the loop (morph onto its 227x59 box)
      // =====================================================================
      tl.fromTo(site,
        { scaleX: 1, scaleY: 1, y: 0, filter: "blur(0px)" },
        { scaleX: 0.252, scaleY: 0.113, y: -130.2, filter: "blur(6px)", duration: D_SHRINK, ease: "power3.inOut", immediateRender: false },
        T_SHRINK);
      tl.fromTo(site, { opacity: 1 }, { opacity: 0, duration: 0.11, ease: "none", immediateRender: false }, T_SHRINK + D_SHRINK - 0.11);

      // =====================================================================
      // loop (lifted from frame 03 with the #f04-loop block), shown at 0.42
      // =====================================================================
      var loop = $("loop");
      gsap.set(loop, { scale: 0.42, transformOrigin: "50% 50%" });

      var track = $("track");
      var RX = 650, RY = 310, CX = 900, CY = 390;
      var L = Math.PI * (3 * (RX + RY) - Math.sqrt((3 * RX + RY) * (RX + 3 * RY)));
      try { L = track.getTotalLength() || L; } catch (e) {}
      function pointAt(s) {
        try { return track.getPointAtLength(s); } catch (e) {
          var ang = (s / L) * Math.PI * 2;
          return { x: CX + RX * Math.sin(ang), y: CY - RY * Math.cos(ang) };
        }
      }

      // svg-path-draw: the accent loop traces itself from 12 o'clock, clockwise
      track.style.strokeDasharray = L + " " + L;
      track.style.strokeDashoffset = String(L);
      tl.set(track, { opacity: 1 }, T_PEN);
      tl.fromTo(track, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: D_PEN, ease: "power2.out", immediateRender: false }, T_PEN);

      // stations: geometry from inline styles (wrapper coordinates)
      var ST = [1, 2, 3, 4].map(function (n) {
        var el = $("st" + n);
        return { n: n, el: el, x: px(el.style.left), y: px(el.style.top), w: px(el.style.width), h: px(el.style.height) };
      });
      ST.forEach(function (s) { gsap.set(s.el, { scale: 0.94 }); });
      function inside(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
      function entryOf(i) {
        var c = i === 0 ? L : (L * i) / 4;
        var s = c;
        for (var k = 0; k < 1200; k++) {
          if (!inside(ST[i], pointAt(s))) return s + 1;
          s -= 1;
        }
        return c;
      }
      var E = [entryOf(0), entryOf(1), entryOf(2), entryOf(3)];

      // dim stations fade in as the pen reaches them; station 1 fades in under the landing site
      function penTime(s) { return D_PEN * (1 - Math.cbrt(1 - Math.min(0.999, s / L))); }
      tl.fromTo(ST[0].el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, T_ST1 - 0.1);
      [1, 2, 3].forEach(function (i) {
        tl.fromTo(ST[i].el, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, T_PEN + Math.max(0.01, penTime(E[i]) - 0.03));
      });

      // a station lights on its first pass (40% -> 100%, 0.94 -> 1, halo); every pass flashes its ring
      function flashRing(n, t) {
        tl.fromTo($("ring" + n), { opacity: 1 }, { opacity: 0.3, duration: 0.18, ease: "power1.out", immediateRender: false }, t);
      }
      function lightStation(n, t) {
        tl.fromTo($("st" + n), { scale: 0.94 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo($("card" + n), { opacity: 0.4 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo($("sthalo" + n), { opacity: 0 }, { opacity: 0.5, duration: 0.2, ease: "power1.out", immediateRender: false }, t);
        flashRing(n, t);
      }
      lightStation(1, T_ST1);

      // the traveling dot + comet trail: seek-safe proxy, its setter places everything
      var dotPos = $("dotpos"), dotHalo = $("dothalowrap");
      var trails = [$("trail1"), $("trail2"), $("trail3")].map(function (p) {
        var T = px(p.getAttribute("data-len"));
        p.style.strokeDasharray = T + " " + (L + T + 20);
        p.style.strokeDashoffset = String(T);
        return { el: p, T: T };
      });
      function placeDot(s) {
        var sm = ((s % L) + L) % L;
        var pt = pointAt(sm);
        var tr = "translate(" + pt.x.toFixed(2) + "px, " + pt.y.toFixed(2) + "px)";
        dotPos.style.transform = tr;
        dotHalo.style.transform = tr;
        for (var i = 0; i < trails.length; i++) trails[i].el.style.strokeDashoffset = (trails[i].T - sm).toFixed(2);
      }
      var dot = proxy(0, placeDot);
      placeDot(0);

      // one tween per lap, constant speed inside a lap; the speed steps up under station 1 (12 o'clock)
      LAPS.forEach(function (lap, k) {
        tl.fromTo(dot, { v: k * L }, { v: (k + 1) * L, duration: lap.d, ease: "none", immediateRender: false }, lap.t0);
        [1, 2, 3].forEach(function (i) {
          var t = lap.t0 + lap.d * (E[i] / L);
          if (k === 0) lightStation(i + 1, t); else flashRing(i + 1, t);
        });
        var t1 = lap.t0 + lap.d * (E[0] / L);
        if (t1 < T_CUT - 0.01) flashRing(1, t1);
      });

      var T_GO = LAPS[0].t0;
      tl.fromTo($("dot"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, T_GO);
      tl.fromTo(dotHalo, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, T_GO);
      tl.fromTo(trails.map(function (t) { return t.el; }), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, T_GO);

      // svg-icon-enrichment: the clock hands spin while the loop runs (SVG transform attribute, proxy setter)
      var mh = $("mhand"), hh = $("hhand");
      var clock = proxy(0, function (d) {
        mh.setAttribute("transform", "rotate(" + d.toFixed(2) + " 23 23)");
        hh.setAttribute("transform", "rotate(" + (90 + d / 12).toFixed(2) + " 23 23)");
      });
      tl.fromTo(clock, { v: 0 }, { v: 1080, duration: T_CUT - T_PEN, ease: "none", immediateRender: false }, T_PEN);

      // =====================================================================
      // TOUR counter: vertical-spring-ticker, additive steps, no overshoot (power3.out)
      // =====================================================================
      var count = $("count"), tickIn = $("tickin");
      var ITEM_H = 46;
      var springs = [];
      function applyTicker() {
        var sum = 0;
        for (var i = 0; i < springs.length; i++) sum += springs[i]._v;
        tickIn.style.transform = "translateY(" + (-sum * ITEM_H).toFixed(2) + "px)";
      }
      springs.push(proxy(0, applyTicker));
      springs.push(proxy(0, applyTicker));
      applyTicker();
      tl.fromTo(count, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.66);
      tl.fromTo(springs[0], { v: 0 }, { v: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, LAPS[1].t0); // TOUR 3
      tl.fromTo(springs[1], { v: 0 }, { v: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, LAPS[2].t0); // TOUR 4

      // =====================================================================
      // phrase: word by word + one traced accent pill
      // =====================================================================
      $$(".f04-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
          t);
      });
      $$(".f04-pill").forEach(function (p) {
        var t = parseFloat(p.getAttribute("data-trace"));
        var bg = p.querySelector(".f04-pillbg");
        tl.set(bg, { opacity: 1 }, t);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, t);
        tl.fromTo(bg, { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out" }, t);
      });
      $$(".f04-pw").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        var letters = Array.prototype.slice.call(w.querySelectorAll(".f04-l"));
        tl.fromTo(letters,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", stagger: 0.02 },
          t);
      });

      // =====================================================================
      // Scene 3: hard cut, empty dark stage, one caret, then light
      // =====================================================================
      tl.set(stage, { opacity: 0 }, T_CUT);
      tl.set(halo, { opacity: 0 }, T_CUT);

      var caret = $("caret");
      // finite blink steps
      tl.set(caret, { opacity: 1 }, T_ON1);
      tl.set(caret, { opacity: 0 }, T_OFF);
      tl.set(caret, { opacity: 1 }, T_ON2);

      // the caret glows...
      tl.fromTo(caret, { backgroundColor: "#d4703f" }, { backgroundColor: "#fff3ea", duration: 0.18, ease: "power2.out", immediateRender: false }, T_GLOW);
      tl.fromTo($("caretglow"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, T_GLOW);
      // ...and contracts into a point at (960, 540)
      tl.fromTo(caret, { scaleY: 1 }, { scaleY: 0.07, duration: 0.2, ease: "power3.in", immediateRender: false }, 3.62);
      tl.fromTo($("caretglow"), { scaleY: 1, scaleX: 1 }, { scaleY: 0.55, scaleX: 0.9, duration: 0.2, ease: "power3.in", immediateRender: false }, 3.62);
      // the light-point ignites at the contraction and brightens to the end (the flood takes it from 3.75)
      tl.fromTo($("core"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 3.7);
      tl.fromTo($("lp"), { opacity: 0, scale: 0.04 }, { opacity: 1, scale: 0.38, duration: 0.18, ease: "power2.out" }, 3.68);
      tl.fromTo($("lp"), { scale: 0.38 }, { scale: 1, duration: DUR - 3.86, ease: "power2.in", immediateRender: false }, 3.86);
      tl.fromTo($("bloom"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: DUR - 3.72, ease: "power2.in" }, 3.72);

      // hold to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
