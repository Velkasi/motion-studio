              <div class="f09-cl" data-r="20" data-c="2" style="left:1304px;top:836px">}</div>
            </div>
          </div>
        </div>
        <div id="f09-s2phrase" class="f09-phrase">
          <div class="f09-line"><span id="f09-b1" class="f09-w">Et</span> <span id="f09-b2" class="f09-w">pas</span> <span id="f09-b3" class="f09-w">besoin</span> <span id="f09-b4" class="f09-w">d’être</span> <span id="f09-b5" class="f09-w">technique,</span></div>
        </div>
      </div>

      <!-- Scene 3 (3.25-6.05, held to 6.80 under the iris): the learning path, station 0 « TU ES ICI » -->
      <div id="f09-s3">
        <div id="f09-glow" data-layout-ignore></div>
        <div id="f09-core" data-layout-ignore></div>
        <svg id="f09-pathsvg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" data-layout-ignore>
          <path id="f09-path" d="M 560 600 L 1360 600" />
        </svg>
        <div id="f09-filltrack" data-layout-ignore><div id="f09-fill"></div></div>
        <div id="f09-st1" class="f09-station">1</div>
        <div id="f09-st2" class="f09-station">2</div>
        <div id="f09-st3" class="f09-station">3</div>
        <div id="f09-st4" class="f09-station">4</div>
        <div id="f09-st0" class="f09-station">0<div id="f09-lit">0</div></div>
        <div id="f09-stem"></div>
        <div id="f09-tagwrap">
          <div id="f09-tag">Tu es ici</div>
        </div>
        <div id="f09-s3phrase" class="f09-phrase">
          <div class="f09-line"><span id="f09-c1" class="f09-w">c’est</span> <span id="f09-c2" class="f09-w">pensé</span> <span id="f09-c3" class="f09-w">pour</span> <span id="f09-c4" class="f09-w">ceux</span> <span id="f09-c5" class="f09-w">qui</span> <span id="f09-c6" class="f09-w">partent</span> <span id="f09-pill" class="f09-pill"><span id="f09-pill-bg" class="f09-pillbg"></span><span class="f09-ch">d</span><span class="f09-ch">e</span> <span class="f09-ch">z</span><span class="f09-ch">é</span><span class="f09-ch">r</span><span class="f09-ch">o</span><span class="f09-ch">.</span></span></div>
        </div>
      </div>
    </div>

    <!-- film grain 3%, on top -->
    <div id="f09-grain" class="clip" data-start="0" data-duration="6.8" data-track-index="2" data-layout-ignore></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      function byId(id) {
        return document.getElementById(id);
      }
      function all(sel) {
        return Array.prototype.slice.call(document.querySelectorAll(sel));
      }

      var tl = gsap.timeline({ paused: true });

      // word-by-word (frame.md): opacity 0 / y 10 / blur 8 -> sharp, 0.3 s power3.out, on the voice cue
      function word(id, t) {
        tl.fromTo(byId(id),
          { opacity: 0, y: 10, "--b": "8px" },
          { opacity: 1, y: 0, "--b": "0px", duration: 0.3, ease: "power3.out" },
          t);
      }
      // accent-pill: bg traces scaleX 0->1 from the left (0.28 s power3.out) while straightening -8deg -> 0 (0.4 s),
      // THEN the letters write inside with a 0.02 s stagger. t = trace start (just before the spoken word).
      function pill(id, t) {
        tl.fromTo(byId(id),
          { rotation: -8 },
          { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false },
          t);
        tl.fromTo(byId(id + "-bg"),
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
          t);
        tl.fromTo(all("#" + id + " .f09-ch"),
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.18, ease: "power3.out", stagger: 0.02 },
          t + 0.18);
      }
      // giant-word tracking via per-letter x transforms (tracking itself stays static): split into inline-block letters
      function trackChars(root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      }

      /* ================= Scene 1 (0.00-1.60) ================= */

      // the three prompt-cards of frame 8 open into a slight fan (seen under the blur-crossfade)
      var fan = [
        { id: "f09-card1", x: 0, y: -18, r0: 0, r1: -1 },
        { id: "f09-card2", x: 140, y: 50, r0: -2, r1: -6 },
        { id: "f09-card3", x: -140, y: 30, r0: 1.5, r1: 5 }
      ];
      fan.forEach(function (c) {
        tl.fromTo(byId(c.id),
          { x: c.x, y: c.y, rotation: c.r0 },
          { x: 0, y: 0, rotation: c.r1, duration: 0.8, ease: "power3.out" },
          0);
      });

      // « Ça, ça »  (Ça@0.14 ça@0.67)
      word("f09-a1", 0.14);
      word("f09-a2", 0.67);

      // [giant: s’apprend.] lands at 0.92: tracking 0.35em -> -0.05em (0.4em = 104 px per letter step),
      // opacity 0 -> 1, blur 12 -> 0, 0.5 s expo.out
      var T_GIANT = 0.86;
      tl.fromTo(byId("f09-giant"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        T_GIANT);
      var gChars = trackChars(byId("f09-giant"));
      var gN = gChars.length;
      gChars.forEach(function (ch, i) {
        tl.fromTo(ch,
          { x: (i - (gN - 1) / 2) * 104 },
          { x: 0, duration: 0.5, ease: "expo.out", immediateRender: false },
          T_GIANT);
      });

      // depth: as the giant lands in front, the deck settles back and defocuses slightly
      tl.fromTo(byId("f09-deck"),
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 0.94, opacity: 0.88, filter: "blur(2px)", duration: 0.6, ease: "power2.out", immediateRender: false },
        T_GIANT);

      // seam 1 -> 2: forward zoom-through (state change), hard cut at peak blur at 1.60
      var s1 = byId("f09-s1");
      tl.fromTo(s1,
        { scale: 1, filter: "blur(0px)" },
        { scale: 1.2, filter: "blur(10px)", duration: 0.18, ease: "power3.in", immediateRender: false },
        1.42);
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0.15, duration: 0.18, ease: "none", immediateRender: false }, 1.42);
      tl.set(s1, { opacity: 0 }, 1.6);

      /* ================= Scene 2 (1.60-3.25) ================= */

      // the code wall arrives from behind with matched blur/opacity and settles into the focal plane
      tl.fromTo(byId("f09-wallcam"),
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        1.6);

      // « Et pas besoin d’être technique, »  (Et@1.79 pas@2.04 besoin@2.22 d’être@2.40 technique@2.68)
      word("f09-b1", 1.79);
      word("f09-b2", 2.04);
      word("f09-b3", 2.22);
      word("f09-b4", 2.40);
      word("f09-b5", 2.68);

      // from 2.40 the lines fall down and away, bottom line first, each with a slight blur (it is not needed)
      var ROWS = 21;
      var COL_DELAY = [0, 0.03, 0.015];
      all("#f09-wallhole .f09-cl").forEach(function (el) {
        var r = parseInt(el.getAttribute("data-r"), 10);
        var c = parseInt(el.getAttribute("data-c"), 10);
        var t = 2.4 + (ROWS - 1 - r) * 0.022 + COL_DELAY[c];
        var dy = 220 + ((r * 7 + c * 3) % 5) * 22;
        var dx = (((r * 5 + c * 2) % 3) - 1) * 18;
        var rot = ((r + c) % 2 ? 1 : -1) * (0.8 + ((r * 3 + c) % 3) * 0.9);
        tl.fromTo(el,
          { x: 0, y: 0, rotation: 0, filter: "blur(0px)" },
          { x: dx, y: dy, rotation: rot, filter: "blur(6px)", duration: 0.42, ease: "power2.in", immediateRender: false },
          t);
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power1.in", immediateRender: false }, t);
      });

      // seam 2 -> 3 (the sentence continues): waterfall cut, words rip out leftward, last one dies at ~3.39
      ["f09-b1", "f09-b2", "f09-b3", "f09-b4", "f09-b5"].forEach(function (id, i) {
        var t = 3.12 + i * 0.022;
        tl.fromTo(byId(id), { x: 0 }, { x: -230, duration: 0.34, ease: "power4.in", immediateRender: false }, t);
        tl.fromTo(byId(id), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, t);
      });

      /* ================= Scene 3 (3.25-6.05, held to 6.80) ================= */

      // the warm radial glides from behind the giant to behind station 0 (560, 600)
      tl.fromTo(byId("f09-halo"),
        { x: 0, y: 0 },
        { x: -400, y: 80, duration: 1.0, ease: "power2.inOut", immediateRender: false },
        3.3);

      // learning path: measured stroke draw, left to right, constant pen speed 3.30 -> 4.40
      var path = byId("f09-path");
      var LEN = path.getTotalLength ? path.getTotalLength() : 800;
      if (!LEN) LEN = 800;
      path.style.strokeDasharray = LEN + "";
      path.style.strokeDashoffset = LEN + "";
      var DRAW_T = 3.3;
      var DRAW_D = 1.1;
      tl.fromTo(path,
        { strokeDashoffset: LEN },
        { strokeDashoffset: 0, duration: DRAW_D, ease: "none", immediateRender: false },
        DRAW_T);

      // stations pop as the pen reaches them (station 0 just before the pen leaves it)
      for (var s = 0; s < 5; s++) {
        var ts = s === 0 ? DRAW_T - 0.06 : DRAW_T + (DRAW_D * s) / 4 - 0.12;
        tl.fromTo(byId("f09-st" + s),
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
          ts);
      }

      // pensé@3.70: station 0 lights up in accent + soft glow + pin label « TU ES ICI »
      tl.fromTo(byId("f09-lit"),
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        3.66);
      tl.fromTo(byId("f09-glow"),
        { opacity: 0, scale: 0.5 },
        { opacity: 0.8, scale: 1, duration: 0.6, ease: "power2.out" },
        3.66);
      tl.fromTo(byId("f09-tag"),
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
        3.7);
      tl.fromTo(byId("f09-stem"),
        { opacity: 1, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.25, ease: "power3.out", immediateRender: false },
        3.76);

      // thin accent progress fill starts from station 0 and stops just after it (stat-bars-and-fills, bar form)
      tl.fromTo(byId("f09-fill"),
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 0.32, duration: 0.85, ease: "power2.out", immediateRender: false },
        3.9);

      // « c’est pensé pour ceux qui partent » + [pill: de zéro.]
      // (c’est@3.43 pensé@3.70 pour@3.92 ceux@4.16 qui@4.30 partent@4.52 de@4.82)
      word("f09-c1", 3.43);
      word("f09-c2", 3.7);
      word("f09-c3", 3.92);
      word("f09-c4", 4.16);
      word("f09-c5", 4.3);
      word("f09-c6", 4.52);
      pill("f09-pill", 4.78);

      // from 5.60 station 0 glows brighter (the iris opens from (560, 600) at 6.05), then holds still
      tl.fromTo(byId("f09-glow"),
        { opacity: 0.8, scale: 1 },
        { opacity: 1, scale: 1.7, duration: 0.45, ease: "power2.inOut", immediateRender: false },
        5.6);
      tl.fromTo(byId("f09-core"),
        { opacity: 0, scale: 0.6 },
        { opacity: 0.9, scale: 1.2, duration: 0.45, ease: "power2.inOut" },
        5.6);
      tl.fromTo(byId("f09-st0"),
        { scale: 1 },
        { scale: 1.12, duration: 0.45, ease: "power2.inOut", immediateRender: false },
        5.6);
      tl.fromTo(byId("f09-lit"),
        { backgroundColor: "#c25b28", borderColor: "#c25b28" },
        { backgroundColor: "#d4703f", borderColor: "#e08a5c", duration: 0.45, ease: "power2.inOut", immediateRender: false },
        5.6);

      // hold the final state still until 6.80 (the orchestrator's iris extension)
      tl.set({}, {}, 6.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["09-apprend"] = tl;
    })();
  </script>
