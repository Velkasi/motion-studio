            '<span class="p07-cw-plus"><svg class="p07-cw-ico" style="width:20px;height:20px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14"></path></svg></span>' +
            ["gmail", "hubspot", "stripe", "wordpress"].map(function (n, i) { return '<span class="p07-cw-tool" style="left:' + (62 + i * 46) + 'px">' + fxIconSVG(n) + '</span>'; }).join("") +
            '<span class="p07-cw-send"><svg class="p07-cw-ico" style="stroke:#ffffff;stroke-width:2.4;width:22px;height:22px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></span></div>' +
        '</div>';

      // les trois lignes du jour, cochées « Fait » : le site avec son bouton, l'automatisation qui tourne, la vidéo montée
      B.lines.forEach(function (L) { L.wait.style.opacity = 0; L.done.style.opacity = 1; });
      B.lines[0].thumb.innerHTML = '<img src="assets/img/site-hero.png" style="width:112px;height:66px;display:block;object-fit:cover" alt="">';
      var th1 = B.lines[1].thumb;
      th1.insertAdjacentHTML("afterbegin", '<i style="position:absolute;left:16px;top:32px;width:81px;height:2px;background:rgba(26,22,18,.28)"></i>');
      var autoDot = document.createElement("i");
      autoDot.style.cssText = "position:absolute;left:0;top:30px;width:6px;height:6px;border-radius:50%;background:#1a1612;box-shadow:0 0 0 1.5px #fffdf9";
      th1.appendChild(autoDot);
      var th2 = B.lines[2].thumb;
      [[9, 30, -8], [41, 36, -40], [79, 24, -70]].forEach(function (c) {
        th2.insertAdjacentHTML("beforeend", '<i style="position:absolute;left:' + c[0] + 'px;top:23px;width:' + c[1] + 'px;height:10px;border-radius:2px;background:url(assets/img/site-hero.png) ' + c[2] + 'px -10px/140px 80px"></i>');
      });
      th2.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 692 58" preserveAspectRatio="none" style="position:absolute;left:9px;top:41px;width:94px;height:10px;display:block"><path fill="rgba(26,22,18,.38)" d="' + fxWavePath() + '"></path></svg>');
      var vidHead = document.createElement("i");
      vidHead.style.cssText = "position:absolute;left:0;top:17px;width:2px;height:40px;border-radius:1px;background:#c25b28";
      th2.appendChild(vidHead);

      // le reflet sous chaque ligne (s'illumine quand l'attente rentre dans aujourd'hui)
      var glows = B.lines.map(function (L, i) {
        var g = document.createElement("div"); g.className = "p07-glow";
        g.style.left = "1640px"; g.style.top = FX_B.lines[i] + "px";
        bhost.insertBefore(g, L.card);
        return g;
      });

      // la pile des idées : sous les lignes cochées, rail « 09:44 » à côté
      var PILE_X = 1640, PILE_Y = 740, PILE_S = 0.86, PILL_H = 76;
      var r44 = document.createElement("div"); r44.className = "fx-col-rail p07-r44"; r44.id = "p07-r44";
      r44.style.left = "1420px"; r44.style.top = (PILE_Y - 9) + "px"; r44.textContent = "09:44"; bhost.appendChild(r44);
      var t44 = document.createElement("div"); t44.className = "fx-col-tick p07-t44"; t44.id = "p07-t44";
      t44.style.left = "1526px"; t44.style.top = PILE_Y + "px"; bhost.appendChild(t44);

      // le devis (gabarit fx-devis) posé dans le passé : 1 000 € compris ; pivot ramené au centre de la carte, même image
      var DV = B.devis, DV_OX = 260, DV_OY = 320, DV_R = -4, DV_S = 0.42;
      DV.querySelector(".fx-dv-price").style.opacity = 1;
      var dvR = DV_R * Math.PI / 180;
      var DV_TX = DV_S * (DV_OX * Math.cos(dvR) - DV_OY * Math.sin(dvR)) - DV_OX;
      var DV_TY = DV_S * (DV_OX * Math.sin(dvR) + DV_OY * Math.cos(dvR)) - DV_OY;
      gsap.set(DV, { transformOrigin: DV_OX + "px " + DV_OY + "px", x: DV_TX, y: DV_TY, rotation: DV_R, scale: DV_S, opacity: 1 });
      var strike = DV.querySelector(".fx-dv-strike");

      /* ================= CAMÉRA cam2 : fonction pure du temps (un seul écrivain : render) ================= */
      var EIO = gsap.parseEase("expo.inOut"), EO = gsap.parseEase("expo.out"), P2I = gsap.parseEase("power2.in"), P3IO = gsap.parseEase("power3.inOut"), P1I = gsap.parseEase("power1.in"), SIO = gsap.parseEase("sine.inOut");
      function cl(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function lerp(a, b, e) { return a + (b - a) * e; }
      function mixG(A, Bc, e) { return { x: lerp(A.x, Bc.x, e), y: lerp(A.y, Bc.y, e), s: A.s * Math.pow(Bc.s / A.s, e) }; }
      function bell(p) { var v = Math.sin(Math.PI * p); return v * v; }
      var H0 = { x: 1600, y: 480, s: 0.80 };          // handoff_in (32.20), en plein recul vers la gauche
      var BOARD = { x: 1100, y: 480, s: 0.74 };       // tableau entier, un peu plus large (fenêtre Claude hors champ à droite)
      // vitesses de la 06 au raccord : chaque canal garde la sienne puis se pose, sans rebond (puissance n : v0 = n.Δ/T)
      var NX = 7000 * 0.30 / (H0.x - BOARD.x), NS = 2.5 * 0.30 / (H0.s - BOARD.s);
      var DEVIS = { x: 380, y: 330, s: 1.4 };         // devis
      var COL = { x: 2330, y: 560, s: 0.88 };         // colonne : lignes + pile à gauche, Claude + méthode entières à droite
      var SEAM = { x: 1200, y: 60, s: 2.0 };          // handoff_out (37.60) : l'axe en y 560 px
      function dA(t) { return 1 + 0.02 * Math.max(0, t - 0.45); }   // dérive s +2 %/s (depuis le sommet du flou du cran)
      function dB(t) { return 1 + 0.01 * Math.max(0, t - 1.76); }   // dérive s +1 %/s
      function dCs(t) { return 1 + 0.015 * Math.max(0, t - 2.60); } // dérive s +1,5 %/s
      function dCy(t) { return 10 * Math.max(0, t - 2.60); }        // légère descente vers la pile
      var DA_END = { x: DEVIS.x, y: DEVIS.y, s: DEVIS.s * dA(1.62) };
      var DB_END = { x: BOARD.x, y: BOARD.y, s: BOARD.s * dB(2.60) };
      var W0 = { x: COL.x, y: COL.y + dCy(5.10), s: COL.s * dCs(5.10) };
      var WY0 = 540 + (70 - W0.y) * W0.s, WX0 = 960 + (1200 - W0.x) * W0.s;
      function camAt(t) {
        var p, c;
        if (t < 0.30) {
          p = t / 0.30;
          return { x: lerp(H0.x, BOARD.x, 1 - Math.pow(1 - p, NX)), y: H0.y, s: lerp(H0.s, BOARD.s, 1 - Math.pow(1 - p, NS)), b: 10 * Math.pow(1 - p, NX - 1) };
        }
        if (t < 0.60) { p = (t - 0.30) / 0.30; c = mixG(BOARD, DEVIS, EIO(p)); c.s *= dA(t); c.b = 8 * bell(p); return c; }
        if (t < 1.62) return { x: DEVIS.x, y: DEVIS.y, s: DEVIS.s * dA(t), b: 0 };
        if (t < 1.90) { p = (t - 1.62) / 0.28; c = mixG(DA_END, BOARD, EIO(p)); c.s *= dB(t); c.b = 8 * bell(p); return c; }
        if (t < 2.60) return { x: BOARD.x, y: BOARD.y, s: BOARD.s * dB(t), b: 0 };
        if (t < 5.10) {
          p = cl((t - 2.60) / 0.30); c = mixG(DB_END, COL, EO(p)); c.s *= dCs(t); c.y += dCy(t);
          c.b = t < 2.90 ? 6 * Math.min(1, (t - 2.60) / 0.03) * Math.pow(1 - p, 2) : 0;
          return c;
        }
        // whip vers le haut : l'axe (y 70 du monde) descend jusqu'à y 560 px en grossissant ; power2.in, flou 0 → 10
        p = cl((t - 5.10) / 0.30); var w = P2I(p);
        var s = W0.s * Math.pow(SEAM.s / W0.s, w);
        var Y = lerp(WY0, 560, w), X = lerp(WX0, 960, w);
        return { x: 1200 - (X - 960) / s, y: 70 - (Y - 540) / s, s: s, b: 10 * p * p, w: w };
      }

      /* ================= LA NUÉE : huit idées à trois profondeurs, puis la pile ================= */
      var DEPTH = {
        near:  { sc: 1.42, bl: 5.5, op: 1,    v: 14, par: 1.28, z: 40 },
        sharp: { sc: 0.94, bl: 0,   op: 1,    v: 10, par: 1,    z: 30 },
        far:   { sc: 0.6,  bl: 1.6, op: 0.88, v: 6,  par: 0.8,  z: 20 }
      };
      // [texte, profondeur, x, y écran à T_REF, rotation, arrivée]
      var PD = [
        ["ta vidéo", "sharp", 790, 760, -3, 2.98],
        ["ta landing page", "sharp", 1300, 770, -3.5, 3.09],
        ["ton automatisation", "near", 980, 68, 2, 3.21],
        ["ton offre", "sharp", 700, 200, 2.5, 3.31],
        ["ton site", "sharp", 140, 590, 3, 3.40],
        ["ta formation", "near", 1680, 125, -2.5, 3.47],
        ["ta newsletter", "far", 1060, 690, -2, 3.60],
        ["ton podcast", "far", 130, 300, -1.5, 3.72]
      ];
      // ordre d'atterrissage (du bas de la pile vers le dessus : des plus étroites aux plus larges)
      var PILE_ORDER = ["ton site", "ta vidéo", "ton offre", "ton podcast", "ta formation", "ta newsletter", "ta landing page", "ton automatisation"];
      var T_REF = 3.40, CR = camAt(T_REF), QX = 1000, QY = 470, EFX = 960, EFY = 600;
      var pills = PD.map(function (d, i) {
        var D = DEPTH[d[1]], dx = d[2] - QX, dy = d[3] - QY, dl = Math.sqrt(dx * dx + dy * dy) || 1, co = PILE_ORDER.indexOf(d[0]);
        var el = $$(".p07-pill").filter(function (e) { return e.textContent === d[0]; })[0];
        return { el: el, D: D, ax: CR.x + (d[2] - 960) / (CR.s * D.par), ay: CR.y + (d[3] - 540) / (CR.s * D.par),
          ux: dx / dl, uy: dy / dl, rot: d[4], ta: d[5], tc: 4.28 + 0.04 * co, k: 7 - co, py: d[3] };
      });
      function pileSlot(k) {
        var sc = PILE_S * Math.pow(0.975, k), o = 5 * k;
        return { x: PILE_X + (k % 2 ? -2 : 2) * Math.min(k, 1), y: PILE_Y + PILL_H * PILE_S / 2 + o - PILL_H * sc / 2, s: sc, r: k === 0 ? 0 : (k % 2 ? -0.6 : 0.5) };
      }

      /* ================= render : l'UNIQUE écrivain (caméra, profondeur, pastilles, couture) =================
         Appelé par le setter de l'horloge : GSAP l'exécute à CHAQUE rendu de la timeline, y compris le pré-seek muet
         (totalTime(t + 0.001, true)) du runtime, donc l'état est exact jusqu'à t = 5.40. */
      var clockT = 0;
      var clock = { t: function (v) { if (arguments.length) { clockT = v; render(); } return clockT; } };
      function render() {
        var t = clockT, c = camAt(t);
        fxApplyCam2(world, c);
        view.style.filter = c.b > 0.05 ? "blur(" + c.b.toFixed(2) + "px)" : "none";

        // profondeur de champ du gros plan devis : axe flou au-dessus, voies floues dessous
        var dof = t < 0.30 ? 0 : t < 0.60 ? EIO((t - 0.30) / 0.30) : t < 1.62 ? 1 : t < 1.90 ? 1 - EIO((t - 1.62) / 0.28) : 0;
        axisHost.style.filter = dof > 0.01 ? "blur(" + (3.5 * dof).toFixed(2) + "px)" : "none";
        // pendant le gros plan du devis, les voies passeraient sous le sous-titre : elles s'effacent au sommet du flou des crans
        var laneOp = t < 0.34 ? 1 : t < 0.44 ? 1 - SIO((t - 0.34) / 0.10) : t < 1.80 ? 0 : t < 1.90 ? SIO((t - 1.80) / 0.10) : 1;
        B.lanes.forEach(function (l) { l.style.filter = dof > 0.01 ? "blur(" + (6 * dof).toFixed(2) + "px)" : "none"; l.style.opacity = laneOp.toFixed(3); });

        // la fenêtre Claude et la méthode ne laissent jamais de liseré au bord : sous 100 px visibles, elles s'effacent
        function vis(x0, x1) { var L = 960 + (x0 - c.x) * c.s, R = 960 + (x1 - c.x) * c.s; return Math.max(0, Math.min(1920, R) - Math.max(0, L)); }
        B.claude.style.opacity = cl((vis(2420, 3190) - 40) / 60).toFixed(3);
        B.method.style.opacity = cl((vis(2948, 3300) - 40) / 60).toFixed(3);

        // whip : tout sauf l'axe tombe et s'efface avant la zone du sous-titre
        var drop = t < 5.10 ? 0 : 420 * P2I(cl((t - 5.10) / 0.20));
        var colOp = t < 5.12 ? 1 : 1 - P1I(cl((t - 5.12) / 0.09));
        bhost.style.transform = "translate(0px," + drop.toFixed(2) + "px)";
        bhost.style.opacity = colOp.toFixed(3);

        // la copie écran de l'axe (3 px), exactement sur la ligne du monde
        var ly = 540 + (70 - c.y) * c.s, lx = 960 + (0 - c.x) * c.s;
        seam.style.transform = "translate(" + lx.toFixed(2) + "px," + (ly - 1.5).toFixed(2) + "px) scale(" + (3480 * c.s / 1000).toFixed(4) + ",1)";

        // les miniatures vivantes : l'automatisation tourne, la vidéo montée se lit
        autoDot.style.transform = "translate(" + (13 + ((t * 95) % 81)).toFixed(2) + "px,0)";
        vidHead.style.transform = "translate(" + (9 + ((t * 26) % 94)).toFixed(2) + "px,0)";

        pills.forEach(function (p) {
          var el = p.el;
          if (t < p.ta) { el.style.opacity = 0; return; }
          var D = p.D, lin = cl((t - p.ta) / 0.2), e = EO(lin), age = t - p.ta;
          var bx = 960 + (p.ax - c.x) * c.s * D.par + p.ux * D.v * age;
          var by = 540 + (p.ay - c.y) * c.s * D.par + p.uy * D.v * age;
          var kk = 1 + 0.35 * (1 - e), efy = Math.max(EFY, p.py);      // les pastilles du bas arrivent à l'horizontale
          var X = EFX + (bx - EFX) * kk, Y = efy + (by - efy) * kk;
          var S = D.sc * (c.s / CR.s) * (2 - e);
          var BL = D.bl + (14 - D.bl) * (1 - e);
          var OP = D.op * cl(lin / 0.35), R = p.rot, XP = -50, Z = D.z;
          if (t >= p.tc) {
            var q = P3IO(cl((t - p.tc) / 0.3)), sl = pileSlot(p.k);
            var px = 960 + (sl.x - c.x) * c.s, py = 540 + (sl.y + drop - c.y) * c.s, ps = sl.s * c.s;
            X = lerp(X, px, q); Y = lerp(Y, py, q); S = S * Math.pow(ps / S, q); R = lerp(R, sl.r, q);
            BL = BL * (1 - q); OP = lerp(OP, 1, q); XP = -50 * (1 - q); Z = 10 + (8 - p.k);
          }
          OP *= colOp;
          el.style.opacity = OP.toFixed(3);
          el.style.zIndex = Z;
          el.style.transform = "translate(" + X.toFixed(2) + "px," + Y.toFixed(2) + "px) rotate(" + R.toFixed(2) + "deg) scale(" + S.toFixed(4) + ") translate(" + XP.toFixed(2) + "%,-50%)";
          el.style.filter = BL > 0.05 ? "blur(" + BL.toFixed(2) + "px)" : "none";
        });
      }

      var tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

      /* ---------- sous-titre : la phrase de la voix, mot par mot (temps locaux) ---------- */
      $$(".fx-sw").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-t")), box = w.classList.contains("p07-inw");
        var c0 = box ? "rgba(246,241,233,.45)" : "rgba(26,22,18,.35)", c1 = box ? "#f6f1e9" : "#1a1612";
        tl.fromTo(w, { opacity: 0, y: 8, filter: "blur(6px)", color: c0 }, { opacity: 1, y: 0, filter: "blur(0px)", color: c0, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(w, { color: c0 }, { color: c1, duration: 0.2, ease: "power1.out", immediateRender: false }, t + 0.14);
      });
      tl.fromTo($("ink"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 3.34);
      [["sub1", 1.66, 0.12], ["sub2", 2.86, 0.12], ["sub3", 5.20, 0.14]].forEach(function (s) {
        tl.fromTo($(s[0]), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: s[2], ease: "power1.in", immediateRender: false }, s[1]);
      });

      /* ---------- Scene 1 : le devis frémit, est rayé d'un trait fin, s'envole ---------- */
      tl.fromTo(DV, { rotation: -4 }, { rotation: -1.6, duration: 0.05, ease: "power2.out", immediateRender: false }, 0.70);
      tl.fromTo(DV, { rotation: -1.6 }, { rotation: -2, duration: 0.07, ease: "power1.inOut", immediateRender: false }, 0.75);
      tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 1.08);
      tl.fromTo(DV, { x: DV_TX, y: DV_TY, rotation: -2, scale: DV_S, filter: "blur(0px)" },
        { x: DV_TX - 400, y: DV_TY - 500, rotation: -25, scale: DV_S * 0.6, filter: "blur(12px)", duration: 0.28, ease: "power3.in", immediateRender: false }, 1.20);
      tl.fromTo(DV, { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, 1.48);   // déjà hors cadre

      /* ---------- Scene 2 : les trois attentes se rétractent dans aujourd'hui ---------- */
      B.lanes.forEach(function (el) {
        tl.fromTo(el, { scaleX: 1 }, { scaleX: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, 2.20);
        tl.fromTo(el.querySelector(".fx-wait-l"), { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, 2.20);
      });
      B.lines.forEach(function (L, i) {
        var t0 = 2.50 + i * 0.03;
        tl.fromTo(glows[i], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo(glows[i], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, t0 + 0.12);
        tl.fromTo([L.card, glows[i]], { y: 0 }, { y: -4, duration: 0.1, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo([L.card, glows[i]], { y: -4 }, { y: 0, duration: 0.3, ease: "power2.inOut", immediateRender: false }, t0 + 0.12);
      });

      /* ---------- Scene 3 : « même » : le rail imprime 09:44 ; whip : l'axe seul reste ---------- */
      tl.fromTo(r44, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.12, ease: "steps(5)", immediateRender: false }, 4.94);
      tl.fromTo(t44, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 4.94);
      tl.fromTo(axisHost, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, 5.10);
      tl.fromTo(seam, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", immediateRender: false }, 5.10);

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
