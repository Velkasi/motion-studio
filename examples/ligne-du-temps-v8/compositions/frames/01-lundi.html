      ft(V, { cX: CARD_REST[0] }, { cX: CARD_REST[0] + 21, duration: 0.82, ease: "none" }, 1.70);
      // 2.52 silence : the annotation folds away (line retracts, frame and pastille fade) ; the card shrinks (x0.38, clear of « 12:00 »),
      // drops along the right of the site, slides under the line and pins itself on the frise at LUN 12 09:12
      ft($("sel"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.52);
      ft(V, { ln: 1 }, { ln: 0, duration: 0.12, ease: "power2.in" }, 2.52);
      ft(V, { cK: 1 }, { cK: 0.38, duration: 0.2, ease: "power2.in" }, 2.52);
      ft(V, { cY: CARD_REST[1] }, { cY: FX_LINE, duration: 0.22, ease: "power2.inOut" }, 2.52);
      ft(V, { cX: CARD_REST[0] + 21 }, { cX: PIN_X, duration: 0.24, ease: "power2.inOut" }, 2.62);
      ft(V, { cY: FX_LINE }, { cY: FX_LINE + 3, duration: 0.06, ease: "power2.out" }, 2.86);
      ft(V, { cY: FX_LINE + 3 }, { cY: FX_LINE, duration: 0.06, ease: "power2.in" }, 2.92);
      ft(V, { pin: 0 }, { pin: 1, duration: 0.1, ease: "power3.out" }, 2.86);

      /* ---- scene 2 : MER 14 ---- */
      // « MER 14 » prints under the line
      ft($("lab-mer-in"), { opacity: 0.3, scale: 1.2, filter: "blur(6px)", transformOrigin: "108px 45px" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 3.40);
      // 3.10 its shadow appears on the line at MER 14 and grows as the devis comes down (clearly, then fast at the fall)
      ft(V, { dvShO: 0 }, { dvShO: 1, duration: 0.3, ease: "power1.out" }, 3.10);
      ft(V, { dvShG: 0.3 }, { dvShG: 0.6, duration: 0.86, ease: "none" }, 3.10);
      ft(V, { dvShG: 0.6 }, { dvShG: 1, duration: 0.30, ease: "power2.in" }, 3.96);
      // 3.08 the devis comes from the camera during the whip (large, slightly blurred, turning), rides with it,
      // 3.20 → 3.60 detaches and settles above MER 14, comes down slowly, then 3.96 falls : contact on « tombe » (4.26)
      ft(devis, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 3.08);
      ft(V, { dQy: 420 }, { dQy: 110, duration: 0.24, ease: "expo.out" }, 3.08);
      ft(V, { dvB: 6 }, { dvB: 0, duration: 0.3, ease: "power2.out" }, 3.08);
      ft(V, { dvRot: -16 }, { dvRot: -9, duration: 0.52, ease: "power2.out" }, 3.08);
      ft(V, { dW: 0 }, { dW: 1, duration: 0.4, ease: "power2.inOut" }, 3.20);
      ft(V, { dvY: 920, dvRot: -9 }, { dvY: 880, dvRot: -8, duration: 0.36, ease: "none" }, 3.60);
      ft(V, { dvY: 880, dvRot: -8 }, { dvY: FX_LINE, dvRot: -3, duration: 0.30, ease: "power2.in" }, 3.96);
      // 4.26 contact : settle 0.97 → 1, the ruler vibrates under it, the camera shakes
      ft(dvCard, { scaleY: 0.97, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.08, ease: "power2.out" }, 4.26);
      ft(V, { vib: 0 }, { vib: 1, duration: 0.1, ease: "none" }, 4.26);
      ft(V, { shk: 0 }, { shk: 1, duration: 0.12, ease: "none" }, 4.26);
      // 4.50 its content prints (mark, name, DEVIS N° 0147, the line, 1 jour …), 0.04 s apart
      [".fx-dv-mark", ".fx-dv-name", ".fx-dv-sub", ".fx-dv-kind", ".fx-dv-lab", ".fx-dv-desc", ".fx-dv-qty", ".fx-dv-lines", ".fx-dv-tot .fx-micro"].forEach(function (s, i) {
        ft(dvCard.querySelector(s), { opacity: 0, y: 6, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, 4.50 + i * 0.04);
      });
      // 4.80 the price's shadow in the cell, 4.92 « 1 000 € » prints (x1.3 blur 6 → sharp), the shadow tightens under it
      ft(pShadow, { opacity: 0, scale: 1.18, y: 10, filter: "blur(8px)" }, { opacity: 1, scale: 1.1, y: 8, filter: "blur(6px)", duration: 0.12, ease: "power2.out" }, 4.80);
      ft(dvPrice, { opacity: 0, scale: 1.3, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 4.92);
      ft(pShadow, { opacity: 1, scale: 1.1, y: 8, filter: "blur(6px)" }, { opacity: 0.35, scale: 1, y: 2, filter: "blur(2px)", duration: 0.14, ease: "power3.out" }, 4.92);
      // 5.00 → 5.40 the thin terracotta stroke draws under the price
      ft(dvStroke, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 5.00);
      // during the whip toward Friday the week moves on : JEU 15 prints as we cross it, VEN 16 lifts, ready to print
      // (at 6.00 : JEU 15 at full ink, VEN 16 at 0.3, x1.2, blur 6, the state the next sequence starts from)
      ft(jeuLab, { opacity: 0.3 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 5.56);
      ft($("lab-ven-in"), { scale: 1, filter: "blur(0px)", transformOrigin: "108px 42px" }, { scale: 1.2, filter: "blur(6px)", duration: 0.3, ease: "power1.inOut" }, 5.56);

      /* ---- the voice line : word by word, grey then ink ; one highlight per sentence ---- */
      var GREY = "rgba(26,22,18,0.35)";
      ["s1", "s2"].forEach(function (s) {
        Array.prototype.forEach.call($(s).querySelectorAll(".fx-sw"), function (w) {
          var cue = parseFloat(w.getAttribute("data-cue")), inkWord = w.classList.contains("fx-ink-tx");
          ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
          if (inkWord) ft(w, { color: GREY }, { color: "#f6f1e9", duration: 0.1, ease: "none" }, cue + 0.04);
          else ft(w, { color: GREY }, { color: "#1a1612", duration: 0.2, ease: "power1.out" }, cue + 0.1);
        });
      });
      ft($("ink1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.54);
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.86);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.60);

      // exact frame length
      tl.set({}, {}, DUR);

      // first image = handoff_in, before any seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
