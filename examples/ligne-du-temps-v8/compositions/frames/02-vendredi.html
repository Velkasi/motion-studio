          pts.push([m * m * m * p0.x + 3 * m * m * s * c1[0] + 3 * m * s * s * c2[0] + s * s * s * p3.x,
                    m * m * m * p0.y + 3 * m * m * s * c1[1] + 3 * m * s * s * c2[1] + s * s * s * p3.y]);
        }
        pts.push([pe.x, pe.y]);
        for (i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        var cut = a * L[L.length - 1], d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1), tip = pts[0], dir = [1, 0];
        for (i = 1; i < pts.length; i++) {
          var sx = pts[i][0] - pts[i - 1][0], sy = pts[i][1] - pts[i - 1][1], sl = Math.hypot(sx, sy) || 1;
          if (L[i] <= cut) { tip = pts[i]; }
          else { var r = (cut - L[i - 1]) / (L[i] - L[i - 1]); tip = [pts[i - 1][0] + sx * r, pts[i - 1][1] + sy * r]; }
          dir = [sx / sl, sy / sl];
          d += " L" + tip[0].toFixed(1) + " " + tip[1].toFixed(1);
          if (L[i] > cut) break;
        }
        var hl = 13 * f, ca = Math.cos(0.5), sa = Math.sin(0.5);
        var w1 = [tip[0] - hl * (dir[0] * ca - dir[1] * sa), tip[1] - hl * (dir[0] * sa + dir[1] * ca)];
        var w2 = [tip[0] - hl * (dir[0] * ca + dir[1] * sa), tip[1] - hl * (-dir[0] * sa + dir[1] * ca)];
        arPath.setAttribute("d", d);
        arPath.setAttribute("stroke-width", (3.4 * f).toFixed(2));
        arPath.setAttribute("stroke-dasharray", "0 " + (11 * f).toFixed(2));
        arHead.setAttribute("stroke-width", (3.4 * f).toFixed(2));
        arHead.setAttribute("d", a > 0.02 ? "M" + w1[0].toFixed(1) + " " + w1[1].toFixed(1) + " L" + tip[0].toFixed(1) + " " + tip[1].toFixed(1) + " L" + w2[0].toFixed(1) + " " + w2[1].toFixed(1) : "");
      }

      // UN seul écrivain pour la caméra et tout ce qui est posé dans le monde
      function render(t) {
        var st = camState(t), c = st.c, D = { zf: st.zf, k: 8, max: 16 };
        var mb = Math.round(Math.min(40, st.blur)), mbf = mb >= 1 ? "url(#p02-mb" + mb + ")" : "";

        // sol (canvas écran) ; pendant le whip, traînée horizontale par copies décalées (aucun calque flouté)
        fxDrawFloor(offCv, c, D, FLOOR);
        floorCtx.clearRect(0, 0, 1920, 1080);
        if (st.blur < 0.5) { floorCtx.globalAlpha = 1; floorCtx.drawImage(offCv, 0, 0); }
        else { floorCtx.globalAlpha = 1 / 7; for (var k = -3; k <= 3; k++) floorCtx.drawImage(offCv, k * st.blur * 0.5, 0); floorCtx.globalAlpha = 1; }

        // frise des jours (+ flou directionnel pendant le whip)
        fxUpdateRibbon(rb, c, D, function () { return st.cb; });
        rb.segs.forEach(function (sg) { if (FX_DAY * fxProject(c, [fxX(sg.i) + 650, 310, 0]).k > 1800) sg.el.style.filter = "none"; });
        if (mbf) rb.segs.forEach(function (sg) {
          if (sg.el.style.display === "none" || sg.el.style.filter === "none" && FX_DAY * fxProject(c, [fxX(sg.i) + 650, 310, 0]).k > 1800) return;
          var f0 = sg.el.style.filter; sg.el.style.filter = (f0 && f0 !== "none" ? f0 + " " : "") + mbf;
        });
        var zv = fxPlace(venEl, c, 300, 60, [5118, 488, -0.5], [1, 0, 0], [0, -1, 0]);
        if (zv > 0) fxBlur(venEl, fxCoc(zv, D) + st.cb, mbf);
        var zl = fxPlace(lspEl, c, 460, 36, [XE0 - 474, 698, -8], [1, 0, 0], [0, -1, 0]);
        if (zl > 0) fxBlur(lspEl, fxCoc(zl, D) + st.cb, "");

        // le devis du mercredi, posé (il sort du cadre à gauche dans les premières images)
        fxShadow(devSh, c, [3150, 600, -3], 468);
        var zd = fxStand(devWrap, c, [3150, 600, -4], 1.0, 260, 640, -3);
        if (zd > 0) fxBlur(devWrap, fxCoc(zd, D) + st.cb, mbf);

        // l'iPhone arrive en volant et se pose sur la ligne au VEN 16
        var fe = eExpoO(clamp01((t - 0.10) / 0.16));
        var fs = 1.15 - 0.15 * fe, lift = 70 * (1 - fe), fb = 8 * (1 - fe);
        fxShadow(phSh, c, [PH.X, PH.Y, PH.Z + 1], 262 * (0.7 + 0.3 * fe));
        phSh.style.opacity = (t < 0.10 ? 0 : fe).toFixed(3);
        var zp = fxStand(phone, c, [PH.X, PH.Y + lift, PH.Z], PH.base * fs, PH.ax, PH.ay, 0);
        // jamais de flou sur un téléphone de plus de 1 800 px à l'écran (plans serrés, plongée)
        if (zp > 0) { if (PH.base * fs * FX_F / zp * 840 > 1800) phone.style.filter = "none"; else fxBlur(phone, fxCoc(zp, D) + fb + st.cb, mbf); }

        arrow(t, c);

        // relais : la copie écran 2D de la bulle prend la place de la vraie et plonge vers l'objectif
        if (t >= TR - 1e-4) {
          var S = Math.exp(Lg(t));
          rep.style.visibility = "hidden";
          dv.style.opacity = "1";
          dv.style.transform = "translate(960px,540px) rotate(" + ROLL + "deg) scale(" + S.toFixed(4) + ") translate(" + (-TX) + "px," + (-TY) + "px)";
          dvSoft.style.opacity = clamp01((t - TR) / 0.05).toFixed(3);
          var so = 1 - clamp01((Math.log(S) - Math.log(3)) / (Math.log(6.5) - Math.log(3)));   // texte parti avant 1 600 px de large
          if (so <= 0.002) { dvSharp.style.display = "none"; }
          else {
            var B = 14 * Math.pow(clamp01((t - TR) / (TLAST - TR)), 1.5);
            dvSharp.style.display = "";
            dvSharp.style.opacity = so.toFixed(3);
            dvSharp.style.filter = B > 0.2 ? "blur(" + (B / S).toFixed(3) + "px)" : "none";
          }
        } else {
          rep.style.visibility = "inherit";
          dv.style.opacity = "0";
        }
      }

      /* ---------- timeline ---------- */
      var tl = gsap.timeline({ paused: true });
      var P = { t: 0 };
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(P.t); } }, 0);
      render(0);

      function fin(sel, from, to, at) { to.immediateRender = false; tl.fromTo(sel, from, to, at); }

      // sous-titre « Vendredi… toujours [rien.] », mot par mot, gris puis encre
      tl.fromTo($("w1"), { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 0);
      fin($("w1"), { color: "rgba(26,22,18,0.35)" }, { color: "#1a1612", duration: 0.2, ease: "power1.out" }, 0.08);
      fin($("w2"), { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 1.12);
      fin($("w2"), { color: "rgba(26,22,18,0.35)" }, { color: "#1a1612", duration: 0.2, ease: "power1.out" }, 1.20);
      fin($("inkbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.48);
      fin($("w3"), { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 1.50);
      fin($("w3"), { color: "rgba(26,22,18,0.35)" }, { color: "#f6f1e9", duration: 0.1, ease: "power1.out" }, 1.53);
      ["wo1", "wo2", "wo3"].forEach(function (id) {
        fin($(id), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.84);
      });

      // « VEN 16 » s'imprime sous la ligne
      fin($("ven-in"), { opacity: 0.3, scale: 1.2, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, 0.06);

      // l'iPhone paraît (sa pose et son flou sont dans render)
      fin(phone, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 0.10);

      // WhatsApp : la demande du lundi (la même que la séquence 1), vue ; la relance du vendredi, vue ; rien
      fin($("chip1"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 0.30);
      fin($("msg1"), { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "power3.out" }, 0.32);
      fin($("blue1"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.62);
      fin($("chip2"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 0.80);
      fin($("msg2"), { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "power3.out" }, 0.90);
      fin($("blue2"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.20);

      // le gag muet : il écrit, s'arrête, reprend… et la seule réponse tombe
      function status(from, to, at) {
        fin($("st" + from), { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, at);
        fin($("st" + to), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
      }
      status(0, 1, 1.90); status(1, 2, 2.14); status(2, 1, 2.30); status(1, 2, 2.80);
      var typing = $("typing");
      fin(typing, { opacity: 0, scale: 1.06, filter: "blur(4px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.1, ease: "power2.out" }, 1.90);
      fin(typing, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in" }, 2.14);
      fin(typing, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power3.out" }, 2.30);
      fin(typing, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, 2.80);
      [[1.90, 2.14], [2.30, 2.80]].forEach(function (w) {
        for (var ts = w[0]; ts < w[1] - 0.05; ts += 0.36) {
          for (var di = 0; di < 3; di++) {
            var at = ts + 0.12 * di;
            if (at > w[1] - 0.06) break;
            fin($("d" + di), { opacity: 0.45 }, { opacity: 1, duration: 0.07, ease: "power1.out" }, at);
            fin($("d" + di), { opacity: 1 }, { opacity: 0.45, duration: 0.16, ease: "power1.in" }, at + 0.07);
          }
        }
      });
      fin($("reply"), { opacity: 0, scale: 1.08, filter: "blur(4px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 2.80);
      fin($("sbt0"), { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, 2.80);
      fin($("sbt1"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.80);

      // « LA SEMAINE PROCHAINE » s'imprime au bout de la flèche
      fin($("lsp-in"), { opacity: 0, scale: 1.2, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, 3.78);

      // le blanc de la bulle prend la teinte du papier dans les 0,1 s finales
      fin($("dv-tint"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.inOut" }, TLAST - 0.1);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
