  var VEL = 1300, TAU = 0.0725, AMP = (12000 - VEL) * TAU, TB = 2.06, TE = 2.60, NBR = 2;
  function xLin(t) { return -1500 + VEL * t + AMP * (1 - Math.exp(-t / TAU)); }
  var XB = xLin(TB), VB = VEL + (AMP / TAU) * Math.exp(-TB / TAU);
  function camX(t) {
    if (t <= TB) return xLin(t);
    var D = TE - TB, s = clamp01((t - TB) / D);
    return XB + VB * D * (1 - Math.pow(1 - s, NBR + 1)) / (NBR + 1);
  }
  function camA(t) {                                // caméra du monde des années
    var e = E_IO(clamp01(t / 0.55));
    return { x: camX(t), y: lerp(800, 760, e), z: lerp(-2900, -1700, e), yaw: lerp(3, 4, e), pitch: lerp(-4, -2, e), roll: -1 };
  }
  function dofA(t) { var e = E_IO(clamp01(t / 0.55)); return { zf: lerp(3300, 1250, e), k: 6, max: lerp(12, 16, e) }; }
  function flouA(t) { return t >= 0.85 ? 0 : 16 * Math.pow(1 - t / 0.85, 1.56); }   // 16 px à la couture, 4 px à 0.50, net à 0.85
  function ribSpeed(t) {                            // vitesse écran de la ligne près du centre (px/s)
    var c = camA(t), c2 = camA(t + 1 / 60), P = [c.x + 150, 600, 400];
    return Math.abs(fxProject(c, P).x - fxProject(c2, P).x) * 60;
  }
  var V0 = ribSpeed(0);
  function mbA(t) { return t >= TE ? 0 : Math.min(30, 30 * Math.pow(ribSpeed(t) / V0, 0.6)); }   // 30 px à la couture, ~12 px en croisière

  /* ---- LE PLI et LE POINT (acte 2) ---- */
  var PT_S = [[4.86, 0.62, 0], [4.93, 0.713, 0], [5.00, 0.70, 0.6], [5.18, 1.0, 2.0]];   // pulse ×1,15 puis grossit (+2 par seconde à 5.18)
  function ptGlow(t) {                              // s'embrase à 5.00 (scintillement), plein à 5.12
    if (t < 5.0) return 0.6;
    var f;
    if (t < 5.04) f = E_P2OUT((t - 5.0) / 0.04);
    else if (t < 5.08) f = 1 - 0.25 * sstep(5.04, 5.08, t);
    else f = 0.75 + 0.25 * sstep(5.08, 5.12, t);
    return 0.6 + 0.4 * f;
  }
  var foldKey = "";

  /* ---- render : UN seul écrivain de la caméra, appelé par le tween-pilote (fonction-propriété, jamais sautée au seek) ---- */
  var T = 0;
  function renderS1(t) {
    var c = camA(t), d = dofA(t);
    var cd = { x: c.x + 15000, y: c.y, z: c.z - 400, yaw: c.yaw, pitch: c.pitch, roll: c.roll };   // la même caméra, repère des jours
    var fl = flouA(t);                              // flou de caméra en px écran, posé objet par objet (ramené à l'échelle locale)
    function camBlur(sg, z) { return fl * z / 1000; }
    var mb = Math.round(mbA(t)), mbf = mb >= 1 ? "url(#p05-mb" + mb + ")" : "none";
    fxDrawFloor(FLOOR, cd, d, { x0: -4000, x1: 24000, z0: -1500, z1: 4000 });
    // sous le flou, les jours laissent la place aux années (la ligne ne bouge pas)
    var ay = sstep(0.03, 0.20, t);
    if (ay < 1) {
      RIBD.style.display = ""; RIBD.style.opacity = (1 - ay).toFixed(3); RIBD.style.filter = mbf;
      fxUpdateRibbon(rbDay, cd, d, camBlur);
    } else { RIBD.style.display = "none"; }
    RIBY.style.opacity = ay.toFixed(3); RIBY.style.filter = mbf;
    fxUpdateRibbon(rbYear, c, d, camBlur);
    // la pile suit la caméra (ancrée en cam.x + 820), avec une dérive lente vers le centre
    var zp = fxStand(PILE, c, [c.x + 820 - 20 * Math.max(0, t - 0.5), 600, -500], 1.15, 280, 640);
    if (zp > 0) fxBlur(PILE, fxCoc(zp, d) + fl * zp / 1150);
    // avant-plan : plus rapide que la frise, flou 18 px (directionnel + profondeur)
    FGS.forEach(function (g) {
      var x = 960 + (g.tc - t) * g.v, half = g.w * g.sc / 2;
      if (Math.abs(x - 960) > 960 + half + 60) { g.el.style.display = "none"; return; }
      g.el.style.display = ""; g.el.style.opacity = 1;
      g.el.style.transform = "translate(" + x.toFixed(2) + "px," + g.y + "px) rotate(" + g.rot + "deg) scale(" + g.sc + ") translate(" + (-g.w / 2) + "px," + (-g.h / 2) + "px)";
    });
  }
  function renderS2(t) {
    // poussée très lente vers le point (1 → 1,03, origine (960, 600))
    PUSH.style.transform = "scale(" + (1 + 0.03 * clamp01((t - CUT) / (DUR - CUT))).toFixed(5) + ")";
    // le filet : tenue vivante (dérive de 4 px), puis UN geste : il se replie en un point (p 0 → 2, power2.in)
    var dx = 4 * sstep(3.62, 3.98, t) * (1 - sstep(4.06, 4.60, t));
    var p = t <= 4.06 ? 0 : 2 * E_P2IN(clamp01((t - 4.06) / 0.8));
    var key = p.toFixed(4);
    if (key !== foldKey) { FOLD.innerHTML = p >= 2 ? "" : fxFoldSVG(p, { px: 960, py: 600 }); foldKey = key; }
    FOLD.style.transform = "translate(" + dx.toFixed(3) + "px,0px)";
    // le point de lumière s'allume au lieu du repli (4.78), pulse (4.86), s'embrase et grossit (5.00)
    if (t < 4.78) { PT.style.opacity = 0; return; }
    var ig = E_EXPO(clamp01((t - 4.78) / 0.08));
    var s = t < 4.86 ? 0.25 + 0.37 * ig : hermite(PT_S, t);
    PT.style.opacity = ig.toFixed(3);
    PT.style.transform = "scale(" + s.toFixed(4) + ")";
    var g = ptGlow(t).toFixed(3); PTG1.style.opacity = g; PTG2.style.opacity = g;
  }
  function render() {
    var t = T, a1 = t < CUT;
    S1.style.opacity = a1 ? 1 : 0; SUBL.style.opacity = a1 ? 1 : 0; GRL.style.opacity = a1 ? 1 : 0;
    S2.style.opacity = a1 ? 0 : 1; DARK.style.opacity = a1 ? 0 : 1; GRD.style.opacity = a1 ? 0 : 1;
    if (a1) renderS1(t); else renderS2(t);
  }

  var tl = gsap.timeline({ paused: true });
  var drv = { t: function (v) { if (arguments.length) { T = v; render(); } return T; } };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
  function ft(el, a, b, at) { b.immediateRender = at > 0 ? false : true; tl.fromTo(el, a, b, at); }

  /* ---- acte 1 : la phrase, mot par mot (gris → encre), la boîte d'encre se trace mot par mot sur « le prix à payer. » ---- */
  qa("#p05-sub > .fx-sw").forEach(function (w) {
    var c = parseFloat(w.getAttribute("data-c"));
    ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, c);
    ft(w, { color: "rgba(26,22,18,0.35)" }, { color: "rgba(26,22,18,1)", duration: 0.2, ease: "power1.out" }, c + 0.14);
  });
  qa("#p05-sub .p05-iw").forEach(function (w) {
    var c = parseFloat(w.getAttribute("data-c")), bg = w.querySelector(".fx-ink-bg"), tx = w.querySelector(".fx-ink-tx");
    ft(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, c - 0.02);
    ft(tx, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, c);
    ft(tx, { color: "rgba(246,241,233,0.35)" }, { color: "rgba(246,241,233,1)", duration: 0.1, ease: "power1.out" }, c + 0.04);
  });
  ft(q("#p05-sub"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.52);

  /* ---- acte 1 : la pile, chaque carte arrive d'en haut (×1,1, flou 8 → net), se pose sur son repère, la pile se tasse ---- */
  pileCards.forEach(function (card, i) {
    var c = PILE_ITEMS[i].c, t0 = c - 0.09, sg = i % 2 ? 1 : -1;
    tl.set(card, { opacity: 1 }, t0);
    ft(card, { y: -230, rotation: ROT[i] + 6 * sg, scale: 1.1, filter: "blur(8px)" }, { y: 0, rotation: ROT[i], scale: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out" }, t0);
    ft(PILEIN, { y: 2 * i }, { y: 2 * (i + 1), duration: 0.12, ease: "power2.out" }, c);
  });

  /* ---- acte 2 : « Il est temps de changer. », le trait terracotta, puis la phrase s'efface ---- */
  qa("#p05-type .p05-tw").forEach(function (w, i) {
    var c = parseFloat(w.getAttribute("data-c")), last = i === 4;
    tl.set(w, { opacity: 1 }, c);
    ft(w, { y: last ? 16 : 10, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: last ? 0.2 : 0.16, ease: "power4.out" }, c);
    ft(w, { color: "rgba(245,239,231,0.35)" }, { color: "rgba(245,239,231,1)", duration: 0.2, ease: "power1.out" }, c + 0.06);
  });
  ft(q("#p05-stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 3.40);
  ft(q("#p05-type"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.90);

  // première image = handoff_in, avant tout seek
  render();

  window.__timelines = window.__timelines || {};
  window.__timelines[FID] = tl;
})();
</script>
</template>
