    (function () {

      var NS = "http://www.w3.org/2000/svg";

      var E = {

        p3io: gsap.parseEase("power3.inOut"),
        p2o: gsap.parseEase("power2.out"),
        p3o: gsap.parseEase("power3.out"),

      /* ============ the waves: 34 rows; row 33 (lowest) IS the frise line of the handoff ============ */
      var N = 34;
      var XS = 24;
      var X0 = -48;
      var NPT = Math.ceil((1968 - X0) / XS) + 1;

      var wg = byId("p09-wg");

      var cam = byId("p09-cam");
      var darkEl = byId("p09-dark");

      var CLICK = 4.3;
      var CP0 = [1880, 1062];
      var CP1 = [1470, 690];
      var CP2 = [982, 628];

      function render(t) {

        var cr = E.eio(seg(t, 3.85, 0.3));
        var s = (1 + 0.015 * Math.min(t, 3.85) + 0.01 * Math.max(0, t - 3.85)) * (1 + 0.05 * cr);
        var cy = 540 + 10 * cr;
        cam.style.transform =
          "translate(" + (960 - 960 * s).toFixed(2) + "px," + (540 - cy * s).toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
        var ws = 1 + 0.35 * (s - 1);
        wcam.style.transform = "translate(0px," + (-(cy - 540) * 0.35).toFixed(2) + "px) scale(" + ws.toFixed(5) + ")";

        /* ---- waves ---- */
        var tight = E.p2io(seg(t, 1.2, 0.2));
        var B0 = 60 - 20 * tight;
        var SP = 9.8 - 0.4 * tight;
        var bot = B0 + 33 * SP;
        var L = 560 + (bot - 560) * E.p2io(seg(t, 0, 0.4));
        var m = E.p2io(seg(t, 0, 0.5));
        var ld = E.p2io(seg(t, 0.04, 0.5));
        var dx = 14 * t;
        var ph2 = 0.35 * t;
        var hlOn = t >= 5.2 && t <= 6.2;

        var cR = Math.round(lerp(194, 212, ld));
        var cG = Math.round(lerp(91, 112, ld));
        var cB = Math.round(lerp(40, 63, ld));
        var col = "rgb(" + cR + "," + cG + "," + cB + ")";
        if (col !== lastColor) {
          wg.setAttribute("stroke", col);
          lastColor = col;
        }

        for (var r = 0; r < N; r++) {
          var ti = (N - 1 - r) * 0.008;
          var br = B0 + r * SP;
          var spr = r === N - 1 ? 1 : E.p3o(seg(t, ti, 0.26));

          var op;
          var sw;
          if (r === N - 1) {
            op = lerp(1, OPF[r], ld);
            sw = lerp(4, SWF[r], ld);
          } else {
            op = OPF[r] * seg(t, ti, 0.05);
            sw = SWF[r];

          var d = "";
          if (op > 0.001) {
            var amp = AMP[r];
            var ph = PH[r];
            var ph3 = -0.21 * r + 1.3 + ph2;
            for (var q = 0; q < NPT; q++) {
              var x = X0 + q * XS;

              var yv =
                y0 +
                (1 - m) * 6 * Math.sin((TAU * xx) / 240) +
                m * (amp * Math.sin((TAU * xx) / 1150 + ph) + 6 * Math.sin((TAU * xx) / 470 + ph3));
              d += (q === 0 ? "M" : " L") + x + " " + yv.toFixed(2);
            }
          } else {
            d = "M0 -50 L1 -50";
          }
          rows[r].setAttribute("d", d);
          rows[r].setAttribute("stroke-opacity", op.toFixed(4));
          rows[r].setAttribute("stroke-width", sw.toFixed(3));
          if (hlOn) {
            hrows[r].setAttribute("d", d);
            hrows[r].setAttribute("stroke-opacity", (0.3 + 0.6 * (1 - r / (N - 1))).toFixed(3));
            hrows[r].setAttribute("stroke-width", (sw + 0.8).toFixed(3));
          }
        }

        /* the brand's mask (v6 ellipse from the top), faded in once the line has left the handoff */
        var A = 1 - E.p2io(seg(t, 0.12, 0.45));
        var mk =
          "linear-gradient(rgba(0,0,0," + A.toFixed(3) + "), rgba(0,0,0," + A.toFixed(3) + ")), " +
          "radial-gradient(ellipse 1250px 480px at 960px 0px, #000 40%, rgba(0,0,0,0.45) 72%, rgba(0,0,0,0) 100%)";
        if (mk !== lastMask) {

          waves.style.maskImage = mk;

        var dc = E.p2io(seg(t, 0.07, 0.23));

          de <= 0 ? "0" : "radial-gradient(ellipse 1150px 720px at 50% 50%, rgba(0,0,0," + dc.toFixed(3) + ") 0%, rgba(0,0,0," +

          var hc = -0.15 + 1.3 * ((t - 5.2) / 1.0);

        }

        /* ---- cursor: one curved move, direct click, then steps aside ---- */
        var cu = E.p3o(seg(t, 3.85, 0.45));
        var a0 = (1 - cu) * (1 - cu);
        var a1 = 2 * (1 - cu) * cu;
        var a2 = cu * cu;
        var cx = a0 * CP0[0] + a1 * CP1[0] + a2 * CP2[0];
        var cyy = a0 * CP0[1] + a1 * CP1[1] + a2 * CP2[1];
        var lv = E.p2o(seg(t, 4.9, 0.2));
        cx += 42 * lv;
        cyy += 43 * lv;
        cur.style.transform = "translate(" + cx.toFixed(2) + "px," + cyy.toFixed(2) + "px)";
      }

      /* ============ timeline ============ */
      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };
      render(0);
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(clock.t);
          }
        },
        0
      );

      /* ---- Scene 1 (0.00 to 3.40): the end card builds ---- */
      // paper darkens into the brand dark (0.3 s); grain crossfades
      tl.fromTo(byId("p09-gr-light"), { opacity: 0.035 }, { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 0);
      tl.fromTo(byId("p09-gr-dark"), { opacity: 0 }, { opacity: 0.055, duration: 0.3, ease: "power2.inOut" }, 0);
      // the warm halo grows
      var halo = byId("p09-halo");
      tl.fromTo(halo, { opacity: 0, scale: 0.6 }, { opacity: 0.85, scale: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.02);

      // ENTREPRENEURS falls letter by letter (0.03 s per letter, x1.4, blur 8 to sharp in 0.12 s)
      var letters = toArr(byId("p09-wordmark").getElementsByClassName("p09-l"));
      var two = byId("p09-two");
      var SPREAD = 7;
      var spreadX = function (idx) {
        return (idx - 6.5) * SPREAD;
      };
      letters.forEach(function (el, idx) {
        tl.fromTo(
          el,
          { opacity: 0, x: spreadX(idx), y: -16, scale: 1.4, filter: "blur(8px)" },
          {
            opacity: 1,
            x: spreadX(idx),
            y: 0,
            scale: 1,
            filter: "blur(0px)",
            duration: 0.12,
            ease: "expo.out",
            immediateRender: false
          },
          0.3 + idx * 0.03
        );
      });
      // 2.0 lands in #d4703f (x1.5, blur 10 to sharp in 0.14 s)
      tl.fromTo(
        two,
        { opacity: 0, x: spreadX(13), scale: 1.5, filter: "blur(10px)" },
        { opacity: 1, x: spreadX(13), scale: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false },
        0.78
      );
      // brand sting on the halo, then it settles
      tl.fromTo(halo, { opacity: 0.85, scale: 1 }, { opacity: 1, scale: 1.04, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.8);
      tl.fromTo(halo, { opacity: 1, scale: 1.04 }, { opacity: 0.85, scale: 1, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 1.1);
      // 1.50 the wordmark letters tighten (x of each letter, 0.2 s)
      letters.concat([two]).forEach(function (el, idx) {
        tl.fromTo(el, { x: spreadX(idx) }, { x: 0, duration: 0.2, ease: "power3.inOut", immediateRender: false }, 1.5);
      });

      // Forme-toi pour de bon. : each word on its voice cue, grey then full
      var wordIn = function (id, at) {
        var el = byId(id);
        tl.fromTo(
          el,
          { opacity: 0, y: 10, scale: 1.12, filter: "blur(8px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false },
          at
        );
        tl.fromTo(
          el,
          { color: "rgba(245,239,231,0.35)" },
          { color: "rgba(245,239,231,1)", duration: 0.2, ease: "power1.out", immediateRender: false },
          at + 0.12
        );
      };
      wordIn("p09-w-forme", 1.98);
      wordIn("p09-w-pour", 2.52);
      wordIn("p09-w-de", 3.0);
      wordIn("p09-w-bon", 3.18);
      // the fine terracotta stroke draws under "pour de bon." (2.50 to 3.00)
      var strk = byId("p09-strk-p");
      tl.fromTo(strk, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", immediateRender: false }, 2.5);
      tl.fromTo(
        strk,
        { attr: { "stroke-dashoffset": 1.1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out", immediateRender: false },
        2.5
      );

      // 3.20 the button arrives (x1.1, blur 6 to sharp, 0.14 s expo.out) with ONE terracotta ring pulse
      var ctaWrap = byId("p09-ctawrap");
      tl.fromTo(
        ctaWrap,
        { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false },
        3.2
      );
      var ctaGlow = byId("p09-ctaglow");
      tl.fromTo(ctaGlow, { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.2);
      var pulse = byId("p09-pulse");
      tl.fromTo(pulse, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 3.26);
      tl.fromTo(pulse, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.22, duration: 0.5, ease: "power2.out", immediateRender: false }, 3.44);

      /* ---- Scene 2 (3.40 to 7.22): the cursor clicks, living hold ---- */
      // 3.50 the url prints
      tl.fromTo(
        byId("p09-url"),
        { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false },
        3.5
      );
      // cursor shows at 3.85 (it enters from outside the frame, its path is in render)
      var curIn = byId("p09-cur-in");
      tl.fromTo(curIn, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 3.85);

      // 4.30 direct click: arrow and button to 0.9 together, bottom of the press on the click
      var cta = byId("p09-cta");
      tl.fromTo(curIn, { scale: 1 }, { scale: 0.9, duration: 0.03, ease: "power2.in", immediateRender: false }, CLICK - 0.03);
      tl.fromTo(curIn, { scale: 0.9 }, { scale: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, CLICK);
      tl.fromTo(cta, { scale: 1 }, { scale: 0.9, duration: 0.03, ease: "power2.in", immediateRender: false }, CLICK - 0.03);
      tl.fromTo(cta, { scale: 0.9 }, { scale: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, CLICK);
      // the button flashes #e08a5c then #fffdf9, then fills with #c25b28 from the click point
      tl.fromTo(cta, { backgroundColor: "#f6f1e9" }, { backgroundColor: "#e08a5c", duration: 0.02, ease: "none", immediateRender: false }, CLICK - 0.02);
      tl.fromTo(cta, { backgroundColor: "#e08a5c" }, { backgroundColor: "#fffdf9", duration: 0.03, ease: "none", immediateRender: false }, CLICK + 0.01);
      tl.fromTo(
        byId("p09-fill"),
        { clipPath: "circle(0px at 272px 48px)" },
        { clipPath: "circle(320px at 272px 48px)", duration: 0.27, ease: "expo.out", immediateRender: false },
        CLICK
      );
      tl.fromTo(
        cta,
        { boxShadow: "0px 24px 56px 0px rgba(0, 0, 0, 0.55), 0px 0px 60px 0px rgba(194, 91, 40, 0.38)" },
        {
          boxShadow: "0px 20px 50px 0px rgba(0, 0, 0, 0.5), 0px 0px 96px 0px rgba(194, 91, 40, 0.62)",
          duration: 0.4,
          ease: "power2.out",
          immediateRender: false
        },
        CLICK
      );
      // the terracotta onde, from the click point
      tl.fromTo(
        byId("p09-ring"),
        { opacity: 0.95, scale: 0 },
        { opacity: 0, scale: 4.6, duration: 0.8, ease: "power2.out", immediateRender: false },
        CLICK + 0.01
      );
      // release bloom behind the button
      var burst = byId("p09-burst");
      tl.fromTo(burst, { opacity: 0, scale: 0.9 }, { opacity: 0.75, scale: 1.3, duration: 0.4, ease: "power2.out", immediateRender: false }, CLICK + 0.02);
      tl.fromTo(burst, { opacity: 0.75 }, { opacity: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, CLICK + 0.42);
      tl.fromTo(byId("p09-envglow"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, CLICK + 0.04);

      // 4.40 to 7.22 living hold: the halo slides 20 px, the button glow rises slowly
      tl.fromTo(halo, { x: 0 }, { x: 20, duration: DUR - 4.4, ease: "none", immediateRender: false }, 4.4);
      tl.fromTo(ctaGlow, { opacity: 0.55, scale: 1 }, { opacity: 1, scale: 1.08, duration: DUR - 4.4, ease: "power1.inOut", immediateRender: false }, 4.4);
      // 4.90 the arrow steps aside (60 px, in render) and fades (0.2 s)
      tl.fromTo(curIn, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, 4.9);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
