            <span class="f02-pill" data-trace="3.88"><span class="f02-pillbg"></span><span class="f02-pw" data-cue="3.94"><span class="f02-l">q</span><span class="f02-l">u</span><span class="f02-l">a</span><span class="f02-l">n</span><span class="f02-l">d</span></span> <span class="f02-pw" data-cue="4.16"><span class="f02-l">i</span><span class="f02-l">l</span></span> <span class="f02-pw" data-cue="4.30"><span class="f02-l">a</span><span class="f02-l">u</span><span class="f02-l">r</span><span class="f02-l">a</span></span> <span class="f02-pw" data-cue="4.46"><span class="f02-l">l</span><span class="f02-l">e</span></span> <span class="f02-pw" data-cue="4.64"><span class="f02-l">t</span><span class="f02-l">e</span><span class="f02-l">m</span><span class="f02-l">p</span><span class="f02-l">s</span><span class="f02-l">.</span></span></span>
          </div>
        </div>
      </div>
    </div>

    <div id="f02-grain" class="clip f02-grain" data-start="0" data-duration="5.6" data-track-index="2"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "02-attente";
      var DUR = 5.2;
      var root = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function $(id) { return root.querySelector("#f02-" + id) || document.getElementById("f02-" + id); }
      function $$(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }

      var tl = gsap.timeline({ paused: true });

      // ---------- virtual camera (viewport-change, PAN mode): one .world, one writer ----------
      var world = $("world");
      var cam = { x: 0, sx: 0, sy: 0, blur: 0 };
      function applyCamera() {
        world.style.transform = "translate(" + (cam.x + cam.sx).toFixed(2) + "px, " + cam.sy.toFixed(2) + "px)";
        world.style.filter = cam.blur > 0.01 ? "blur(" + (cam.blur * 8).toFixed(2) + "px)" : "none";
      }
      applyCamera();

      // ---------- phrase words (word-by-word on voice cues) ----------
      $$(".f02-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
          t);
      });

      // ---------- accent pill: trace first, then letters write inside ----------
      $$(".f02-pill").forEach(function (p) {
        var t = parseFloat(p.getAttribute("data-trace"));
        var bg = p.querySelector(".f02-pillbg");
        tl.set(bg, { opacity: 1 }, t);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, t);
        tl.fromTo(bg, { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out" }, t);
      });
      $$(".f02-pw").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        var letters = Array.prototype.slice.call(w.querySelectorAll(".f02-l"));
        tl.fromTo(letters,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", stagger: 0.02 },
          t);
      });

      // ---------- Scene 1 (0.0-1.95): station A ----------
      tl.fromTo($("halo-a"), { opacity: 0 }, { opacity: 0.22, duration: 0.4, ease: "power1.out" }, 0);

      // tool tiles, left to right
      var NODE_T = [0.08, 0.4, 0.66, 0.92];
      ["node1", "node2", "node3", "node4"].forEach(function (id, i) {
        tl.fromTo($(id),
          { opacity: 0, y: 26, scale: 0.86 },
          { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
          NODE_T[i]);
      });

      // accent links draw between the tiles (svg-path-draw, measured lengths)
      var LINK_T = [0.3, 0.56, 0.82];
      ["l1", "l2", "l3"].forEach(function (id, i) {
        var p = $(id);
        var len = 164;
        try { len = p.getTotalLength() || 164; } catch (e) {}
        p.style.strokeDasharray = len + " " + len;
        p.style.strokeDashoffset = String(len);
        tl.set(p, { opacity: 1 }, LINK_T[i]);
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, LINK_T[i]);
      });

      // bright dot travels Formulaire -> E-mail -> Make (passes under the E-mail tile)
      var dot = $("dot");
      var DOT_T = 1.06;
      tl.fromTo(dot, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, DOT_T);
      tl.to(dot, {
        keyframes: [
          { x: 164, duration: 0.16, ease: "none" },
          { x: 280, duration: 0.08, ease: "none" },
          { x: 444, duration: 0.16, ease: "none" },
          { x: 452, duration: 0.06, ease: "power2.out" }
        ]
      }, DOT_T);

      // 1.54 "planté": Make shakes, turns grey, ERREUR pops, next link goes dashed + dim, dot dies
      var BREAK = 1.54;
      tl.to($("node3"), {
        keyframes: [
          { x: -11, duration: 0.035, ease: "none" },
          { x: 10, duration: 0.035, ease: "none" },
          { x: -8, duration: 0.035, ease: "none" },
          { x: 6, duration: 0.035, ease: "none" },
          { x: -3, duration: 0.035, ease: "none" },
          { x: 0, duration: 0.04, ease: "none" }
        ]
      }, BREAK);
      tl.fromTo($("dead"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, BREAK);
      tl.fromTo($("badge"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, BREAK + 0.04);
      tl.to(dot, { scale: 2.2, opacity: 0, duration: 0.22, ease: "power2.out" }, BREAK);
      tl.to($("l3"), { opacity: 0, duration: 0.16, ease: "power1.out" }, BREAK + 0.02);
      tl.fromTo($("l3dash"), { opacity: 0 }, { opacity: 0.4, duration: 0.2, ease: "power1.out" }, BREAK + 0.02);
      tl.to($("node4"), { opacity: 0.4, duration: 0.3, ease: "power1.out" }, BREAK + 0.08);

      // ---------- Scene 2 (1.95-2.90): SUR DEVIS slams (kinetic-beat-slam) ----------
      var SLAM = 2.04;
      var IMPACT = 2.15;
      tl.fromTo($("stamp"),
        { opacity: 0, scale: 2.3, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
        SLAM);
      tl.fromTo($("shock"), { opacity: 0, scale: 1 }, { opacity: 0.75, scale: 1.05, duration: 0.05, ease: "none" }, IMPACT);
      tl.to($("shock"), { opacity: 0, scale: 1.3, duration: 0.45, ease: "power2.out" }, IMPACT + 0.05);
      tl.to($("row"), { opacity: 0.5, duration: 0.3, ease: "power1.out" }, SLAM + 0.08);

      // tiny camera shake on impact: decaying envelope, zero at both ends
      var SHAKE_DUR = 0.26;
      var shk = { p: 0 };
      tl.to(shk, {
        p: 1,
        duration: SHAKE_DUR,
        ease: "none",
        onUpdate: function () {
          var a = Math.pow(1 - shk.p, 2);
          var ph = shk.p * SHAKE_DUR * Math.PI * 2 * 24;
          cam.sx = 12 * a * Math.sin(ph);
          cam.sy = 7 * a * Math.sin(ph * 1.3);
          applyCamera();
        }
      }, IMPACT);

      // ---------- Scene 3 (2.90-5.20): pan right to station B ----------
      var PAN_START = 2.9;
      var PAN_DUR = 0.48;
      tl.set($("chat"), { opacity: 1 }, PAN_START);
      tl.fromTo($("halo-b"), { opacity: 0 }, { opacity: 0.22, duration: 0.4, ease: "power1.out" }, PAN_START);
      tl.fromTo($("halo-c"), { opacity: 0 }, { opacity: 0.14, duration: 0.4, ease: "power1.out" }, PAN_START);
      var pan = { p: 0 };
      tl.to(pan, {
        p: 1,
        duration: PAN_DUR,
        ease: "power2.inOut",
        onUpdate: function () {
          cam.x = -1920 * pan.p;
          cam.blur = Math.sin(Math.PI * pan.p);
          applyCamera();
        }
      }, PAN_START);

      // 3.20 the outgoing bubble lands, read receipt, then the provider only "types"
      tl.fromTo($("ask"),
        { opacity: 0, y: 36, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
        3.06);
      tl.fromTo($("receipt"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 3.46);
      tl.fromTo($("wait"),
        { opacity: 0, y: 20, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" },
        3.56);

      // waiting dots: finite pulses, pure function of the proxy
      var wdots = $$(".f02-wdot");
      var WBASE = [1, 0.6, 0.3];
      var PULSE_START = 3.7, PULSE_END = 5.18, PULSE_CYCLE = 0.75;
      var pulse = { p: 0 };
      tl.to(pulse, {
        p: (PULSE_END - PULSE_START) / PULSE_CYCLE,
        duration: PULSE_END - PULSE_START,
        ease: "none",
        onUpdate: function () {
          wdots.forEach(function (d, i) {
            var wave = Math.max(0, Math.sin(pulse.p * Math.PI * 2 - i * 0.9));
            gsap.set(d, { y: -7 * wave, scale: 1 + 0.2 * wave, opacity: WBASE[i] + (1 - WBASE[i]) * 0.8 * wave });
          });
        }
      }, PULSE_START);

      // counter: label + ticks, then J+1 -> J+3 -> J+8 by hard cut
      tl.fromTo($("ctrlabel"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.7);
      tl.fromTo($("ticks"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.78);
      var ticks = $$(".f02-tick");
      var FLIPS = [
        { t: 3.94, id: "j1", lit: 1 },
        { t: 4.3, id: "j3", lit: 3 },
        { t: 4.66, id: "j8", lit: 8 }
      ];
      var prevId = null, prevLit = 0;
      FLIPS.forEach(function (f) {
        if (prevId) tl.set($(prevId), { opacity: 0 }, f.t);
        tl.set($(f.id), { opacity: 1 }, f.t);
        tl.fromTo($("num"), { scale: 1.08 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, f.t);
        ticks.forEach(function (tk, i) {
          if (i >= prevLit && i < f.lit) {
            tl.set(tk, { backgroundColor: "#c25b28", boxShadow: "0 0 12px rgba(224, 138, 92, 0.55)" }, f.t);
          }
        });
        prevId = f.id;
        prevLit = f.lit;
      });

      // hold to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
