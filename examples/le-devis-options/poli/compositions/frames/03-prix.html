  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById("f03-" + name);
      };
      var all = function (scope, sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      var DURATION = 3.56;
      // Voice word cues: the single timing spine every reveal reads from.
      var CUE = {
        pendant: 0.08,
        des: 0.34,
        annees: 0.54,
        cetait: 0.78,
        prix: 1.2,
        payer: 1.46,
        pour: 1.62,
        technique: 2.36,
        stop: 3.08
      };

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.00-1.60): persona, stress strokes, phrase + pill ----------
      tl.fromTo(byId("halo"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.02);
      tl.fromTo(
        byId("persona"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false },
        0.02
      );

      var STROKES = [
        { el: byId("stroke-a"), origin: "250 58", at: 0.16 },
        { el: byId("stroke-b"), origin: "320 46", at: 0.22 },
        { el: byId("stroke-c"), origin: "390 58", at: 0.28 }
      ];
      STROKES.forEach(function (s, k) {
        gsap.set(s.el, { svgOrigin: s.origin });
        tl.fromTo(
          s.el,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out", immediateRender: false },
          s.at
        );
        // Re-pops as the swarm hits (1.62) and on « technique » (2.36). Explicit up then down tweens.
        [CUE.pour, CUE.technique].forEach(function (t) {
          tl.fromTo(s.el, { scale: 1 }, { scale: 1.4, duration: 0.09, ease: "power2.out", immediateRender: false }, t + k * 0.03);
          tl.fromTo(s.el, { scale: 1.4 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, t + 0.09 + k * 0.03);
        });
      });

      // Slow tremble of the hands: 2px, 3 finite cycles, each one written out as explicit tweens.
      // Each side moves arm + hand together; the right side lives in a mirrored group,
      // so the same local x makes the two hands shake in opposition (a squeeze).
      var TREMBLE_AT = 0.5;
      var TREMBLE_CYCLE = 0.36;
      var TREMBLE_AMP = 2;
      [[byId("arm-l"), byId("hand-l")], [byId("arm-r"), byId("hand-r")]].forEach(function (side) {
        for (var c = 0; c < 3; c++) {
          var t0 = TREMBLE_AT + c * TREMBLE_CYCLE;
          tl.fromTo(side, { x: 0 }, { x: TREMBLE_AMP, duration: TREMBLE_CYCLE / 4, ease: "sine.out", immediateRender: false }, t0);
          tl.fromTo(side, { x: TREMBLE_AMP }, { x: -TREMBLE_AMP, duration: TREMBLE_CYCLE / 2, ease: "sine.inOut", immediateRender: false }, t0 + TREMBLE_CYCLE / 4);
          tl.fromTo(side, { x: -TREMBLE_AMP }, { x: 0, duration: TREMBLE_CYCLE / 4, ease: "sine.in", immediateRender: false }, t0 + (3 * TREMBLE_CYCLE) / 4);
        }
      });

      // word-by-word: each word ON its voice timestamp.
      var WORD_CUES = [CUE.pendant, CUE.des, CUE.annees, CUE.cetait];
      all(byId("phrase"), ".f03-w").forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          WORD_CUES[i] - 0.02

      });

      // accent-pill: traces first (scaleX from the left, rotation -8 -> 0), then the letters write inside.
      var PILL_AT = CUE.prix - 0.05;
      tl.fromTo(byId("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, PILL_AT);
      tl.fromTo(
        byId("pill-bg"),
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        PILL_AT
      );
      all(byId("pill"), ".f03-ch").forEach(function (c, i) {
        tl.fromTo(
          c,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", immediateRender: false },
          PILL_AT + 0.18 + i * 0.02
        );
      });

      // ---------- Scene 2 (1.60-3.05): pain pills burst + swarm closes in ----------
      // Persona flinches in place as the world arrives (stays put, no camera push).
      tl.fromTo(byId("persona"), { rotation: 0 }, { rotation: -2.4, duration: 0.07, ease: "power2.out", immediateRender: false }, CUE.pour);
      tl.fromTo(byId("persona"), { rotation: -2.4 }, { rotation: 1.8, duration: 0.1, ease: "power2.inOut", immediateRender: false }, CUE.pour + 0.07);
      tl.fromTo(byId("persona"), { rotation: 1.8 }, { rotation: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, CUE.pour + 0.17);

      // center-outward-expansion: pills share the head as origin, partially-spread start.
      var EXPAND_DUR = 0.7;
      var EXPAND_EASE = "power3.out";
      var PILL_STAGGER = 0.12;
      var START_PROGRESS = 0.3;
      all(byId("burst"), ".f03-pp").forEach(function (el, i) {
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        var rot = ((i * 7 + 3) % 9 - 4) * 1.4;
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, scale: 0.6, rotation: rot * 2.5, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: tx, y: ty, scale: 1, rotation: rot, opacity: 1, duration: EXPAND_DUR, ease: EXPAND_EASE, immediateRender: false },
          CUE.pour + i * PILL_STAGGER
        );
      });

      // Swarm: 3D fly-in from the four edges, radial close-in around the persona.
      var SWARM_AT = CUE.pour + 0.02;
      var SWARM_STAGGER = 0.08;
      var FLY = 0.9;
      var slots = all(byId("swarm"), ".f03-slot").sort(function (a, b) {
        return Number(a.dataset.order) - Number(b.dataset.order);
      });
      slots.forEach(function (slot) {
        var order = Number(slot.dataset.order);
        var cx = Number(slot.dataset.cx);
        var cy = Number(slot.dataset.cy);
        var s = Number(slot.dataset.s);
        var r = Number(slot.dataset.r);
        var side = order % 2 ? 1 : -1;
        var from = { x: 0, y: 0, rotationX: 0, rotationY: 0, rotation: r, scale: s * 1.15, transformPerspective: 900 };
        var edge = slot.dataset.edge;
        if (edge === "L") {
          from.x = -(cx + 300); from.y = side * 80; from.rotationY = -75; from.rotationX = 20; from.rotation = r - 25;

          from.x = 1920 - cx + 300; from.y = side * 80; from.rotationY = 75; from.rotationX = -20; from.rotation = r + 25;
        } else if (edge === "T") {
          from.y = -(cy + 240); from.x = side * 100; from.rotationX = 75; from.rotationY = 15; from.rotation = r - 20;
        } else {
          from.y = 1080 - cy + 240; from.x = side * 100; from.rotationX = -75; from.rotationY = -15; from.rotation = r + 20;
        }
        var at = SWARM_AT + order * SWARM_STAGGER;
        tl.fromTo(
          slot,
          from,
          {
            x: 0,
            y: 0,
            rotationX: Number(slot.dataset.rx),
            rotationY: Number(slot.dataset.ry),
            rotation: r,
            scale: s,
            transformPerspective: 900,
            duration: FLY,
            ease: "expo.out",
            immediateRender: false
          },
          at
        );

      });

      // ---------- Scene 3 (3.05-3.56): hard cut to the empty stage, « Stop. » slams ----------
      var STOP_AT = CUE.stop;

      tl.fromTo(
        byId("stop-halo"),
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false },
        STOP_AT
      );

      tl.fromTo(
        byId("stop-cam"),
        { scale: 1.06, y: -14, rotation: -0.7 },
        { scale: 1, y: 0, rotation: 0, duration: 0.34, ease: "power4.out", immediateRender: false },
        STOP_AT
      );
      // giant-word tracking via per-letter x transforms (the CSS tracking stays static):
      // letters split into inline-blocks, each starts offset as if tracked +0.4em, then slides home.
      var trackChars = function (root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      };
      var trackIn = function (chars, spread, dur, ease, at) {
        var n = chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { x: (i - (n - 1) / 2) * spread }, { x: 0, duration: dur, ease: ease, immediateRender: false }, at);
        });
      };
      // giant-word: tracking 0.35em -> -0.05em on every copy of the echo-stack.
      all(byId("echo"), ".f03-el").forEach(function (w) {
        trackIn(trackChars(w), 104, 0.5, "expo.out", STOP_AT);
      });
      tl.fromTo(
        byId("stop-word"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        STOP_AT
      );
      // echo-stack: copies converge from 180px to 70px steps at 60/35/20/10%.
      var ECHO_OPACITY = [0.6, 0.35, 0.2, 0.1];
      all(byId("echo"), ".f03-copy").forEach(function (c) {
        var k = Number(c.dataset.k);
        var dir = Number(c.dataset.dir);
        tl.fromTo(
          c,
          { y: dir * k * 180, opacity: 0 },
          { y: dir * k * 70, opacity: ECHO_OPACITY[k - 1], duration: 0.4, ease: "power3.out", immediateRender: false },
          STOP_AT
        );
      });

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-prix"] = tl;
    })();
