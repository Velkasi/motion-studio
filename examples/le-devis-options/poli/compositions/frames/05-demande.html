      tl.fromTo(ripple, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, RIPPLE_AT);

        ripple,
        { opacity: 1 },
        { opacity: 0, duration: 0.55, ease: "power1.in", immediateRender: false },

      /* Phrase seam (cut catalog: waterfall cut). Phrase 1 rips leftward word by word,

      var CUT = 2.3;
      var EX_MOVE = 0.34;
      var EX_FADE = 0.18;
      var EX_FADE_LAG = 0.07;
      var EX_STAG = 0.022;

      var lastExit = CUT - EX_FADE - EX_FADE_LAG;
      exitUnits.forEach(function (unit, k) {
        var s = lastExit - (exitUnits.length - 1 - k) * EX_STAG;
        tl.fromTo(unit, { x: 0 }, { x: -230, duration: EX_MOVE, ease: "power4.in", immediateRender: false }, s);
        tl.fromTo(
          unit,
          { opacity: 1 },
          { opacity: 0, duration: EX_FADE, ease: "power1.in", immediateRender: false },
          s + EX_FADE_LAG,

      });

      function slideIn(node, at) {
        tl.fromTo(
          node,
          { x: 230, filter: "blur(8px)" },
          { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out", immediateRender: false },
          at,

        tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, at);
      }
      slideIn(e1, 2.3); /* "Elle" */
      slideIn(e2, 2.46); /* "le" */
      pillIn(pill2, pill2Bg, pill2Ch, 2.66); /* "fait" spoken at 2.72 */

      /* Scene 4 (2.30-3.24): scale-swap, the input shrinks away, the website rises to the same center.
         Outgoing power2.in; incoming expo.out (frame.md bans back.out). */
      var SWAP_OUT = 2.16;
      var EXIT_DUR = 0.3;
      var OVERLAP = 0.16;
      var SWAP_IN = SWAP_OUT + EXIT_DUR - OVERLAP; /* 2.30 */
      tl.fromTo(
        ask,
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 0.72, opacity: 0, filter: "blur(10px)", duration: EXIT_DUR, ease: "power2.in", immediateRender: false },
        SWAP_OUT,
      );
      tl.fromTo(
        site,
        { opacity: 0, scale: 0.72, y: 40, filter: "blur(12px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: false },
        SWAP_IN,

      tl.fromTo(halo, { opacity: 0.75 }, { opacity: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, SWAP_IN);

      /* the new button lands in the site at 2.34, glow ring, then the mono tag */
      tl.fromTo(
        btn,
        { scale: 0.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false },

      );
      tl.fromTo(
        ring,
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false },
        2.46,
      );
      tl.fromTo(
        tag,
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false },
        2.62,

      /* pin the timeline length to the frame duration (hold, no exit) */
      tl.set({}, {}, DURATION);

      window.__timelines["05-demande"] = tl;
