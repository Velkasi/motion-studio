      pillIn("f07-pill1", 0.58, [
        { id: "f07-pw-quune", at: 0.74 },
        { id: "f07-pw-ligne", at: 0.96 }
      ]);

      // the dimmed total gives way; the new last row assembles at the bottom of the card
      var ROW_AT = 1.2;
      tl.to("#f07-total", { opacity: 0, y: 8, duration: 0.24, ease: "power2.in" }, ROW_AT - 0.02);
      tl.set("#f07-slot-frame", { opacity: 1 }, ROW_AT + 0.02);
      tl.fromTo(
        "#f07-slot-frame",
        { clipPath: "inset(-48px 105% -48px -48px)" },
        { clipPath: "inset(-48px -6% -48px -48px)", duration: 0.5, ease: "power3.out" },
        ROW_AT + 0.02
      );
      splitChars(byId("f07-slot-label")).forEach(function (c, i) {
        tl.fromTo(c, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, ROW_AT + 0.16 + i * 0.02);
      });

      // ---------- Scene 2 (2.10-3.60): coordinate-target-zoom into the last line ----------
      // Fixed geometry (see CSS): card 510/200, slot at card-local (55, 471) + 1px card border, 788 x 112
      // -> slot center (960, 728). Nested wrappers: outer scales about (960, 540), inner counter-translates T = -offset.
      var SLOT_W = 788;
      var SLOT_H = 112;
      var TARGET_OFFSET_X = 510 + 1 + 55 + SLOT_W / 2 - W / 2; // 0 (1px border included)
      var TARGET_OFFSET_Y = 200 + 1 + 471 + SLOT_H / 2 - H / 2; // 188
      var MAX_SCALE = Math.min((0.88 * W) / SLOT_W, (0.88 * H) / SLOT_H); // headroom budget, ~2.144
      var ZOOM_SCALE = Math.min(2.14, MAX_SCALE); // slot text 25px -> ~54px (phrase size) at rest
      var ZOOM_AT = 2.1;
      var ZOOM_DUR = 0.9;

      tl.fromTo(
        "#f07-zoom-outer",
        { scale: 1 },
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut", force3D: false, immediateRender: false },
        ZOOM_AT
      );
      tl.fromTo(
        "#f07-zoom-inner",
        { x: 0, y: 0 },
        { x: -TARGET_OFFSET_X, y: -TARGET_OFFSET_Y, duration: ZOOM_DUR, ease: "power3.inOut", force3D: false, immediateRender: false },
        ZOOM_AT
      );
      tl.to("#f07-p1", { opacity: 0, duration: 0.4, ease: "power2.out" }, ZOOM_AT);
      tl.to(["#f07-head", "#f07-rows"], { opacity: 0.4, duration: 0.6, ease: "power2.out" }, ZOOM_AT);
      tl.fromTo("#f07-halo", { scale: 1 }, { scale: 1.3, duration: ZOOM_DUR, ease: "power3.inOut", immediateRender: false }, ZOOM_AT);

      // the line writes itself word by word inside the slot
      var p2Words = all("#f07-p2 .f07-w"); // Apprendre, à
      var P2_CUES = [2.26, 2.6];
      p2Words.forEach(function (w, i) {
        wordIn(w, P2_CUES[i]);
      });
      pillIn("f07-pill2", 2.66, [
        { id: "f07-pw-ten", at: 2.82 },
        { id: "f07-pw-servir", at: 2.92 }
      ]);

      // motion-blur-streak (path A): a terracotta comet streaks behind the words; X-only blur rides
      // the same window + ease as the move and resolves to 0 at the settle
      var blurNode = byId("f07-streak-blur");
      var PEAK_BLUR = 14;
      var COMET_AT = 2.3;
      var COMET_DUR = 0.55;
      var TRACK_W = 740;
      var blurProxy = { v: PEAK_BLUR };
      var writeBlur = function () {
        blurNode.setAttribute("stdDeviation", blurProxy.v.toFixed(2) + " 0");
      };
      writeBlur();
      tl.fromTo("#f07-comet-head", { x: -TRACK_W, opacity: 0 }, { x: 0, opacity: 1, duration: COMET_DUR, ease: "expo.out" }, COMET_AT);
      tl.fromTo("#f07-comet-tail", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: COMET_DUR, ease: "expo.out" }, COMET_AT);
      tl.fromTo(blurProxy, { v: PEAK_BLUR }, { v: 0, duration: COMET_DUR, ease: "expo.out", onUpdate: writeBlur }, COMET_AT);
      tl.to("#f07-comet-tail", { opacity: 0.4, duration: 0.5, ease: "power2.out" }, COMET_AT + COMET_DUR + 0.15);

      // ---------- Scene 3 (3.60-5.92): inverse zoom-through back to the struck card, the card flies off, « libre. » lands ----------
      var EXIT_AT = 3.62;
      var CUT = 3.82;
      var CUT_BLUR = 10; // text-scale subject: same peak blur on both sides of the cut
      // phase 1, exit: the zoomed line recedes (scale/blur power3.in, opacity linear on its own tween)
      tl.fromTo(
        "#f07-stage",
        { scale: 1, filter: "blur(0px)" },
        { scale: 0.8, filter: "blur(" + CUT_BLUR + "px)", duration: CUT - EXIT_AT, ease: "power3.in", immediateRender: false },
        EXIT_AT
      );
      tl.fromTo("#f07-stage", { opacity: 1 }, { opacity: 0.15, duration: CUT - EXIT_AT, ease: "none", immediateRender: false }, EXIT_AT);

      // phase 2, hard cut (hidden under the blur): the camera snaps back to the wide pose on the struck card
      tl.set("#f07-zoom-outer", { scale: 1 }, CUT);
      tl.set("#f07-zoom-inner", { x: 0, y: 0 }, CUT);
      tl.set(["#f07-head", "#f07-rows"], { opacity: 1 }, CUT);

      // phase 3, entry: the card view and the phrase layer arrive oversized and retract into the focal plane
      // (identical fromTo on two full-frame wrappers with the same origin = one camera move)
      function inverseEntry(sel) {
        tl.fromTo(
          sel,
          { opacity: 0.15, scale: 1.25, filter: "blur(" + CUT_BLUR + "px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
          CUT
        );
      }
      inverseEntry("#f07-stage");
      inverseEntry("#f07-s3");
      tl.set("#f07-stage", { filter: "none" }, CUT + 0.52);
      tl.set("#f07-s3", { filter: "none" }, CUT + 0.52);
      tl.to("#f07-halo", { y: -20, scale: 1, duration: 0.5, ease: "expo.out" }, CUT); // the lamp re-centers behind the card, then « libre. »

      // phrase small at the top, word by word on the voice
      var p3Words = all("#f07-p3 .f07-w"); // C’est, la, seule, qui, te, rend
      var P3_CUES = [3.86, 4.06, 4.28, 4.46, 4.64, 4.82];
      p3Words.forEach(function (w, i) {
        wordIn(w, P3_CUES[i]);
      });

      // the old way leaves: the struck card lifts off and flies out top-right (power3.in, gone by 5.10)
      var FLY_AT = 4.7;
      var FLY_DUR = 0.4;
      tl.fromTo(
        "#f07-card",
        { x: 0, y: 0 },
        { x: 1300, y: -1050, duration: FLY_DUR, ease: "power3.in", immediateRender: false },
        FLY_AT
      );
      tl.fromTo(
        "#f07-card",
        { scale: 1, rotation: 0 },
        { scale: 0.9, rotation: -14, duration: FLY_DUR, ease: "power2.out", immediateRender: false },
        FLY_AT
      );
      // slight motion blur, directional in the card's local frame (rotated -14deg vs a ~39deg path),
      // riding the same window + ease as the flight so it peaks at peak speed
      var flyNode = byId("f07-fly-blur");
      var flyProxy = { v: 0 };
      var writeFly = function () {
        flyNode.setAttribute("stdDeviation", flyProxy.v.toFixed(2) + " " + (flyProxy.v * 0.45).toFixed(2));
      };
      writeFly();
      tl.set("#f07-card", { filter: "url(#f07-fly)" }, FLY_AT);
      tl.fromTo(flyProxy, { v: 0 }, { v: 14, duration: FLY_DUR, ease: "power3.in", onUpdate: writeFly, immediateRender: false }, FLY_AT);
      tl.set("#f07-card", { opacity: 0 }, FLY_AT + FLY_DUR);

      // giant-pill « libre. » (the peak): the pill traces from the left with a -6deg settle,
      // then the letters land inside with the tracking tighten (split letters, per-letter x only)
      var GP_AT = 4.94;
      var GP_EM = 260;
      // soft accent-glow bloom behind the pill: blooms in with the trace, then holds (no loop)
      tl.fromTo(
        "#f07-gglow",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out", immediateRender: false },
        GP_AT
      );
      tl.fromTo("#f07-gpill-bg", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, GP_AT);
      tl.fromTo("#f07-gpill-bg", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power3.out", immediateRender: false }, GP_AT);
      tl.fromTo("#f07-gpill-bg", { rotation: -6 }, { rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, GP_AT);
      var gLetters = splitChars(byId("f07-gpill-txt")); // l, i, b, r, e, .
      var gN = gLetters.length;
      var GL_AT = 5.06;
      gLetters.forEach(function (c, i) {
        tl.fromTo(
          c,
          { opacity: 0, x: (i - (gN - 1) / 2) * 0.4 * GP_EM, filter: "blur(12px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
          GL_AT + i * 0.02
        );
      });

      // perfectly still hold to the end of the frame
      tl.set({}, {}, 5.92);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-ligne"] = tl;
    })();
  </script>
</template>
