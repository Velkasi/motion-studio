  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      function $(id) {
        return document.getElementById(id);
      }

      var DUR = 2.86;
      // Frame-local cues (word cues from the voice)
      var T_MICRO = 0.3; // "SAUF QUE"
      var T_GIANT = 0.44; // "Sauf"; giant lands before "qu'aujourd'hui" @0.60
      var T_CUT = 1.4; // hard-cut swap to the hub
      var EXIT = 0.18; // zoom-through exit into the cut
      var T_RING = 1.46;
      var T_W = [1.54, 1.68, 1.86]; // L'IA, sait, faire
      var T_PILL = 1.98; // pill traces 2 frames before "tout" @2.04
      var T_CHARS = 2.08;

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.00 to 1.40) ---------- */

      // micro, word-by-word entrance
      tl.fromTo(
        $("f04-micro"),
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
        T_MICRO,
      );

      // giant-word tracking via transforms (spacing stays static in CSS; it snaps to device pixels under seek capture):
      // letters split into inline-blocks, each starts offset as if tracked +0.4em, then slides home.
      var trackChars = function (root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      };
      var trackIn = function (chars, spread, dur, ease, at) {
        var n = chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { x: (i - (n - 1) / 2) * spread }, { x: 0, duration: dur, ease: ease, immediateRender: false }, at);
        });
      };
      // giant-word: tracking 0.35em -> -0.05em (260px: 104px of travel per letter step),
      // opacity + blur 12 -> 0, 0.5s expo.out
      tl.fromTo(
        $("f04-giant"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        T_GIANT,
      );
      trackIn(trackChars($("f04-giant")), 104, 0.5, "expo.out", T_GIANT);

      /* ---------- Seam: forward zoom-through, hard cut at peak blur (cut catalog) ---------- */
      var s1 = $("f04-s1");
      tl.fromTo(
        s1,
        { scale: 1, filter: "blur(0px)" },
        { scale: 1.18, filter: "blur(10px)", duration: EXIT, ease: "power3.in", immediateRender: false },
        T_CUT - EXIT,
      );
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0.15, duration: EXIT, ease: "none", immediateRender: false }, T_CUT - EXIT);
      tl.set(s1, { opacity: 0 }, T_CUT);

      /* ---------- Scene 2 (1.40 to 2.86) ---------- */

      // gentle pull-back under the hub (orbit finisher's ecosystem reveal)
      var cam = $("f04-camera");
      gsap.set(cam, { transformOrigin: "960px 430px" });
      tl.fromTo(
        cam,
        { scale: 1.035 },
        { scale: 1, duration: DUR - T_CUT, ease: "power2.out", immediateRender: false },
        T_CUT,
      );

      // the orb enters at the cut with matched blur/opacity, and the glow blooms behind it as ONE beat
      var BLOOM = 0.6;
      tl.fromTo(
        $("f04-orb"),
        { opacity: 0.15, scale: 0.6, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: BLOOM, ease: "expo.out", immediateRender: false },
        T_CUT,
      );
      // ambient-glow-bloom, hero bloom (bloom-and-hold: scene under 3s, no breathe); strong warm bloom, under the 0.45 ceiling
      tl.fromTo(
        $("f04-glow"),
        { opacity: 0, scale: 0.85 },
        { opacity: 0.42, scale: 1, duration: BLOOM, ease: "power2.out", immediateRender: false },
        T_CUT,
      );

      // orbit ring draws on (clockwise, like the orbit)
      var CX = 960;
      var CY = 430;
      var RX = 560;
      var RY = 240;
      var PERIM = Math.PI * (3 * (RX + RY) - Math.sqrt((3 * RX + RY) * (RX + 3 * RY)));
      var DASH = Math.ceil(PERIM) + 4;
      var ring = $("f04-ring");
      ring.setAttribute("stroke-dasharray", DASH + " " + DASH);
      ring.setAttribute("stroke-dashoffset", String(DASH));
      tl.set($("f04-ring-svg"), { opacity: 1 }, T_RING);
      tl.fromTo(
        ring,
        { attr: { "stroke-dashoffset": DASH } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        T_RING,
      );

      // orbit-3d-entry: each card is parked on its orbital position, flips in IN PLACE from 3D space,
      // then keeps travelling clockwise on the ellipse (one deterministic driver, own start angle per card)
      var REV = 18; // seconds per revolution
      var STAGGER = 0.1;
      var ENTRY = 0.6;
      var T_CARD = 1.5;
      var orbits = [];
      for (var i = 0; i < 3; i++) {
        var pos = $("f04-orbit-" + i);
        orbits.push({
          el: pos,
          a0: (Number(pos.getAttribute("data-angle")) / 360) * Math.PI * 2,
          start: T_CARD + i * STAGGER,
        });
      }
      function renderOrbit(t) {
        for (var k = 0; k < orbits.length; k++) {
          var o = orbits[k];
          var p = Math.max(0, t - o.start) / REV;
          var a = o.a0 + p * Math.PI * 2;
          var x = Math.cos(a) * RX;
          var y = Math.sin(a) * RY;
          var depth = (y + RY) / (2 * RY); // 0 = back of the ring, 1 = front
          o.el.style.zIndex = String(1 + Math.round(depth * 49)); // capped band [1, 50]; orb sits at 25
          o.el.style.transform =
            "translate(-50%, -50%) translate(" +
            x.toFixed(2) +
            "px, " +
            y.toFixed(2) +
            "px) scale(" +
            (0.92 + 0.08 * depth).toFixed(4) +
            ")";
          // depth cue: cards at the back of the ring sit a touch further from the lamp
          o.el.style.filter = "brightness(" + (0.8 + 0.2 * depth).toFixed(4) + ")";
        }
      }
      renderOrbit(0);
      var driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            renderOrbit(driver.t);
          },
        },
        0,
      );

      for (var j = 0; j < 3; j++) {
        var card = $("f04-card-" + j);
        gsap.set(card, { transformPerspective: 900, transformOrigin: "50% 50%" });
        tl.fromTo(
          card,
          { rotateX: 70, rotateY: -50, z: -300, scale: 0.4, opacity: 0 },
          { rotateX: 0, rotateY: 0, z: 0, scale: 1, opacity: 1, duration: ENTRY, ease: "power4.out", immediateRender: false },
          T_CARD + j * STAGGER,
        );
      }

      // phrase, word by word on the voice
      for (var w = 0; w < T_W.length; w++) {
        tl.fromTo(
          $("f04-w" + w),
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          T_W[w],
        );
      }

      // accent-pill: traces first (scaleX from the left + rotation settle), THEN the letters write inside
      tl.fromTo(
        $("f04-pill-bg"),
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        T_PILL,
      );
      tl.fromTo(
        $("f04-pill"),
        { rotation: -8 },
        { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false },
        T_PILL,
      );
      var chars = document.querySelectorAll("#f04-pill-txt .f04-ch");
      for (var c = 0; c < chars.length; c++) {
        tl.fromTo(
          chars[c],
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false },
          T_CHARS + c * 0.02,
        );
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["04-aujourdhui"] = tl;
    })();
  </script>
