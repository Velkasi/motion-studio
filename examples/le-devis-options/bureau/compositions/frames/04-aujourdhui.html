  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      function $(id) {
        return document.getElementById(id);
      }

      // Word cues (frame-local): Sauf 0.44, qu'aujourd'hui 0.60, l'IA 1.54, sait 1.68, faire 1.86, tout 2.04, ça 2.28
      var T_MICRO = 0.3;
      var T_GIANT = 0.44;
      var T_CUT = 1.4;
      var EXIT = 0.18;
      var T_ORB = 1.5;
      var BLOOM = 0.6;
      var T_NOTES = [1.6, 1.78, 1.98];
      var T_W = [1.54, 1.68, 1.86];
      var T_PILL = 2.0;
      var T_TOUT = 2.06;
      var T_CA = 2.28;

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.00 to 1.40): calm desk, micro, giant word ---------- */

      tl.fromTo(
        $("f04-micro"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false },
        T_MICRO,
      );

      // tracking tighten via per-letter x (letters split into inline-blocks, spread 0.4em, slide home)
      var trackChars = function (root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      };
      var trackIn = function (chars, spread, dur, ease, at) {
        var n = chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { x: (i - (n - 1) / 2) * spread }, { x: 0, duration: dur, ease: ease, immediateRender: false }, at);
        });
      };
      tl.fromTo(
        $("f04-giant"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        T_GIANT,
      );
      trackIn(trackChars($("f04-giant")), 104, 0.55, "expo.out", T_GIANT);

      // hold with a slow forward drift that feeds the zoom-through
      var s1 = $("f04-s1");
      tl.fromTo(s1, { scale: 1 }, { scale: 1.03, duration: T_CUT - EXIT - T_GIANT, ease: "none", immediateRender: false }, T_GIANT);

      /* ---------- Seam: forward zoom-through, hard cut at peak blur (cut catalog) ---------- */
      tl.fromTo(
        s1,
        { scale: 1.03, filter: "blur(0px)" },
        { scale: 1.22, filter: "blur(10px)", duration: EXIT, ease: "power3.in", immediateRender: false },
        T_CUT - EXIT,
      );
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0.15, duration: EXIT, ease: "none", immediateRender: false }, T_CUT - EXIT);
      tl.set(s1, { opacity: 0 }, T_CUT);

      /* ---------- Scene 2 (1.40 to 2.86) ---------- */

      // laptop continues the forward move from behind the cut
      tl.fromTo(
        $("f04-laptop"),
        { opacity: 0.15, scale: 0.84, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        T_CUT,
      );

      // ambient-glow-bloom, hero bloom (bloom-and-hold: scene under 3 s); glow + orb land as one beat
      tl.fromTo(
        $("f04-orb"),
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: BLOOM, ease: "power3.out", immediateRender: false },
        T_ORB,
      );
      tl.fromTo(
        $("f04-glow"),
        { opacity: 0, scale: 0.82 },
        { opacity: 0.42, scale: 1, duration: BLOOM, ease: "power2.out", immediateRender: false },
        T_ORB,
      );
      tl.fromTo(
        $("f04-spill"),
        { opacity: 0 },
        { opacity: 1, duration: BLOOM, ease: "power2.out", immediateRender: false },
        T_ORB,
      );

      // sticky notes slide in from left, top, right; fast in, soft landing, tiny rotation settle
      var NOTES = [
        { id: "f04-note-1", from: { x: -640, y: 0 }, r0: -12, r1: -5 },
        { id: "f04-note-2", from: { x: 0, y: -480 }, r0: 11, r1: 5 },
        { id: "f04-note-3", from: { x: 640, y: 0 }, r0: 4, r1: -3 },
      ];
      NOTES.forEach(function (n, i) {
        var at = T_NOTES[i];
        tl.fromTo(
          $(n.id),
          { x: n.from.x, y: n.from.y, opacity: 1 },
          { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
          at,
        );
        tl.fromTo(
          $(n.id + "-sheet"),
          { rotation: n.r0 },
          { rotation: n.r1, duration: 0.6, ease: "power3.out", immediateRender: false },
          at,
        );
      });

      // phrase, word by word on the voice
      for (var w = 0; w < T_W.length; w++) {
        tl.fromTo(
          $("f04-w" + w),
          { opacity: 0, y: 12, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          T_W[w],
        );
      }

      // accent pill: traces from the left, then the words write inside
      tl.fromTo(
        $("f04-pill-bg"),
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        T_PILL,
      );
      tl.fromTo($("f04-pill"), { rotation: -10 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, T_PILL);
      var chars = document.querySelectorAll("#f04-pill-txt .f04-ch");
      for (var c = 0; c < chars.length; c++) {
        var at = c < 5 ? T_TOUT + c * 0.02 : T_CA + (c - 5) * 0.02;
        tl.fromTo(chars[c], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, at);
      }

      // hold to the end of the frame (duration 2.86 s)
      tl.set({}, {}, 2.86);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-aujourdhui"] = tl;
    })();
  </script>
