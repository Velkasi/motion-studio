            var x0 = px - sa2 * off,
              y0 = py + ca * off;
            mk("path", { d: "M" + f1(x0) + " " + f1(y0) + " L" + f1(x0 + len * ca) + " " + f1(y0 + len * sa2), stroke: (k + q) % 4 === 0 ? "#c25b28" : "#5a5348", "stroke-opacity": 0.42, "stroke-width": 1.7, "stroke-linecap": "round" }, g);
          }
        }
        mk("path", { d: od, fill: "url(#f08-ballrim)" }, g);
      })();

      /* ======================= the hand-drawn zero (screen px) ======================= */
      var ZX = 1400,
        ZY = 450;
      var loop = [];
      var FULL = 0;
      (function () {
        var NL = 220,
          RX = 146,
          RY = 204,
          th0 = -68 * D2R,
          sweep = 382 * D2R,
          tilt = 7 * D2R;
        for (var k = 0; k <= NL; k++) {
          var u = k / NL;
          var th = th0 - u * sweep; // decreasing angle = counter-clockwise on screen, like a hand-written 0
          var w = 1 + 0.016 * Math.sin(u * 2 * Math.PI * 2.3 + 0.6) + 0.009 * Math.sin(u * 2 * Math.PI * 5.1 + 1.3);
          var g = 0.978 + 0.044 * u;
          var ex = RX * w * g * Math.cos(th),
            ey = RY * w * g * Math.sin(th);
          loop.push([ex * Math.cos(tilt) - ey * Math.sin(tilt), ex * Math.sin(tilt) + ey * Math.cos(tilt)]);
          if (u * sweep <= 2 * Math.PI) FULL = k;
        }
        // bounding box centred EXACTLY on (1400, 450)
        var x0 = 1e9,
          x1 = -1e9,
          y0 = 1e9,
          y1 = -1e9;
        for (k = 0; k < loop.length; k++) {
          x0 = Math.min(x0, loop[k][0]);
          x1 = Math.max(x1, loop[k][0]);
          y0 = Math.min(y0, loop[k][1]);
          y1 = Math.max(y1, loop[k][1]);
        }
        var ox = ZX - (x0 + x1) / 2,
          oy = ZY - (y0 + y1) / 2;
        for (k = 0; k < loop.length; k++) loop[k] = [loop[k][0] + ox, loop[k][1] + oy];
      })();
      var cum = [0];
      for (j = 1; j < loop.length; j++) cum.push(cum[j - 1] + Math.hypot(loop[j][0] - loop[j - 1][0], loop[j][1] - loop[j - 1][1]));
      var LOOP_L = cum[cum.length - 1];
      var inkPath = $("inkpath");
      inkPath.setAttribute("d", pathOf(loop, false));
      inkPath.setAttribute("stroke-dasharray", LOOP_L.toFixed(2) + " " + (LOOP_L + 20).toFixed(2));
      var fillD = pathOf(loop.slice(0, FULL + 1), true);
      $("fillpath").setAttribute("d", fillD);
      $("heatpath").setAttribute("d", fillD);
      var pointAt = function (s) {
        var lo = 0,
          hi = cum.length - 1;
        while (hi - lo > 1) {
          var mid = (lo + hi) >> 1;
          if (cum[mid] <= s) lo = mid;
          else hi = mid;
        }
        var seg = cum[hi] - cum[lo] || 1,
          f = Math.min(1, Math.max(0, (s - cum[lo]) / seg));
        return [loop[lo][0] + (loop[hi][0] - loop[lo][0]) * f, loop[lo][1] + (loop[hi][1] - loop[lo][1]) * f];
      };
      // stroke proxy: the setter writes the dash offset AND the pen tip position (always in sync, seek-safe)
      var trace = $("pentrace");
      var stroke = { _p: 0 };
      Object.defineProperty(stroke, "p", {
        get: function () {
          return this._p;
        },
        set: function (v) {
          this._p = v;
          inkPath.setAttribute("stroke-dashoffset", (LOOP_L * (1 - v)).toFixed(2));
          var q = pointAt(LOOP_L * v);
          trace.style.transform = "translate(" + q[0].toFixed(2) + "px," + q[1].toFixed(2) + "px)";
        },
      });
      stroke.p = 0;
      var START = loop[0],
        END = loop[loop.length - 1];
      var REST0 = [1682, 232],
        REST1 = [1694, 300]; // pen tip resting on the desk, right of the notebook
      var OFF0 = [REST0[0] - START[0], REST0[1] - START[1]];
      var OFF1 = [REST1[0] - END[0], REST1[1] - END[1]];
      var SH_REST = "drop-shadow(7px 10px 6px rgba(60, 40, 20, 0.3))";
      var SH_LIFT = "drop-shadow(18px 26px 12px rgba(60, 40, 20, 0.2))";

      // ---------- build-time states ----------
      fold.v = 0;
      gsap.set($("penrot"), { rotation: 76, scale: 0.75 });
      gsap.set($("pen"), { x: OFF0[0] + 560, y: OFF0[1] });
      gsap.set($("nb"), { x: 1150, rotation: 4 });
      var pill1 = split($("pt1"));
      var pill2a = split($("pt2"));
      var pill2b = split($("pt3"));

      /* ---------- SCENE 1 (0.00-1.60): the code sheet lies on the desk, crumples, is tossed ---------- */
      // the sheet has just been set down: tiny rotation settle (visible from the first frame)
      tl.fromTo($("sheet"), { rotation: -2.8, y: 6 }, { rotation: -2, y: 0, duration: 0.8, ease: "power2.out" }, 0);
      // « Pas besoin d’être » + [technique.]  (Pas@0.20 besoin@0.40 d’être@0.56 technique@0.82)
      word($("a1"), 0.2);
      word($("a2"), 0.4);
      word($("a3"), 0.56);
      pillTrace("pill1", 0.78);
      letters(pill1, 0.84);

      // crumple: three successive folds (clip-path polygon + scale-down + twist + shading), from 0.82
      var FOLD_T = [0.82, 0.94, 1.06],
        FOLD_D = 0.1;
      var FOLD_SC = [0.8, 0.58, 0.4],
        FOLD_ROT = [6, -7, 12];
      var FOLD_CODE = [
        { scaleX: 0.95, scaleY: 0.9, rotation: -3, skewX: 4 },
        { scaleX: 0.86, scaleY: 0.78, rotation: 5, skewX: -6 },
        { scaleX: 0.8, scaleY: 0.7, rotation: -4, skewX: 8 },
      ];
      var CRUSH = [0.35, 0.6, 0.8];
      var codeFrom = { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0 };
      for (i = 0; i < 3; i++) {
        var at = FOLD_T[i];
        tl.fromTo(fold, { v: i }, { v: i + 1, duration: FOLD_D, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo($("sheet"), { scale: i ? FOLD_SC[i - 1] : 1, rotation: i ? FOLD_ROT[i - 1] : -2 }, { scale: FOLD_SC[i], rotation: FOLD_ROT[i], duration: FOLD_D, ease: "power3.out", immediateRender: false }, at);
        var cf = i ? FOLD_CODE[i - 1] : codeFrom;
        var ct = FOLD_CODE[i];
        tl.fromTo($("code"), { scaleX: cf.scaleX, scaleY: cf.scaleY, rotation: cf.rotation, skewX: cf.skewX }, { scaleX: ct.scaleX, scaleY: ct.scaleY, rotation: ct.rotation, skewX: ct.skewX, duration: FOLD_D, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo($("crease" + (i + 1)), { opacity: 0 }, { opacity: 1, duration: FOLD_D * 0.8, ease: "power1.out", immediateRender: false }, at);
        if (i) tl.fromTo($("crease" + i), { opacity: 1 }, { opacity: 0, duration: FOLD_D * 0.8, ease: "power1.in", immediateRender: false }, at);
        tl.fromTo($("crush"), { opacity: i ? CRUSH[i - 1] : 0 }, { opacity: CRUSH[i], duration: FOLD_D, ease: "power1.out", immediateRender: false }, at);
      }
      // the crushed sheet becomes the paper ball (same size, same place), final squeeze
      var T_BALL = 1.15;
      tl.set($("ballpos"), { opacity: 1, immediateRender: false }, T_BALL);
      tl.set($("sheet"), { opacity: 0, immediateRender: false }, T_BALL + 0.02);
      tl.fromTo($("ball"), { scale: 1.06, rotation: 12 }, { scale: 1, rotation: 4, duration: 0.06, ease: "power2.out", immediateRender: false }, T_BALL);
      // toss off to the bottom-left: tiny wind-up, then out of frame by 1.45 (lifts toward the camera, spins)
      tl.fromTo($("ballpos"), { x: 0, y: 0 }, { x: 12, y: -16, duration: 0.06, ease: "power2.out", immediateRender: false }, 1.16);
      // x leaves at speed, y drops later (power1 = quad): a curved throw that exits the left edge
      tl.fromTo($("ballpos"), { x: 12 }, { x: -1200, duration: 0.23, ease: "none", immediateRender: false }, 1.22);
      tl.fromTo($("ballpos"), { y: -16 }, { y: 470, duration: 0.23, ease: "power1.in", immediateRender: false }, 1.22);
      tl.fromTo($("ball"), { scale: 1, rotation: 4 }, { scale: 1.14, rotation: -380, duration: 0.23, ease: "power1.out", immediateRender: false }, 1.22);

      // the phrase clears its band before the notebook scene (per-word lift + blur, staggered)
      var ph1 = [$("a1"), $("a2"), $("a3"), $("pill1")];
      for (i = 0; i < ph1.length; i++) {
        tl.fromTo(ph1[i], { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.46 + i * 0.02);
      }

      /* ---------- SCENE 2 (1.60-3.80): notebook, the pen draws the zero, it fills ---------- */
      // the notebook slides in from the right and settles (fast in, soft landing, tiny rotation settle)
      tl.set($("nb"), { opacity: 1, immediateRender: false }, 1.5);
      tl.fromTo($("nb"), { x: 1150, rotation: 4 }, { x: 0, rotation: -1.5, duration: 0.6, ease: "power3.out", immediateRender: false }, 1.5);
      // the pen slides in right behind it and lies on the desk
      tl.set($("pen"), { opacity: 1, immediateRender: false }, 1.58);
      tl.fromTo($("pen"), { x: OFF0[0] + 560 }, { x: OFF0[0], duration: 0.58, ease: "power3.out", immediateRender: false }, 1.58);

      // « C’est pensé pour ceux qui partent » + [de zéro.]
      word($("b1"), 1.76);
      word($("b2"), 1.88);
      word($("b3"), 2.12);
      word($("b4"), 2.36);
      word($("b5"), 2.46);
      word($("b6"), 2.68);
      pillTrace("pill2", 2.94);
      letters(pill2a, 2.98);
      letters(pill2b, 3.14);

      // the pen lifts and comes to the top of the page
      tl.fromTo($("pen"), { x: OFF0[0], y: OFF0[1] }, { x: 0, y: 0, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 2.6);
      tl.fromTo($("penrot"), { rotation: 76 }, { rotation: 36, duration: 0.36, ease: "power2.inOut", immediateRender: false }, 2.6);
      tl.fromTo($("pen"), { filter: SH_REST }, { filter: SH_LIFT, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.6);
      tl.fromTo($("pen"), { filter: SH_LIFT }, { filter: SH_REST, duration: 0.1, ease: "power2.in", immediateRender: false }, 2.88);
      // svg-path-draw: the zero is traced 2.98 -> 3.30 (tip and stroke in sync)
      tl.set($("ink"), { opacity: 1, immediateRender: false }, 2.98);
      tl.fromTo(stroke, { p: 0 }, { p: 1, duration: 0.32, ease: "power1.inOut", immediateRender: false }, 2.98);
      tl.fromTo($("penrot"), { rotation: 36 }, { rotation: 42, duration: 0.32, ease: "none", immediateRender: false }, 2.98);
      // then the pen is set down on the desk, out of the way
      tl.fromTo($("pen"), { x: 0, y: 0 }, { x: OFF1[0], y: OFF1[1], duration: 0.52, ease: "power2.inOut", immediateRender: false }, 3.32);
      tl.fromTo($("penrot"), { rotation: 42 }, { rotation: 72, duration: 0.52, ease: "power2.inOut", immediateRender: false }, 3.32);
      tl.fromTo($("pen"), { filter: SH_REST }, { filter: SH_LIFT, duration: 0.16, ease: "power2.out", immediateRender: false }, 3.32);
      tl.fromTo($("pen"), { filter: SH_LIFT }, { filter: SH_REST, duration: 0.14, ease: "power2.in", immediateRender: false }, 3.7);

      // stat-bars-and-fills: the inside fills with terracotta from the bottom up at 3.30
      tl.set($("inkfill"), { opacity: 1, immediateRender: false }, 3.3);
      tl.fromTo($("inkfill"), { clipPath: "inset(672px 0px 0px 0px)" }, { clipPath: "inset(228px 0px 0px 0px)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.3);

      /* ---------- SCENE 3 (3.80-4.25, held still to 5.00 under the iris) ---------- */
      // the centre heats up, the ring warms, then a hot bloom opens from (1400, 450)
      tl.fromTo($("heat"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.in", immediateRender: false }, 3.8);
      tl.fromTo(inkPath, { stroke: "#c25b28" }, { stroke: "#e08a5c", duration: 0.45, ease: "power2.in", immediateRender: false }, 3.8);
      tl.fromTo($("bloom"), { scale: 0.1 }, { scale: 1.15, duration: 0.56, ease: "power2.out", immediateRender: false }, 3.86);
      tl.fromTo($("bloom"), { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power1.out", immediateRender: false }, 3.86);
      // slow push toward the zero's centre (desk + objects together, centre stays on 1400, 450)
      tl.fromTo([$("deskcam"), $("cam")], { scale: 1 }, { scale: 1.03, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 3.8);

      // hold still to the end of the extended clips (5.0 s)
      tl.set({}, {}, 5.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-zero"] = tl;
    })();
  </script>
</template>
