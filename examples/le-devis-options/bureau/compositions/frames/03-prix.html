  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-prix";
      var TOTAL = 3.56;
      var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function q(id) { return host.querySelector("#" + id) || document.getElementById(id); }
      function qa(sel) { return Array.prototype.slice.call(host.querySelectorAll(sel)); }

      var tl = gsap.timeline({ paused: true });

      // ---------- stampSlam: rubber-stamp impact (copied from 02-attente) ----------
      // slamEl = the .xxx-stamp-slam element (CSS opacity:0), t = start of the drop,
      // shakeEl = optional full-frame wrapper that takes the 2-frame camera shake. Returns the impact time.
      function stampSlam(timeline, slamEl, t, shakeEl) {
        var DROP = 0.12;
        var F = 1 / 30;
        timeline.fromTo(slamEl,
          { scale: 1.35, opacity: 0, filter: "blur(2px)" },
          { scale: 1, opacity: 0.92, filter: "blur(2px)", duration: DROP, ease: "power4.in", immediateRender: false },
          t);
        timeline.fromTo(slamEl,
          { filter: "blur(2px)" },
          { filter: "blur(0px)", duration: 0.28, ease: "power2.out", immediateRender: false },
          t + DROP);
        if (shakeEl) {
          timeline.fromTo(shakeEl, { x: 0, y: 0 }, {
            keyframes: [
              { x: 4, y: -3, duration: F, ease: "none" },
              { x: -3, y: 2.5, duration: F, ease: "none" },
              { x: 0, y: 0, duration: F, ease: "none" }
            ],
            immediateRender: false
          }, t + DROP);
        }
        return t + DROP;
      }

      // ---------- phrase: words on their voice cues (Scene 1) ----------
      qa(".f03-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 12, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          t);
      });
      // traced accent pill: each segment traces from the left, then its letters land (x only)
      qa(".f03-seg").forEach(function (sg) {
        var t = parseFloat(sg.getAttribute("data-cue"));
        var bg = sg.querySelector(".f03-segbg");
        var solo = sg.classList.contains("f03-seg-solo");
        var tt = t - (solo ? 0.05 : 0.03);
        tl.set(bg, { opacity: 1, immediateRender: false }, tt);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: solo ? 0.26 : 0.2, ease: "power3.out", immediateRender: false }, tt);
        var letters = Array.prototype.slice.call(sg.querySelectorAll(".f03-l"));
        var mid = (letters.length - 1) / 2;
        letters.forEach(function (l, i) {
          tl.fromTo(l,
            { opacity: 0, x: (i - mid) * 7 },
            { opacity: 1, x: 0, duration: 0.26, ease: "power3.out", immediateRender: false },
            t + i * 0.012);
        });
      });

      // ---------- the pile (Scenes 1-2) ----------
      // Scene 1: sheets drop from above one after another (slight drift, rotation settle).
      // Scene 2 (from 1.62): center-outward-expansion, every paper leaves the stage centre at
      // START_PROGRESS of its offset and lands on its target, power3.out, faster and faster.
      var CX = 960, CY = 540;
      qa(".f03-p").forEach(function (p) {
        var tx = Number(p.dataset.cx) - CX;
        var ty = Number(p.dataset.cy) - CY;
        var r = Number(p.dataset.r);
        gsap.set(p, { x: tx, y: ty, rotation: r });
        if (p.dataset.t === undefined) return; // already on the desk at t = 0
        var t = Number(p.dataset.t);
        var sp = Number(p.dataset.sp);
        var d = Number(p.dataset.d);
        tl.set(p, { opacity: 1, immediateRender: false }, t); // arrives opaque: the fast drop reads as a slap, not a fade
        tl.fromTo(p,
          { x: tx * sp, y: ty * sp + Number(p.dataset.dy), scale: Number(p.dataset.s0), rotation: r + Number(p.dataset.dr) },
          { x: tx, y: ty, scale: 1, rotation: r, duration: d, ease: "power3.out", immediateRender: false },
          t);
        // the shadow tightens as the sheet reaches the desk
        tl.fromTo(p.querySelector(".f03-p-sh"),
          { x: 44, y: 56, opacity: 0.3 },
          { x: 0, y: 0, opacity: 1, duration: d, ease: "power3.out", immediateRender: false },
          t);
        // pain-pill printed on the paper as it lands
        var pill = p.querySelector(".f03-pp");
        if (pill) {
          tl.fromTo(pill,
            { opacity: 0, scale: 1.3 },
            { opacity: 1, scale: 1, duration: 0.14, ease: "power4.out", immediateRender: false },
            Number(pill.dataset.t));
        }
      });

      // the lamp pool dims while the pile grows (the room gets heavier)
      tl.fromTo(q("f03-dim"), { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.inOut", immediateRender: false }, 1.62);

      // ---------- camera: slow creep under the pile, hard kick on STOP., then stillness ----------
      var CAM = [q("f03-deskcam"), q("f03-cam")];
      var CAMIN = [q("f03-deskcamin"), q("f03-camin")];
      // wrappers always carry a transform, so a fresh seek and a revisited seek composite identically
      gsap.set([q("f03-deskshake"), q("f03-shake")].concat(CAMIN), { x: 0, y: 0 });
      var SLAM_T = 2.96;
      var S_END = 1.035;
      tl.fromTo(CAM, { scale: 1 }, { scale: S_END, duration: SLAM_T + 0.12, ease: "sine.in" }, 0);

      // ---------- Scene 3 (3.05-3.56): giant STOP. stamp slams dead centre (kinetic-beat-slam) ----------
      var IMPACT = stampSlam(tl, q("f03-stamp-slam"), SLAM_T, [q("f03-deskshake"), q("f03-shake")]); // 3.08
      tl.fromTo(CAM, { scale: S_END * 1.06, rotation: -0.7 }, { scale: S_END, rotation: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, IMPACT);
      tl.fromTo(CAMIN, { x: 0, y: 0 }, {
        keyframes: [
          { x: 12, y: -9, duration: 1 / 30, ease: "none" },
          { x: -9, y: 7, duration: 1 / 30, ease: "none" },
          { x: 5, y: -4, duration: 1 / 30, ease: "none" },
          { x: -2, y: 1.5, duration: 1 / 30, ease: "none" },
          { x: 0, y: 0, duration: 1 / 30, ease: "none" }
        ],
        immediateRender: false
      }, IMPACT);
      // hold still to the end (the orchestrator floods the light at 3.4)
      tl.set({}, {}, TOTAL);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
