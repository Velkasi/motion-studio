  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById("f07-" + id);
      };
      var TAU = Math.PI * 2;

      // ---------- baked layout (measured once in headless Chrome with the shipped fonts) ----------
      var LINE_X = 64; // left edge of the written line (paper px), matches .f07-line left
      var BASE = 850; // its baseline (paper px)
      var LINE_W = 294; // width of "Apprendre à t’en servir" at 500 28px
      var WORDS = [
        [0, 141],
        [147, 162],
        [168, 216],
        [221, 294],
      ]; // [start, end] of each written word, line-local px

      var tl = gsap.timeline({ paused: true });

      // ---------- helpers ----------
      var split = function (el, cls) {
        var txt = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.className = cls;
          s.textContent = txt[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      };
      // word by word on the voice timestamp
      var word = function (el, at) {
        tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, at);
      };
      // traced accent pill: the fill traces from the left, then the letters write inside on their word cues
      var pill = function (id, at, groups) {
        var bg = $(id + "bg");
        tl.set(bg, { opacity: 1, immediateRender: false }, at);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, at);
        var chars = document.querySelectorAll("#f07-" + id + " .f07-ch");
        groups.forEach(function (g) {
          for (var i = g[0]; i < g[1]; i++) {
            tl.fromTo(chars[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, g[2] + (i - g[0]) * 0.02);
          }
        });
      };
      // printed text types itself, one character at a time (discrete)
      var type = function (chars, at, step) {
        for (var i = 0; i < chars.length; i++) tl.set(chars[i], { opacity: 1, immediateRender: false }, at + i * step);
      };
      // seek-safe proxy property: every write goes straight to the DOM
      var prop = function (obj, key, write) {
        Object.defineProperty(obj, key, {
          get: function () {
            return this["_" + key];
          },
          set: function (v) {
            this["_" + key] = v;
            write();
          },
        });
      };
      // hand-made pen stroke (deterministic wobble)
      var hand = function (x0, y0, x1, y1, n, amp, ph) {
        var pts = [];
        for (var k = 0; k <= n; k++) {
          var u = k / n;
          var w = amp * Math.sin(u * TAU * 1.3 + ph) + amp * 0.45 * Math.sin(u * TAU * 3.7 + ph * 2.1);
          pts.push([x0 + (x1 - x0) * u, y0 + (y1 - y0) * u + w]);
        }
        return pts;
      };
      var pathD = function (pts) {
        var d = "M" + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
        for (var k = 1; k < pts.length; k++) d += " L" + pts[k][0].toFixed(2) + " " + pts[k][1].toFixed(2);
        return d;
      };
      var lengths = function (pts) {
        var cum = [0];
        for (var k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
        return cum;
      };
      var pointAt = function (pts, cum, s) {
        var lo = 0,
          hi = cum.length - 1;
        while (hi - lo > 1) {
          var mid = (lo + hi) >> 1;
          if (cum[mid] <= s) lo = mid;
          else hi = mid;
        }
        var seg = cum[hi] - cum[lo] || 1,
          f = Math.min(1, Math.max(0, (s - cum[lo]) / seg));
        return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
      };

      // phrase pills: split into letters (build time)
      var splits = document.querySelectorAll("#f07-type .f07-split");
      for (var si = 0; si < splits.length; si++) split(splits[si], "f07-ch");

      // ---------- world geometry (paper px -> world px) ----------
      var PROP = 0.68,
        PLACE_X = 722,
        PLACE_Y = 205,
        SW = 700,
        SH = 990,
        SHEET_ROT = -1.2;
      var paperToWorld = function (px, py) {
        var a = (SHEET_ROT * Math.PI) / 180;
        var dx = px - SW / 2,
          dy = py - SH / 2;
        return [PLACE_X + PROP * (SW / 2 + dx * Math.cos(a) - dy * Math.sin(a)), PLACE_Y + PROP * (SH / 2 + dx * Math.sin(a) + dy * Math.cos(a))];
      };
      var SC = paperToWorld(SW / 2, SH / 2); // sheet centre (lift / fly pivot)

      // ---------- the sheet as left by frame 06: four rows struck ----------
      $("st1").setAttribute("d", pathD(hand(44, 223, 658, 246, 60, 1.8, 0.3)));
      $("st2").setAttribute("d", pathD(hand(44, 367, 658, 368, 60, 1.6, 1.4)));
      $("st3").setAttribute("d", pathD(hand(44, 462, 658, 466, 60, 1.7, 2.2)));
      $("st4").setAttribute("d", pathD(hand(44, 558, 658, 561, 60, 1.5, 0.9)));
      gsap.set($("sheet"), { rotation: SHEET_ROT });
      gsap.set($("fly"), { transformOrigin: SC[0].toFixed(2) + "px " + SC[1].toFixed(2) + "px" });

      // ---------- pen: one state, one writer (tip, angle, lift) ----------
      var penEl = $("pen"),
        penRot = $("penrot"),
        penShade = $("penshade");
      var pen = { _px: 752, _py: 400, _pr: 62, _pl: 0 };
      var drawPen = function () {
        penEl.style.transform = "translate(" + pen._px.toFixed(2) + "px," + pen._py.toFixed(2) + "px)";
        penRot.style.transform = "rotate(" + pen._pr.toFixed(3) + "deg) scale(" + (1 + 0.035 * pen._pl).toFixed(4) + ")";
        penShade.style.transform = "translate(" + (2 + 18 * pen._pl).toFixed(2) + "px," + (3 + 26 * pen._pl).toFixed(2) + "px) rotate(" + (pen._pr + 2.2).toFixed(3) + "deg)";
        penShade.style.filter = "blur(" + (3.5 + 7 * pen._pl).toFixed(2) + "px)";
        penShade.style.opacity = (0.34 - 0.12 * pen._pl).toFixed(3);
      };
      ["px", "py", "pr", "pl"].forEach(function (k) {
        prop(pen, k, drawPen);
      });
      drawPen();
      var P_REST = [752, 400, 62];
      var lift = function (at, d) {
        tl.fromTo(pen, { pl: 0 }, { pl: 1, duration: d / 2, ease: "power2.out", immediateRender: false, lazy: false }, at);
        tl.fromTo(pen, { pl: 1 }, { pl: 0, duration: d / 2, ease: "power2.in", immediateRender: false, lazy: false }, at + d / 2);
      };

      // the empty slot line (svg-path-draw, dash offset and pen tip in sync)
      var slotPts = hand(54, 866, 646, 865, 90, 1.1, 0.4);
      var slotCum = lengths(slotPts);
      var SLOT_L = slotCum[slotCum.length - 1];
      var slotPath = $("slotpath");
      slotPath.setAttribute("d", pathD(slotPts));
      slotPath.setAttribute("stroke-dasharray", SLOT_L.toFixed(2) + " " + (SLOT_L + 20).toFixed(2));
      slotPath.setAttribute("stroke-dashoffset", SLOT_L.toFixed(2));
      var ul = { _u: 0 };
      prop(ul, "u", function () {
        slotPath.setAttribute("stroke-dashoffset", (SLOT_L * (1 - ul._u)).toFixed(2));
        var q = pointAt(slotPts, slotCum, SLOT_L * ul._u);
        pen.px = q[0];
        pen.py = q[1];
      });

      // the written line: text revealed exactly behind the moving tip, the tip bobs like a hand
      var line = $("line");
      var clipLine = function (p) {
        line.style.clipPath = "inset(-16px " + (LINE_W - p + 0.5).toFixed(2) + "px -16px -12px)";
      };
      clipLine(0);
      var R_W = 9,
        WAVE = 34; // paper px per bob cycle: keeps the bob under ~10 Hz at the writing speed
      var wState = function (p) {
        var ph = (p / WAVE) * TAU;
        return [LINE_X + p, BASE - (3 + 8 * (0.5 - 0.5 * Math.cos(ph))), R_W + 0.6 * Math.sin(ph + 1)];
      };
      var wr = { _p: 0 };
      prop(wr, "p", function () {
        var s = wState(wr._p);
        clipLine(wr._p);
        pen.px = s[0];
        pen.py = s[1];
        pen.pr = s[2];
      });

      // ---------- camera: coordinate-target zoom on the written line (desk + world, same tweens) ----------
      var CAMS = [$("deskcam"), $("cam")];
      var PT = paperToWorld(250, 842); // zoom target on the paper
      var S = 3.36; // paper-line 28px -> 64px on screen
      var F = [960, 555]; // where the target lands (paper bottom stays above y 900)
      gsap.set(CAMS, { transformOrigin: PT[0].toFixed(2) + "px " + PT[1].toFixed(2) + "px" });
      var ZX = F[0] - PT[0],
        ZY = F[1] - PT[1],
        ZR = -SHEET_ROT; // roll so the written line reads level
      tl.fromTo(CAMS, { scale: 1 }, { scale: 1.012, duration: 2.1, ease: "none" }, 0);
      tl.fromTo(CAMS, { x: 0, y: 0, scale: 1.012, rotation: 0 }, { x: ZX, y: ZY, scale: S, rotation: ZR, duration: 0.64, ease: "power3.inOut", immediateRender: false }, 2.1);
      tl.fromTo(CAMS, { scale: S }, { scale: S * 1.012, duration: 0.86, ease: "none", immediateRender: false }, 2.74);
      tl.fromTo(CAMS, { x: ZX, y: ZY, scale: S * 1.012, rotation: ZR }, { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 3.6);

      // ---------- SCENE 1 (0.00-2.10): the struck quote, phrase at the top, the pen draws the empty slot ----------
      word($("a1"), 0.08); // Il
      word($("a2"), 0.24); // ne
      word($("a3"), 0.44); // reste
      pill("pill1", 0.56, [
        [0, 6, 0.66], // qu’une@0.64
        [6, 12, 0.96], // ligne@0.96
      ]);
      word($("a4"), 1.14); // sur
      word($("a5"), 1.36); // le
      word($("a6"), 1.52); // devis
      // the muted total gives way to the last line
      tl.fromTo($("total"), { opacity: 0.3 }, { opacity: 0, duration: 0.3, ease: "power1.out", immediateRender: false }, 1.0);
      // pen: lifted from the desk to the slot start, draws the slot left to right, then back to the line start
      var S0 = slotPts[0],
        S1 = slotPts[slotPts.length - 1],
        W0 = wState(0);
      tl.fromTo(pen, { px: P_REST[0], py: P_REST[1], pr: P_REST[2] }, { px: S0[0], py: S0[1], pr: 8, duration: 0.3, ease: "power2.inOut", immediateRender: false, lazy: false }, 0.9);
      lift(0.9, 0.3);
      tl.set($("slotink"), { opacity: 1, immediateRender: false }, 1.2);
      tl.fromTo(ul, { u: 0 }, { u: 1, duration: 0.42, ease: "power1.inOut", immediateRender: false, lazy: false }, 1.2);
      tl.fromTo(pen, { pr: 8 }, { pr: 10, duration: 0.42, ease: "none", immediateRender: false, lazy: false }, 1.2);

      tl.fromTo(pen, { px: S1[0], py: S1[1], pr: 10 }, { px: W0[0], py: W0[1], pr: W0[2], duration: 0.54, ease: "power2.inOut", immediateRender: false, lazy: false }, 1.66);
      lift(1.66, 0.54);

      // ---------- SCENE 2 (2.10-3.60): push-in on the slot, the pen writes the line on the voice ----------
      // text-to-text zoom-through (forward): phrase 1 accelerates toward the viewer, hard cut, phrase 2 grows in
      tl.fromTo($("ph1fx"), { scale: 1, filter: "blur(0px)" }, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 1.98);
      tl.fromTo($("ph1fx"), { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "none", immediateRender: false }, 1.98);
      tl.set($("ph1fx"), { opacity: 0, immediateRender: false }, 2.18);
      tl.fromTo($("ph2fx"), { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 2.18);
      word($("b1"), 2.26); // Apprendre
      word($("b2"), 2.6); // à
      pill("pill2", 2.64, [
        [0, 4, 2.72], // t’en@2.72
        [4, 11, 2.92], // servir@2.92
      ]);
      // each word is written on its own cue; short hops over the spaces
      var WT = [
        [2.26, 2.56],
        [2.6, 2.69],
        [2.72, 2.9],
        [2.92, 3.2],
      ];
      tl.set(line, { opacity: 1, immediateRender: false }, 2.26);
      for (var k = 0; k < WT.length; k++) {
        tl.fromTo(wr, { p: WORDS[k][0] }, { p: WORDS[k][1], duration: WT[k][1] - WT[k][0], ease: "power1.inOut", immediateRender: false, lazy: false }, WT[k][0]);
        if (k < WT.length - 1) {
          tl.fromTo(wr, { p: WORDS[k][1] }, { p: WORDS[k + 1][0], duration: WT[k + 1][0] - WT[k][1], ease: "power1.inOut", immediateRender: false, lazy: false }, WT[k][1]);
        }
      }
      // the pen lifts away to the right once the line is written
      var WE = wState(LINE_W);
      tl.fromTo(pen, { px: WE[0], py: WE[1], pr: WE[2] }, { px: WE[0] + 950, py: WE[1] - 110, pr: R_W - 5, duration: 0.34, ease: "power3.in", immediateRender: false, lazy: false }, 3.22);
      tl.fromTo(pen, { pl: 0 }, { pl: 1, duration: 0.2, ease: "power2.out", immediateRender: false, lazy: false }, 3.22);
      tl.set(penEl, { opacity: 0, immediateRender: false }, 3.58);
      // motion-blur-streak (path A): the comet underlines the line; X-only blur rides the move's window + ease
      var streakNode = $("streakblur");
      var PEAK_BLUR = 12;
      var sb = { _v: PEAK_BLUR };
      prop(sb, "v", function () {
        streakNode.setAttribute("stdDeviation", sb._v.toFixed(2) + " 0");
      });
      sb.v = PEAK_BLUR; // seed: a seek to the streak start shows the smeared state
      var COMET = 3.18,
        COMET_D = 0.42,
        COMET_W = LINE_X + LINE_W + 16 - 54;
      tl.fromTo($("comethead"), { x: -COMET_W, opacity: 0 }, { x: 0, opacity: 1, duration: COMET_D, ease: "expo.out", immediateRender: false }, COMET);
      tl.fromTo($("comettail"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: COMET_D, ease: "expo.out", immediateRender: false }, COMET);
      tl.fromTo(sb, { v: PEAK_BLUR }, { v: 0, duration: COMET_D, ease: "expo.out", immediateRender: false, lazy: false }, COMET);
      tl.fromTo($("comethead"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out", immediateRender: false }, COMET + COMET_D + 0.04);

      // text-to-text inverse zoom-through: phrase 2 recedes, hard cut, phrase 3 arrives oversized
      tl.fromTo($("ph2fx"), { scale: 1, filter: "blur(0px)" }, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 3.6);

      tl.set($("ph2fx"), { opacity: 0, immediateRender: false }, 3.8);
      tl.fromTo($("ph3fx"), { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 3.8);
      word($("c1"), 3.86); // C’est
      word($("c2"), 4.06); // la
      word($("c3"), 4.28); // seule
      word($("c4"), 4.46); // qui
      word($("c5"), 4.64); // te
      word($("c6"), 4.82); // rend

      // the sheet lifts off the desk (shadow grows and softens), rolls to -14deg, flies out top-right
      var FLY = 4.7,
        FLY_D = 0.4;
      var fly = $("fly");
      tl.fromTo(fly, { scale: 1 }, { scale: 1.06, duration: 0.22, ease: "power2.out", immediateRender: false }, FLY);
      tl.fromTo(fly, { x: 0, y: 0 }, { x: 1300, y: -1050, duration: FLY_D, ease: "power3.in", immediateRender: false }, FLY);
      tl.fromTo(fly, { rotation: 0 }, { rotation: -14 - SHEET_ROT, duration: FLY_D, ease: "power2.in", immediateRender: false }, FLY);
      tl.fromTo($("sheetshadow"), { x: 0, y: 0, opacity: 1, filter: "blur(17.6px)" }, { x: 40, y: 58, opacity: 0.7, filter: "blur(44px)", duration: 0.24, ease: "power2.out", immediateRender: false }, FLY);
      // slight motion blur riding the flight (same window + ease, peaks at peak speed)
      var flyNode = $("flyblur");
      var fb = { _v: 0 };
      prop(fb, "v", function () {
        flyNode.setAttribute("stdDeviation", fb._v.toFixed(2) + " " + (fb._v * 0.45).toFixed(2));
      });
      fb.v = 0;
      tl.set($("sheet"), { filter: "url(#f07-flyf)", immediateRender: false }, FLY);
      tl.fromTo(fb, { v: 0 }, { v: 16, duration: FLY_D, ease: "power3.in", immediateRender: false, lazy: false }, FLY);
      tl.set(fly, { opacity: 0, immediateRender: false }, FLY + FLY_D);

      // giant-pill « libre. »: the pill traces from the left with a -6deg settle, then the letters land
      // inside with the tracking tighten (split letters, per-letter x only)
      var GP = 4.96,
        GL = 5.06,
        GP_EM = 260;
      tl.set($("gpillbg"), { opacity: 1, immediateRender: false }, GP);
      tl.fromTo($("gpillbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power3.out", immediateRender: false }, GP);
      tl.fromTo($("gpillbg"), { rotation: -6 }, { rotation: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, GP);
      var gl = split($("gpilltx"), "f07-ch");
      gl.forEach(function (c, i) {
        tl.fromTo(
          c,
          { opacity: 0, x: (i - (gl.length - 1) / 2) * 0.4 * GP_EM, filter: "blur(12px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
          GL + i * 0.02,
        );
      });

      // perfectly still hold to the end of the frame (scene clips run 6.52 s for the transition overlap)
      tl.set({}, {}, 6.52);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-ligne"] = tl;
    })();
  </script>
