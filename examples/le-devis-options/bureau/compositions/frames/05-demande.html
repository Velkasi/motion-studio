      /* ---------- Camera (coordinate-target-zoom, anchored on the hinge) ----------
         The lid is a perspective plane hinged at (960, 370). Its projected lift above the hinge
         for a point d px up the lid, at angle a: d cos(a) * P / (P - z), z = -d sin(a).
         Final framing, solved analytically (no layout read): lid top lands at y 178 (under the
         phrase band), screen bottom at y 912, keyboard edge left visible at the bottom. The zoom
         scales about the hinge and the cam translates the hinge, so the target path is monotonic. */
      var PERSP = 2200;
      var HINGE_Y = 370;
      function lift(aDeg, d) {
        var a = (aDeg * Math.PI) / 180;
        var z = -d * Math.sin(a);
        return (d * Math.cos(a) * PERSP) / (PERSP - z);
      }
      var A0 = -42;
      var AF = -34;
      var LID_TOP_ON = 178;
      var SCREEN_BOTTOM_ON = 912;

      var PUSH_DUR = 0.5;
