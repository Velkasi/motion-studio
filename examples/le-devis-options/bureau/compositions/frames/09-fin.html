  <script>
    (function () {
      var FID = "09-fin";
      var byId = function (id) {
        return document.getElementById(id);
      };
      var toArr = function (list) {
        return Array.prototype.slice.call(list);
      };
      var stage = byId("f09-stage");

      /* ---- terracotta wave texture: 34 thin lines across the top third, deterministic ---- */
      var svg = byId("f09-waves");
      var NS = "http://www.w3.org/2000/svg";
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      var N = 34;
      var rows = [];
      for (var i = 0; i < N; i++) {
        var t = i / (N - 1);
        var base = 8 + i * 9.6;
        var amp = 18 + 8 * Math.sin(i * 0.23 + 0.4);
        var ph = i * 0.17;
        var op = 0.06 + 0.56 * Math.pow(1 - t, 1.6);
        var sw = 1.5 - 0.5 * t;
        var halves = [];
        for (var s = 0; s < 2; s++) {
          var dir = s === 0 ? 1 : -1;
          var d = "";
          for (var k = 0; k <= 52; k++) {
            var x = 960 + dir * k * 20;
            var y =
              base +
              amp * Math.sin((2 * Math.PI * x) / 1150 + ph) +
              6 * Math.sin((2 * Math.PI * x) / 470 - i * 0.21 + 1.3);
            d += (k === 0 ? "M" : " L") + x.toFixed(1) + " " + y.toFixed(1);
          }
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          p.setAttribute("pathLength", "1");
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", "#d4703f");
          p.setAttribute("stroke-opacity", op.toFixed(3));
          p.setAttribute("stroke-width", sw.toFixed(2));
          p.setAttribute("stroke-dasharray", "1 1");
          p.setAttribute("stroke-dashoffset", "1");
          svg.appendChild(p);
          halves.push(p);
        }
        rows.push(halves);
      }

      var halo = byId("f09-halo");
      var haloCta = byId("f09-halo-cta");
      var bgglow = byId("f09-bgglow");
      var letters = toArr(stage.getElementsByClassName("f09-l"));
      var two = byId("f09-two");
      var forme = byId("f09-forme");
      var pill = byId("f09-pill");
      var pillBg = byId("f09-pill-bg");
      var pw1 = toArr(byId("f09-pw-1").getElementsByClassName("f09-pl"));
      var pw2 = toArr(byId("f09-pw-2").getElementsByClassName("f09-pl"));
      var pw3 = toArr(byId("f09-pw-3").getElementsByClassName("f09-pl"));
      var subWords = toArr(stage.getElementsByClassName("f09-sw"));
      var ctaWrap = byId("f09-cta-wrap");
      var cta = byId("f09-cta");
      var burst = byId("f09-burst");
      var url = byId("f09-url");
      var rings = [byId("f09-ring-1"), byId("f09-ring-2")];
      var cursor = byId("f09-cursor");

      var REST_SHADOW = "0px 26px 60px 0px rgba(0, 0, 0, 0.55), 0px 0px 70px 0px rgba(194, 91, 40, 0.4)";
      var PRESSED_SHADOW = "0px 8px 18px 0px rgba(0, 0, 0, 0.5), 0px 0px 34px 0px rgba(194, 91, 40, 0.3)";

      var tl = gsap.timeline({ paused: true });

      /* ===== Scene 1 (0.00-1.90): halo ignites, wave lines draw outward, wordmark cascades, 2.0 lands ===== */
      tl.fromTo(halo, { opacity: 0.45, scale: 0.97 }, { opacity: 0.8, scale: 1, duration: 1.1, ease: "power2.out" }, 0);
      for (var r = 0; r < rows.length; r++) {
        tl.fromTo(
          rows[r],
          { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 1.3, ease: "power2.out" },
          0.02 + r * 0.016
        );
      }
      // "Entrepreneurs" @0.53: letters cascade left to right (lead letter starts 2 frames early)
      tl.fromTo(
        letters,
        { opacity: 0, y: 48, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: 0.03 },
        0.47
      );
      // "deux point zero" @1.11: 2.0 lands in accent-light, inverse-zoom arrival
      tl.fromTo(
        two,
        { opacity: 0, scale: 1.28, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        1.07
      );
      // brand sting on the halo, then settle
      tl.to(halo, { opacity: 1, scale: 1.04, duration: 0.35, ease: "power2.out" }, 1.08);
      tl.to(halo, { opacity: 0.85, scale: 1, duration: 1.2, ease: "power2.inOut" }, 1.43);

      /* ===== Scene 2 (1.90-3.20): Forme-toi + traced pill "pour de bon." ===== */
      // "Forme-toi" @2.17 (word-by-word spec)

        forme,
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },

      tl.fromTo(
        pillBg,
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        2.53
      );
      tl.fromTo(
        pill,
        { rotation: -8 },
        { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false },
        2.53
      );
      // then the letters write inside, each word on its voice cue
      var writeIn = function (els, at) {
        tl.fromTo(
          els,
          { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.02 },
          at
        );
      };
      writeIn(pw1, 2.58); // pour @2.59
      writeIn(pw2, 2.79); // de @2.81
      writeIn(pw3, 2.97); // bon @2.99

      /* ===== Scene 3 (3.20-4.60): sub-line, CTA on a smooth settle, URL ===== */
      tl.fromTo(
        subWords,
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", stagger: 0.045 },
        3.3
      );
      tl.fromTo(
        ctaWrap,
        { opacity: 0, y: 30, scale: 0.965, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" },
        3.6
      );
      tl.fromTo(haloCta, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 3.6);
      // URL: left-to-right wipe
      tl.fromTo(
        url,
        { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" },
        { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.inOut" },
        4.0
      );

      /* ===== Scene 4 (4.60-7.05): cursor glides in, clicks @5.20, then everything holds still ===== */
      // cursor-click-ripple phase 1: move (x and y on different eases = gentle arc), ends 5.10
      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.58);
      tl.fromTo(cursor, { x: 520 }, { x: 0, duration: 0.52, ease: "power2.inOut" }, 4.58);
      tl.fromTo(cursor, { y: 150 }, { y: 0, duration: 0.52, ease: "power3.out" }, 4.58);

      var CLICK = 5.2;
      var PRESS = 0.1;
      var RELEASE = CLICK + PRESS;
      // phase 2: cursor compresses more than the target, both return
      tl.to(cursor, { scale: 0.85, duration: PRESS, ease: "power2.in" }, CLICK);
      tl.to(cursor, { scale: 1, duration: 0.14, ease: "power2.out" }, RELEASE);
      // press-release-spring: linear-feel press (scale + darker paper + tight shadow)
      tl.to(
        cta,
        { scale: 0.94, backgroundColor: "#e7dac9", boxShadow: PRESSED_SHADOW, duration: PRESS, ease: "power1.in" },
        CLICK
      );
      // release adjacent to the press (state continuity); small overshoot built without back.out (frame.md)
      tl.to(
        cta,
        { scale: 1.016, backgroundColor: "#f6f1e9", boxShadow: REST_SHADOW, duration: 0.22, ease: "power3.out" },
        RELEASE
      );
      tl.to(cta, { scale: 1, duration: 0.45, ease: "power2.inOut" }, RELEASE + 0.22);
      // release burst behind the button, then fades
      tl.fromTo(
        burst,
        { opacity: 0, scale: 0.9 },
        { opacity: 0.7, scale: 1.35, duration: 0.45, ease: "power2.out", immediateRender: false },

      );
      tl.to(burst, { opacity: 0, duration: 0.55, ease: "power2.in" }, RELEASE + 0.48);
      // environmental glow stays lit through the final hold
      tl.fromTo(
        bgglow,
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out", immediateRender: false },
        RELEASE
      );
      // phase 3: two accent rings from the click point (960, 642); max radius 200px keeps them above y = 900
      tl.fromTo(
        rings,
        { scale: 0, opacity: 0.9 },
        { scale: 4, opacity: 0, duration: 0.8, ease: "power2.out", stagger: 0.1, immediateRender: false },
        CLICK + 0.02
      );
      // last motion ends ~6.33s; the end card then holds still to 7.05s (final frame)
      tl.set({ hold: 0 }, { hold: 1 }, 7.05);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
