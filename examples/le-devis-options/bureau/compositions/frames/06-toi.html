      var Q_AT = [0.08, 1.88, 3.48];
      var QM_AT = [0.88, 2.46, 4.4];

      // ---------- baked layout (paper px, measured in headless Chrome with the shipped fonts) ----------
      var LABEL_TOP = [192, 318, 444, 570];
      var PRICE_L = [535, 563, 490, 278]; // left edge of each printed price
      var HW_W = [58, 58, 58, 248]; // advance width of each handwritten word
      var STRIKE_DY = 19; // label top to strike line
      var HW_DY = 34; // label top to handwriting box top
      var HW_PADL = 6,
        HW_PADR = 12,
        HW_CY = 31,
        HW_ROT = [-4, -3, -4, -1.5]; // degrees, per handwritten word

      var tl = gsap.timeline({ paused: true });

      /* ---------- ink geometry ---------- */
      var mkPath = function (pts) {
        var cum = [0];
        for (var k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
        var d = "M" + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
        for (k = 1; k < pts.length; k++) d += " L" + pts[k][0].toFixed(2) + " " + pts[k][1].toFixed(2);
        return { pts: pts, cum: cum, L: cum[cum.length - 1], d: d };
      };
      var pointAt = function (P, s) {
        var lo = 0,
          hi = P.cum.length - 1;
        while (hi - lo > 1) {
          var mid = (lo + hi) >> 1;
          if (P.cum[mid] <= s) lo = mid;
          else hi = mid;
        }
        var seg = P.cum[hi] - P.cum[lo] || 1,
          f = Math.min(1, Math.max(0, (s - P.cum[lo]) / seg));
        return [P.pts[lo][0] + (P.pts[hi][0] - P.pts[lo][0]) * f, P.pts[lo][1] + (P.pts[hi][1] - P.pts[lo][1]) * f];
      };
      // hand-made wavy strike (deterministic): slight rise, two superposed wobbles
      var wavy = function (xa, xb, yc, ph) {
        var N = 96,
          pts = [],
          cyc = Math.abs(xb - xa) / 128;
        for (var k = 0; k <= N; k++) {
          var u = k / N;
          pts.push([
            xa + (xb - xa) * u,
            yc - 3.2 * u + 2.3 * Math.sin(2 * Math.PI * cyc * u + ph) + 0.9 * Math.sin(2 * Math.PI * cyc * 2.3 * u + ph * 1.7),
          ]);
        }
        return mkPath(pts);
      };
      var STRIKES = [
        wavy(40, 664, LABEL_TOP[0] + STRIKE_DY, 0.4),
        wavy(40, 664, LABEL_TOP[1] + STRIKE_DY, 2.1),
        wavy(40, 664, LABEL_TOP[2] + STRIKE_DY, 4.0),
        wavy(664, PRICE_L[3] - 12, LABEL_TOP[3] + STRIKE_DY, 1.2), // Délai: the value only, backhand
      ];
      var strikeEls = [$("s1"), $("s2"), $("s3"), $("s4")];
      STRIKES.forEach(function (P, i) {
        strikeEls[i].setAttribute("d", P.d);
        strikeEls[i].setAttribute("stroke-dasharray", P.L.toFixed(2) + " " + (P.L + 24).toFixed(2));
        strikeEls[i].setAttribute("stroke-dashoffset", P.L.toFixed(2));
      });

      // handwriting boxes: under each struck price, starting at its left edge
      var hwEls = [$("h1"), $("h2"), $("h3"), $("h4")];
      var HW = hwEls.map(function (el, i) {
        var left = PRICE_L[i] + 2 - HW_PADL,
          top = LABEL_TOP[i] + HW_DY;
        el.style.left = left + "px";
        el.style.top = top + "px";
        el.style.transform = "rotate(" + HW_ROT[i] + "deg)";
        return { el: el, ox: left + HW_PADL, oy: top + HW_CY, W: HW_W[i], BW: HW_PADL + HW_W[i] + HW_PADR, letters: i === 3 ? 10 : 3, r: (HW_ROT[i] * Math.PI) / 180 };
      });
      // pen tip while writing: the reveal edge, bobbing through the letter band (rotated with the word)
      var hwTip = function (H, u) {
        var lx = u * H.W;
        var ly = 3 + 10 * Math.sin(2 * Math.PI * H.letters * u - Math.PI / 2) * Math.min(1, u * 8, (1 - u) * 8 + 0.35);
        return [H.ox + lx * Math.cos(H.r) - ly * Math.sin(H.r), H.oy + lx * Math.sin(H.r) + ly * Math.cos(H.r)];
      };

      /* ---------- pen choreography: one pure function of time ---------- */
      var E = {
        none: function (u) {
          return u;
        },
        o2: gsap.parseEase("power2.out"),
        in2: gsap.parseEase("power2.in"),
        io2: gsap.parseEase("power2.inOut"),
        io1: gsap.parseEase("power1.inOut"),
        s: gsap.parseEase("sine.inOut"),
      };
      var lerp = function (a, b, u) {
        return a + (b - a) * u;
      };
      var SEG = [];
      var cur = { x: 748, y: 430, a: 58, l: 0 }; // resting on the desk, right of the sheet
      var goTo = function (t0, t1, B, ease, bump) {
        var A = cur;
        SEG.push({
          t0: t0,
          t1: t1,
          f: function (u) {
            var e = ease(u);
            return { x: lerp(A.x, B.x, e), y: lerp(A.y, B.y, e), a: lerp(A.a, B.a, e), l: lerp(A.l, B.l, e) + (bump || 0) * Math.sin(Math.PI * u) };
          },
        });
        cur = B;
      };
      var INK = []; // {t0, t1, ease, kind, i}
      var strikeStart = function (i, a) {
        var p = STRIKES[i].pts[0];
        return { x: p[0], y: p[1], a: a, l: 0 };
      };
      var strike = function (i, t0, t1, a0, a1) {
        var P = STRIKES[i],
          ease = E.o2;
        SEG.push({
          t0: t0,
          t1: t1,
          f: function (u) {
            var q = pointAt(P, P.L * ease(u));
            return { x: q[0], y: q[1], a: lerp(a0, a1, u), l: 0 };
          },
        });
        INK.push({ t0: t0, t1: t1, ease: ease, kind: "s", i: i });
        var q = P.pts[P.pts.length - 1];
        cur = { x: q[0], y: q[1], a: a1, l: 0 };
      };
      var hwStart = function (i, a) {
        var q = hwTip(HW[i], 0);
        return { x: q[0], y: q[1], a: a, l: 0 };
      };
      var write = function (i, t0, t1, a) {
        var H = HW[i];
        SEG.push({
          t0: t0,
          t1: t1,
          f: function (u) {
            var q = hwTip(H, u);
            return { x: q[0], y: q[1], a: a + 3 * Math.sin(2 * Math.PI * H.letters * u), l: 0 };
          },
        });
        INK.push({ t0: t0, t1: t1, ease: E.none, kind: "w", i: i });
        var q = hwTip(H, 1);
        cur = { x: q[0], y: q[1], a: a, l: 0 };
      };
      var hover = function (row) {
        return { x: 716, y: LABEL_TOP[row] + 8, a: 62, l: 1 };
      };
      var pre = function (row) {
        var p = STRIKES[row].pts[0];
        return { x: p[0] - 14, y: p[1] - 16, a: 42, l: 0.7 };
      };

      // Scene 1 to 2: rest, pick up, glide to row 1, touch down on the beat
      SEG.push({ t0: 0, t1: 0.62, f: function () { return { x: 748, y: 430, a: 58, l: 0 }; } });
      goTo(0.62, 1.12, pre(0), E.io2);
      goTo(1.12, BEATS[0], strikeStart(0, 45), E.in2);
      strike(0, BEATS[0], 1.5, 45, 51);
      goTo(1.5, 1.58, hwStart(0, 46), E.io1, 0.35);
      write(0, 1.58, 1.84, 46);
      // Scene 3: lift off to the margin, wait, swoop to row 2 on the beat
      goTo(1.84, 2.16, hover(1), E.o2);
      goTo(2.16, 2.5, { x: 720, y: LABEL_TOP[1] + 14, a: 60, l: 1 }, E.s);
      goTo(2.5, 2.72, pre(1), E.io2);
      goTo(2.72, BEATS[1], strikeStart(1, 45), E.in2);
      strike(1, BEATS[1], 3.06, 45, 51);
      goTo(3.06, 3.14, hwStart(1, 46), E.io1, 0.35);
      write(1, 3.14, 3.42, 46);
      // Scene 4: same wait, row 3 on the beat, then the flurry on Délai
      goTo(3.42, 3.74, hover(2), E.o2);
      goTo(3.74, 4.36, { x: 720, y: LABEL_TOP[2] + 14, a: 60, l: 1 }, E.s);
      goTo(4.36, 4.6, pre(2), E.io2);
      goTo(4.6, BEATS[2], strikeStart(2, 45), E.in2);
      strike(2, BEATS[2], 4.85, 45, 51);
      goTo(4.85, 4.88, hwStart(2, 46), E.io1, 0.25);
      write(2, 4.88, 4.99, 46);
      goTo(4.99, 5.02, strikeStart(3, 50), E.io1, 0.2);
      strike(3, 5.02, 5.13, 50, 44);
      goTo(5.13, 5.16, hwStart(3, 46), E.io1, 0.2);
      write(3, 5.16, 5.32, 46);
      goTo(5.32, DUR, { x: cur.x + 22, y: cur.y + 10, a: 50, l: 0.6 }, E.o2);

      var penAt = function (t) {
        if (t <= SEG[0].t0) return SEG[0].f(0);
        for (var k = 0; k < SEG.length; k++) {
          var S = SEG[k];
          if (t < S.t0) return SEG[k - 1].f(1);
          if (t <= S.t1) return S.f((t - S.t0) / (S.t1 - S.t0));
        }
        return SEG[SEG.length - 1].f(1);
      };

      var pen = $("pen"),
        trace = $("pentrace"),
        lift = $("penlift"),
        rot = $("penrot");
      var render = function (t) {
        var p = penAt(t);
        trace.style.transform = "translate(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px)";
        lift.style.transform = "scale(" + (1 + 0.045 * p.l).toFixed(4) + ")";
        rot.style.transform = "rotate(" + p.a.toFixed(2) + "deg)";
        pen.style.filter =
          "drop-shadow(" + (7 + 13 * p.l).toFixed(1) + "px " + (10 + 18 * p.l).toFixed(1) + "px " + (5 + 8 * p.l).toFixed(1) + "px rgba(60,40,20," + (0.3 - 0.1 * p.l).toFixed(3) + "))";
        for (var k = 0; k < INK.length; k++) {
          var I = INK[k];
          var u = Math.min(1, Math.max(0, (t - I.t0) / (I.t1 - I.t0)));
          var on = t >= I.t0 ? "1" : "0";
          if (I.kind === "s") {
            var el = strikeEls[I.i],
              L = STRIKES[I.i].L;
            el.style.opacity = on;
            el.setAttribute("stroke-dashoffset", (L * (1 - I.ease(u))).toFixed(2));
          } else {
            var H = HW[I.i];
            H.el.style.opacity = on;
            H.el.style.clipPath = u >= 1 ? "none" : "inset(0px " + Math.max(0, H.BW - (HW_PADL + u * H.W)).toFixed(2) + "px 0px 0px)";
          }
        }
      };
      // seek-safe clock: GSAP writes clock.t on every render, the setter rebuilds the whole pen state
      var clock = { _t: 0 };
      Object.defineProperty(clock, "t", {
        get: function () {
          return this._t;
        },
        set: function (v) {
          this._t = v;
          render(v);
        },
      });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

      /* ---------- right region: question cycle (cut-the-curve upward) + giant slams ---------- */
      var enterWord = function (el, at) {
        tl.fromTo(el, { y: 200, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.32, ease: "power4.out", immediateRender: false }, at);
      };
      var word = function (el, at) {
        tl.fromTo(el, { y: 10, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, at);
      };
      var exitGroup = function (g, cut) {
        tl.fromTo(g, { y: 0 }, { y: -200, duration: 0.26, ease: "power4.in", immediateRender: false }, cut - 0.26);
        tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, cut - 0.22);
      };

      enterWord($("q0a"), Q_AT[0]);
      enterWord($("q0b"), Q_AT[0] + 0.06);
      word($("q0m"), QM_AT[0]);
      exitGroup($("g0"), Q_AT[1]);
      enterWord($("q1a"), Q_AT[1]);
      enterWord($("q1b"), Q_AT[1] + 0.06);
      word($("q1m"), QM_AT[1]);
      exitGroup($("g1"), Q_AT[2]);
      enterWord($("q2a"), Q_AT[2]);
      word($("q2m"), QM_AT[2]);

      // giant tracking tighten via per-letter x (letters split into inline-blocks, spread wide, slide home)
      var trackChars = function (root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      };
      var trackIn = function (chars, spread, dur, ease, at) {
        var n = chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { x: (i - (n - 1) / 2) * spread }, { x: 0, duration: dur, ease: ease, immediateRender: false }, at);
        });
      };
      // kinetic-beat-slam: three hits on the beat grid, each on a distinct axis and ease
      tl.fromTo($("t0"), { opacity: 0, scale: 1.35, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out", immediateRender: false }, BEATS[0]);
      trackIn(trackChars($("t0")), 96, 0.45, "power4.out", BEATS[0]);
      tl.fromTo($("t1"), { opacity: 0, x: 220, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out", immediateRender: false }, BEATS[1]);
      trackIn(trackChars($("t1")), 96, 0.42, "expo.out", BEATS[1]);
      tl.fromTo($("t2"), { opacity: 0, y: 120, rotation: 5, filter: "blur(12px)" }, { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.5, ease: "circ.out", immediateRender: false }, BEATS[2]);
      trackIn(trackChars($("t2")), 96, 0.5, "circ.out", BEATS[2]);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-toi"] = tl;
    })();
  </script>
</template>
