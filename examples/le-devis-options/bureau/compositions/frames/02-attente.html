            <div class="f02-phrase" style="left: 0px; top: 92px;"><span class="f02-w" data-cue="0.08">Réparer</span> <span class="f02-w" data-cue="0.42">une</span> <span class="f02-w" data-cue="0.58">automatisation</span> <span class="f02-w" data-cue="1.20">qui</span> <span class="f02-w" data-cue="1.40">a</span> <span class="f02-pill"><span class="f02-seg f02-seg-solo" data-cue="1.54"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">p</span><span class="f02-l">l</span><span class="f02-l">a</span><span class="f02-l">n</span><span class="f02-l">t</span><span class="f02-l">é</span></span></span></span></div>
            <div class="f02-phrase" style="left: 1775px; top: 792px;"><span class="f02-w" data-cue="3.20">Délai&nbsp;:</span> <span class="f02-pill"><span class="f02-seg f02-seg-first" data-cue="3.94"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">q</span><span class="f02-l">u</span><span class="f02-l">a</span><span class="f02-l">n</span><span class="f02-l">d</span></span></span><span class="f02-seg" data-cue="4.16"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">i</span><span class="f02-l">l</span></span></span><span class="f02-seg" data-cue="4.30"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">a</span><span class="f02-l">u</span><span class="f02-l">r</span><span class="f02-l">a</span></span></span><span class="f02-seg" data-cue="4.46"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">l</span><span class="f02-l">e</span></span></span><span class="f02-seg f02-seg-last" data-cue="4.64"><span class="f02-segbg"></span><span class="f02-segtx"><span class="f02-l">t</span><span class="f02-l">e</span><span class="f02-l">m</span><span class="f02-l">p</span><span class="f02-l">s</span><span class="f02-l">.</span></span></span></span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "02-attente";
      var TOTAL = 5.6;
      var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      function q(id) { return host.querySelector("#" + id) || document.getElementById(id); }
      function qa(sel) { return Array.prototype.slice.call(host.querySelectorAll(sel)); }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

      var tl = gsap.timeline({ paused: true });

      // ---------- stampSlam: rubber-stamp impact (reusable) ----------
      // slamEl = the .xxx-stamp-slam element (CSS opacity:0), t = start of the drop,
      // shakeEl = optional full-frame wrapper that takes the 2-frame camera shake. Returns the impact time.
      function stampSlam(timeline, slamEl, t, shakeEl) {
        var DROP = 0.12;
        var F = 1 / 30;
        timeline.fromTo(slamEl,
          { scale: 1.35, opacity: 0, filter: "blur(2px)" },
          { scale: 1, opacity: 0.92, filter: "blur(2px)", duration: DROP, ease: "power4.in", immediateRender: false },
          t);
        timeline.fromTo(slamEl,
          { filter: "blur(2px)" },
          { filter: "blur(0px)", duration: 0.28, ease: "power2.out", immediateRender: false },
          t + DROP);
        if (shakeEl) {
          timeline.fromTo(shakeEl, { x: 0, y: 0 }, {
            keyframes: [
              { x: 4, y: -3, duration: F, ease: "none" },
              { x: -3, y: 2.5, duration: F, ease: "none" },
              { x: 0, y: 0, duration: F, ease: "none" }
            ],
            immediateRender: false
          }, t + DROP);
        }
        return t + DROP;
      }

      // ---------- svg-path-draw helper (measured lengths) ----------
      function draw(sel, t, dur, ease) {
        var els = qa(sel);
        if (!els.length) return;
        var len = 200;
        try { len = els[0].getTotalLength() * 1.05 || 200; } catch (e) {}
        els.forEach(function (p) {
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = String(len);
        });
        tl.set(els, { opacity: 1 }, t);
        tl.fromTo(els, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out", immediateRender: false }, t);
      }

      // ---------- phrase: words on their cues ----------
      qa(".f02-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 12, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          t);
      });
      // traced accent pill: each segment traces from the left, then its letters land with the tracking tighten (x only)
      qa(".f02-seg").forEach(function (sg) {
        var t = parseFloat(sg.getAttribute("data-cue"));
        var bg = sg.querySelector(".f02-segbg");
        var solo = sg.classList.contains("f02-seg-solo");
        var tt = t - (solo ? 0.05 : 0.03);
        tl.set(bg, { opacity: 1 }, tt);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: solo ? 0.26 : 0.2, ease: "power3.out", immediateRender: false }, tt);
        var letters = Array.prototype.slice.call(sg.querySelectorAll(".f02-l"));
        var mid = (letters.length - 1) / 2;
        letters.forEach(function (l, i) {
          tl.fromTo(l,
            { opacity: 0, x: (i - mid) * 7 },
            { opacity: 1, x: 0, duration: 0.26, ease: "power3.out", immediateRender: false },
            t + i * 0.012);
        });
      });

      // ---------- Scene 1 (0.0-1.95): the automation drawn on the sticky note, then it breaks ----------
      draw(".f02-l1", 0.08, 0.34, "power2.out");
      draw(".f02-a1", 0.38, 0.1, "power2.out");
      draw(".f02-l2", 0.34, 0.36, "power2.out");
      draw(".f02-a2", 0.66, 0.1, "power2.out");
      draw(".f02-l3", 0.61, 0.34, "power2.out");
      draw(".f02-a3", 0.91, 0.1, "power2.out");

      // 1.54 « planté »: the pen scribble crosses out Make, the note tears in two
      draw(".f02-scr", 1.54, 0.26, "none");
      var TEAR = 1.6;
      tl.set(qa(".f02-tearedge, .f02-tearshade"), { opacity: 1 }, TEAR);
      tl.fromTo(q("f02-half-l"), { x: 0, y: 0, rotation: 0 }, { x: -14, y: 3, rotation: -2.4, duration: 0.42, ease: "power3.out", immediateRender: false }, TEAR);
      tl.fromTo(q("f02-half-r"), { x: 0, y: 0, rotation: 0 }, { x: 16, y: -2, rotation: 2.0, duration: 0.42, ease: "power3.out", immediateRender: false }, TEAR);

      // ---------- Scene 2 (1.95-2.90): SUR DEVIS slams onto the torn note ----------
      var IMPACT = stampSlam(tl, q("f02-stamp-slam"), 2.04, q("f02-shake"));
      tl.fromTo(q("f02-ripple1"), { scale: 0.12, opacity: 0.9 }, { scale: 1, opacity: 0, duration: 0.62, ease: "power2.out", immediateRender: false }, IMPACT);
      tl.fromTo(q("f02-ripple2"), { scale: 0.12, opacity: 0.7 }, { scale: 0.8, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, IMPACT + 0.12);

      // ---------- Scene 3 (2.90-5.20): pan to the phone and the calendar ----------
      // phone: the question lands (3.20), the thread scrolls, then the reply that never comes
      var thread = q("f02-thread");
      gsap.set(thread, { y: 162 });
      tl.fromTo(thread, { y: 162 }, { y: 54, duration: 0.34, ease: "power3.out", immediateRender: false }, 3.2);
      tl.fromTo(q("f02-ask"), { opacity: 0, scale: 0.86, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, 3.2);
      tl.fromTo(q("f02-phonewarm"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false }, 3.2);
      tl.fromTo(q("f02-ticks"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false }, 3.44);
      tl.fromTo(thread, { y: 54 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.62);
      tl.fromTo(q("f02-typing"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, 3.62);

      // tear-off calendar: J+1 -> J+3 (4.30) -> J+8 (4.66)
      function tearSheet(wrap, sheet, fringe, T, fx, fy, rot) {
        tl.set(sheet, { clipPath: "polygon(0px 31px, 13px 34px, 27px 30px, 40px 33px, 54px 31px, 67px 34px, 81px 30px, 94px 33px, 108px 31px, 121px 34px, 135px 30px, 148px 33px, 162px 31px, 175px 34px, 189px 30px, 202px 33px, 216px 31px, 229px 34px, 243px 30px, 256px 33px, 270px 31px, 284px 34px, 297px 30px, 311px 33px, 324px 31px, 338px 34px, 350px 30px, 362px 33px, 376px 31px, 376px 418px, 0px 418px)" }, T - 0.2);
        tl.set(fringe, { opacity: 1 }, T - 0.2);
        tl.set(wrap, { zIndex: 5 }, T - 0.2);
        tl.fromTo(wrap,
          { x: 0, y: 0, rotation: 0, scale: 1, filter: "drop-shadow(0px 1px 1px rgba(0,0,0,0.18))" },
          { x: 4, y: -8, rotation: rot * 0.06, scale: 1.02, filter: "drop-shadow(10px 16px 14px rgba(0,0,0,0.34))", duration: 0.08, ease: "power2.out", immediateRender: false },
          T - 0.2);
        tl.fromTo(wrap,
          { x: 4, y: -8, rotation: rot * 0.06, scale: 1.02, filter: "drop-shadow(10px 16px 14px rgba(0,0,0,0.34))" },
          { x: fx, y: fy, rotation: rot, scale: 1.14, filter: "drop-shadow(46px 64px 34px rgba(0,0,0,0.4))", duration: 0.26, ease: "power3.in", immediateRender: false },
          T - 0.12);
      }
      tearSheet(q("f02-sw1"), q("f02-sh1"), q("f02-fringe1"), 4.3, 430, -900, 18);
      tearSheet(q("f02-sw2"), q("f02-sh2"), q("f02-fringe2"), 4.66, 560, -840, 26);

      // ---------- virtual camera + clock-driven details (pure functions of t) ----------
      var world = q("f02-world");
      var hud = q("f02-hud");
      var mb = q("f02-mb");
      var blurNode = q("f02-mblur-g");
      var dots = qa(".f02-dot");
      var E_SINE = gsap.parseEase("sine.inOut");
      var E_PAN = gsap.parseEase("power2.inOut");
      var PAN_T0 = 2.9, PAN_DUR = 0.5, PAN_T1 = PAN_T0 + PAN_DUR;
      var A0 = { cx: 900, cy: 528, s: 1.0 }, A1 = { cx: 850, cy: 505, s: 1.07 };
      var B0 = { cx: 2540, cy: 470, s: 1.04 }, B1 = { cx: 2610, cy: 470, s: 1.08 };
      var HUD_D = 1775;
      function lerp(a, b, k) { return a + (b - a) * k; }
      function cam(t) {
        var k, a, b, hx = 0;
        if (t < PAN_T0) { k = E_SINE(clamp01(t / PAN_T0)); a = A0; b = A1; }
        else if (t < PAN_T1) { k = E_PAN(clamp01((t - PAN_T0) / PAN_DUR)); a = A1; b = B0; hx = -HUD_D * k; }
        else { k = E_SINE(clamp01((t - PAN_T1) / (TOTAL - PAN_T1))); a = B0; b = B1; hx = -HUD_D; }
        return { cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), s: lerp(a.s, b.s, k), hx: hx };
      }
      function render(t) {
        var c = cam(t);
        var tx = 960 - c.s * c.cx, ty = 540 - c.s * c.cy;
        world.style.transform = "translate(" + tx.toFixed(2) + "px, " + ty.toFixed(2) + "px) scale(" + c.s.toFixed(5) + ")";
        hud.style.transform = "translate(" + c.hx.toFixed(2) + "px, 0px)";
        // horizontal motion blur from the camera's screen speed
        var dt = 1 / 120;
        var c0 = cam(Math.max(0, t - dt)), c1 = cam(Math.min(TOTAL, t + dt));
        var v = Math.abs(c1.s * c1.cx - c0.s * c0.cx) / (2 * dt);
        var sd = Math.min(16, (v / 30) * 0.07);
        if (sd > 0.4) {
          blurNode.setAttribute("stdDeviation", sd.toFixed(2) + " 0");
          mb.style.filter = "url(#f02-mblur)";
        } else {
          blurNode.setAttribute("stdDeviation", "0 0");
          mb.style.filter = "none";
        }
        // waiting dots: finite pulses inside the frame window
        var DOT_T0 = 3.74, CYCLE = 0.84;
        dots.forEach(function (d, i) {
          var w = 0;
          var u = t - DOT_T0 - i * 0.15;
          if (u > 0) {
            var ph = (u % CYCLE) / CYCLE;
            w = ph < 0.4 ? Math.sin((ph / 0.4) * Math.PI) : 0;
          }
          d.style.opacity = (0.35 + 0.6 * w).toFixed(3);
          d.style.transform = "translate(0px, " + (-4 * w).toFixed(2) + "px)";
        });
      }
      var clock = { t: 0 };
      render(0);
      tl.fromTo(clock, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
