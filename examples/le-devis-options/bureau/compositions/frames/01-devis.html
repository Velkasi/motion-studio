        <span class="f01-w" id="f01-n1">Une</span>
        <span class="f01-w" id="f01-n2">nouvelle</span>
        <span class="f01-w" id="f01-n3">page&nbsp;:</span>
        <span class="f01-pill" id="f01-pill2"><span class="f01-pillbg" id="f01-pill2bg"></span><span class="f01-pilltx f01-split">600&nbsp;€</span></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById("f01-" + id);
      };
      var NB = " ";

      // ---------- baked layout (measured once in headless Chrome with the shipped fonts) ----------
      var DX0 = 0; // row shift that centres "Une" alone
      var DX1 = 0; // row shift that centres "Une modification"
      var DX3 = 0; // row shift that centres "Une nouvelle page :" before the pill
      var BIG_W = 190; // width of "1 000 €" at 64px in the big price box

      // ---------- helpers ----------
      // split a text node into per-character spans (deterministic, build time)
      var split = function (el, cls) {
        var txt = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.className = cls;
          s.textContent = txt[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      };
      // money readout rounded to the ten, "1 000" with a no-break space
      var fmt = function (v) {
        var r = Math.round(v / 10) * 10;
        if (r >= 1000) return Math.floor(r / 1000) + NB + ("00" + (r % 1000)).slice(-3);
        return String(r);
      };
      // seek-safe counter proxy: GSAP writes proxy.v on every render, the setter only rewrites text
      var counter = function (el, start) {
        var p = { _v: start };
        Object.defineProperty(p, "v", {
          get: function () {
            return this._v;
          },
          set: function (x) {
            this._v = x;
            el.textContent = fmt(x);
          },
        });
        return p;
      };

      var tl = gsap.timeline({ paused: true });

      // word by word on the voice timestamp
      var word = function (el, at) {
        tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at);
      };
      // traced accent pill: the fill traces from the left, then the letters write inside
      var pill = function (id, at) {
        var bg = $(id + "bg");
        tl.set(bg, { opacity: 1, immediateRender: false }, at);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, at);
        var chars = document.querySelectorAll("#f01-" + id + " .f01-ch");
        for (var i = 0; i < chars.length; i++) {
          tl.fromTo(chars[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, at + 0.16 + i * 0.02);
        }
      };
      // printed row types itself, one character at a time (discrete)
      var type = function (chars, at, step) {
        for (var i = 0; i < chars.length; i++) {
          tl.set(chars[i], { opacity: 1, immediateRender: false }, at + i * step);
        }
      };

      var splits = document.querySelectorAll("#f01-root-none, .f01-split");
      for (var s = 0; s < splits.length; s++) split(splits[s], "f01-ch");
      var r1label = split($("r1label"), "f01-tch");
      var r1qty = split($("r1qty"), "f01-tch");
      var r2label = split($("r2label"), "f01-tch");
      var r2price = split($("r2price"), "f01-tch");

      // ---------- world geometry (paper px -> world px) ----------
      var PROP = 0.68,
        PLACE_X = 667,
        PLACE_Y = 73.4,
        SW = 700,
        SH = 990,
        SHEET_ROT = -2;
      var paperToWorld = function (px, py) {
        var a = (SHEET_ROT * Math.PI) / 180;
        var dx = px - SW / 2,
          dy = py - SH / 2;
        var rx = SW / 2 + dx * Math.cos(a) - dy * Math.sin(a);
        var ry = SH / 2 + dx * Math.sin(a) + dy * Math.cos(a);
        return [PLACE_X + PROP * rx, PLACE_Y + PROP * ry];
      };
      var C = [960, 540];
      // coordinate-target-zoom (nested wrappers): T = -(target - centre), whatever the scale / roll
      var PRICE = [646 - BIG_W / 2, 245];
      var P = paperToWorld(PRICE[0], PRICE[1]);
      var T3 = [C[0] - P[0], C[1] - P[1]];
      var S3A = 260 / (64 * PROP); // 64px paper price -> 260px on screen (giant)
      var S3B = S3A * 1.045;
      var R3 = -SHEET_ROT; // camera rolls so the circled price reads level
      // Scene 4: whole sheet, sheet centre lands at Q, camera rolled R4
      var SC = paperToWorld(SW / 2, SH / 2);
      var S4 = 0.97,
        R4 = -1.6,
        Q = [900, 382];
      var a4 = (-R4 * Math.PI) / 180,
        qx = (Q[0] - C[0]) / S4,
        qy = (Q[1] - C[1]) / S4;
      var T4 = [C[0] - SC[0] + qx * Math.cos(a4) - qy * Math.sin(a4), C[1] - SC[1] + qx * Math.sin(a4) + qy * Math.cos(a4)];
      var CAM_OUT = [$("deskcam"), $("cam")];
      var CAM_IN = [$("deskcamin"), $("camin")];

      // ---------- hand-drawn loop around the big price (paper px) ----------
      var loop = [];
      (function () {
        var N = 180,
          cx = PRICE[0] + 2,
          cy = PRICE[1] + 2,
          RX = BIG_W / 2 + 40,
          RY = 56,
          th0 = (25 * Math.PI) / 180,
          sweep = (386 * Math.PI) / 180,
          tilt = (-4 * Math.PI) / 180;
        for (var k = 0; k <= N; k++) {
          var u = k / N;
          var th = th0 - u * sweep; // decreasing angle = counter-clockwise on screen
          var w = 1 + 0.03 * Math.sin(u * 2 * Math.PI * 2.3 + 0.6) + 0.015 * Math.sin(u * 2 * Math.PI * 5.1 + 1.3);
          var g = 0.96 + 0.08 * u;
          var ex = RX * w * g * Math.cos(th);
          var ey = RY * w * g * (1 + 0.05 * Math.sin(u * Math.PI)) * Math.sin(th);
          loop.push([cx + ex * Math.cos(tilt) - ey * Math.sin(tilt) + 6 * u, cy + ex * Math.sin(tilt) + ey * Math.cos(tilt) - 4 * u]);
        }
      })();
      var cum = [0];
      for (var k = 1; k < loop.length; k++) cum.push(cum[k - 1] + Math.hypot(loop[k][0] - loop[k - 1][0], loop[k][1] - loop[k - 1][1]));
      var LOOP_L = cum[cum.length - 1];
      var d = "M" + loop[0][0].toFixed(2) + " " + loop[0][1].toFixed(2);
      for (k = 1; k < loop.length; k++) d += " L" + loop[k][0].toFixed(2) + " " + loop[k][1].toFixed(2);
      var inkPath = $("inkpath");
      inkPath.setAttribute("d", d);
      inkPath.setAttribute("stroke-dasharray", LOOP_L.toFixed(2) + " " + (LOOP_L + 20).toFixed(2));
      var pointAt = function (s) {
        var lo = 0,
          hi = cum.length - 1;
        while (hi - lo > 1) {
          var mid = (lo + hi) >> 1;
          if (cum[mid] <= s) lo = mid;
          else hi = mid;
        }
        var seg = cum[hi] - cum[lo] || 1,
          f = Math.min(1, Math.max(0, (s - cum[lo]) / seg));
        return [loop[lo][0] + (loop[hi][0] - loop[lo][0]) * f, loop[lo][1] + (loop[hi][1] - loop[lo][1]) * f];
      };
      // stroke proxy: the setter writes the dash offset AND the pen tip position (always in sync, seek-safe)
      var trace = $("pentrace");
      var stroke = { _p: 0 };
      Object.defineProperty(stroke, "p", {
        get: function () {
          return this._p;
        },
        set: function (v) {
          this._p = v;
          inkPath.setAttribute("stroke-dashoffset", (LOOP_L * (1 - v)).toFixed(2));
          var q = pointAt(LOOP_L * v);
          trace.style.transform = "translate(" + q[0].toFixed(2) + "px," + q[1].toFixed(2) + "px)";
        },
      });
      stroke.p = 0;
      var LOOP_END = loop[loop.length - 1];
      var PEN_REST = [748, 150]; // tip position on the desk, right of the sheet (paper px)

      // ---------- build-time states ----------
      gsap.set($("ph1row"), { x: DX0, y: -285 }); // "Une" alone, dead centre (960, 540)
      gsap.set($("ph3row"), { x: DX3 });
      gsap.set($("sheet"), { x: 60, y: -1250, rotation: -6 });
      gsap.set($("bigtext"), { transformOrigin: 250 - BIG_W / 2 + "px 35px" });
      gsap.set($("penrot"), { rotation: 30 });

      // ---------- camera (desk + world, same tweens) ----------
      tl.fromTo(CAM_OUT, { scale: 1, rotation: 0 }, { scale: 1.025, rotation: 0, duration: 1.6, ease: "none" }, 0);
      tl.fromTo(CAM_OUT, { scale: 1.025, rotation: 0 }, { scale: S3A, rotation: R3, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 1.6);
      tl.fromTo(CAM_IN, { x: 0, y: 0 }, { x: T3[0], y: T3[1], duration: 0.8, ease: "power2.inOut" }, 1.6);
      tl.fromTo(CAM_OUT, { scale: S3A }, { scale: S3B, duration: 0.92, ease: "none", immediateRender: false }, 2.4);
      tl.fromTo(CAM_OUT, { scale: S3B, rotation: R3 }, { scale: S4, rotation: R4, duration: 0.66, ease: "expo.out", immediateRender: false }, 3.32);
      tl.fromTo(CAM_IN, { x: T3[0], y: T3[1] }, { x: T4[0], y: T4[1], duration: 0.66, ease: "expo.out", immediateRender: false }, 3.32);
      tl.fromTo(CAM_OUT, { scale: S4 }, { scale: S4 * 1.018, duration: 1.76, ease: "none", immediateRender: false }, 3.98);

      // ---------- SCENE 1 (0.00-0.75): "Une" alone, then [modification] ----------
      tl.fromTo($("w1"), { scale: 0.96 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      pill("pill1", 0.22); // modification@0.24
      tl.fromTo($("ph1row"), { x: DX0 }, { x: DX1, duration: 0.36, ease: "power3.out", immediateRender: false }, 0.22);

      // ---------- SCENE 2 (0.60-1.70): phrase to the bottom band, the sheet lands, row 1 types ----------
      tl.fromTo($("ph1row"), { x: DX1, y: -285 }, { x: 0, y: 0, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 0.6);
      word($("w3"), 0.78); // sur
      word($("w4"), 1.04); // ton
      word($("w5"), 1.18); // site
      word($("w6"), 1.52); // ?
      tl.fromTo($("sheet"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.62);
      tl.fromTo($("sheet"), { x: 60, y: -1250 }, { x: 0, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 0.62);
      tl.fromTo($("sheet"), { rotation: -6 }, { rotation: SHEET_ROT, duration: 0.85, ease: "power3.out", immediateRender: false }, 0.62);
      tl.fromTo($("sheetshadow"), { x: 30, y: 44, opacity: 0.6 }, { x: 0, y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.62);
      type(r1label, 1.18, 0.021); // site@1.18
      type(r1qty, 1.7, 0.03);

      // ---------- SCENE 3 (1.70-3.45): push-in on the price, "Une journée.", 1 000 € counts, pen circles it ----------
      // zoom-through (forward): phrase 1 accelerates toward the viewer, hard cut, phrase 2 grows in
      tl.fromTo($("ph1fx"), { scale: 1, filter: "blur(0px)" }, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 1.64);
      tl.fromTo($("ph1fx"), { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "none", immediateRender: false }, 1.64);
      tl.set($("ph1fx"), { opacity: 0, immediateRender: false }, 1.84);
      tl.fromTo($("ph2fx"), { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 1.84);
      word($("j1"), 1.84); // Une
      word($("j2"), 2.02); // journée.
      // counting-dynamic-scale: value + scale share timing and ease, mille-euros@2.72
      var bigC = counter($("bignum"), 0);
      tl.fromTo($("bigtext"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 2.72);
      tl.fromTo($("bigtext"), { scale: 0.55 }, { scale: 1, duration: 0.55, ease: "power3.out" }, 2.72);
      tl.fromTo(bigC, { v: 0 }, { v: 1000, duration: 0.55, ease: "power3.out" }, 2.72);
      tl.fromTo($("bigeuro"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 3.08);
      // pen: swoops in, circles the price (tip + stroke in sync), then is set down on the desk
      tl.fromTo($("pen"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.8);
      tl.fromTo($("pen"), { x: 300, y: 380 }, { x: 0, y: 0, duration: 0.2, ease: "power3.out" }, 2.8);
      tl.fromTo($("penrot"), { rotation: 30 }, { rotation: 34, duration: 0.2, ease: "power2.out" }, 2.8);
      tl.set($("ink"), { opacity: 1, immediateRender: false }, 3.0);
      tl.fromTo(stroke, { p: 0 }, { p: 1, duration: 0.32, ease: "power1.inOut", immediateRender: false }, 3.0);
      tl.fromTo($("penrot"), { rotation: 34 }, { rotation: 40, duration: 0.32, ease: "none", immediateRender: false }, 3.0);
      tl.fromTo($("pen"), { x: 0, y: 0 }, { x: PEN_REST[0] - LOOP_END[0], y: PEN_REST[1] - LOOP_END[1], duration: 0.8, ease: "power2.inOut", immediateRender: false }, 3.34);
      tl.fromTo($("penrot"), { rotation: 40 }, { rotation: 68, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 3.34);

      // ---------- SCENE 4 (3.45-5.74): pull back to the whole tilted sheet, row 2 + total 1 000 -> 1 600 ----------
      // inverse zoom-through: phrase 2 recedes, hard cut, phrase 3 arrives oversized
      tl.fromTo($("ph2fx"), { scale: 1, filter: "blur(0px)" }, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 3.34);
      tl.fromTo($("ph2fx"), { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "none", immediateRender: false }, 3.34);
      tl.set($("ph2fx"), { opacity: 0, immediateRender: false }, 3.54);
      tl.fromTo($("ph3fx"), { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 3.54);
      word($("n1"), 3.58); // Une
      word($("n2"), 3.74); // nouvelle
      word($("n3"), 3.98); // page :
      tl.fromTo($("totval"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.62);
      tl.fromTo($("ph3row"), { x: DX3 }, { x: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, 4.66);
      pill("pill2", 4.72); // six-cents-euros@4.74
      type(r2label, 4.74, 0.024);
      type(r2price, 5.02, 0.03);
      var totC = counter($("totnum"), 1000);
      tl.fromTo(totC, { v: 1000 }, { v: 1600, duration: 0.6, ease: "power3.out", immediateRender: false }, 4.8);
      // hold: camera drift runs to 5.74

      window.__timelines = window.__timelines || {};
      window.__timelines["01-devis"] = tl;
    })();
  </script>
</template>
