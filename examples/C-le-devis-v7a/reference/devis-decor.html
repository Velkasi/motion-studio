<body>

<script>
/* ===================== kit caméra v7a (à copier) ===================== */
var DV_P = 2300;                               // perspective de .dv-stage, origine au centre du cadre
function dvMatrix(c) {                         // c = { x, y, s, rx, rz } : le point (x, y) de la feuille est au centre du cadre
  return new DOMMatrix().translate(960, 540).rotateAxisAngle(0, 0, 1, c.rz).rotateAxisAngle(1, 0, 0, c.rx).scale(c.s, c.s, 1).translate(-c.x, -c.y);
}
function dvProject(c, u, v) {                  // point de la feuille (u, v) vers l'écran ; k = échelle apparente en ce point
  var p = dvMatrix(c).transformPoint(new DOMPoint(u, v, 0, 1));
  var k = DV_P / (DV_P - p.z);
  return { x: 960 + (p.x - 960) * k, y: 540 + (p.y - 540) * k, k: k * c.s };
}
function dvApplyCam(rig, blurEl, c) {          // unique écrivain de la caméra (appelé par onUpdate)
  rig.style.transformOrigin = c.x + "px " + c.y + "px";
  rig.style.transform = "translate(" + (960 - c.x) + "px," + (540 - c.y) + "px) rotateZ(" + c.rz + "deg) rotateX(" + c.rx + "deg) scale(" + c.s + ")";
  blurEl.style.filter = c.blur > 0.05 ? "blur(" + c.blur.toFixed(2) + "px)" : "none";
}
function dvApplyDof(layers, d) {               // d = { f, b1, b2 } : ligne nette f (u), flou des couches moyenne et lointaine (px)
  var mid = "linear-gradient(to bottom, transparent " + (d.f - 420) + "px, #000 " + (d.f - 250) + "px, #000 " + (d.f + 250) + "px, transparent " + (d.f + 420) + "px)";
  var sh = "linear-gradient(to bottom, transparent " + (d.f - 160) + "px, #000 " + (d.f - 85) + "px, #000 " + (d.f + 85) + "px, transparent " + (d.f + 160) + "px)";
  layers[0].style.filter = d.b2 > 0.05 ? "blur(" + d.b2.toFixed(2) + "px)" : "none";
  layers[1].style.filter = d.b1 > 0.05 ? "blur(" + d.b1.toFixed(2) + "px)" : "none";
  layers[1].style.webkitMaskImage = mid; layers[1].style.maskImage = mid;
  layers[2].style.webkitMaskImage = sh; layers[2].style.maskImage = sh;
}
function dvBillboard(el, c, u, v, base, ax, ay) {   // objet debout ancré au point (u, v) ; (ax, ay) = point d'ancrage dans l'objet (px)
  var p = dvProject(c, u, v), sc = base * p.k;
  el.style.transformOrigin = "0 0";
  el.style.transform = "translate(" + (p.x - ax * sc).toFixed(2) + "px," + (p.y - ay * sc).toFixed(2) + "px) scale(" + sc.toFixed(4) + ")";
}
function dvBuild(rig, day) {                   // trois copies identiques de la feuille : lointaine, moyenne, nette
  var tpl = document.getElementById("dv-sheet"), layers = [];
  for (var i = 0; i < 3; i++) {
    var L = document.createElement("div"); L.className = "dv-layer";
    L.appendChild(tpl.content.cloneNode(true));
    if (day) L.querySelector(".dv").classList.add("day");
    rig.appendChild(L); layers.push(L);
  }
  return layers;
}
/* ===================== fin du kit caméra ===================== */

// démo : poser un état du devis et une caméra
var LAYERS = dvBuild(document.getElementById("rig"), false);
function setAll(sel, prop, val) { document.querySelectorAll(sel).forEach(function (e) { e.style[prop] = val; }); }
window.demo = function (o) {
  var day = !!o.day;
  document.querySelectorAll(".dv").forEach(function (d) { d.classList.toggle("day", day); });
  document.getElementById("gd").style.display = day ? "none" : "block";
  document.getElementById("gl").style.display = day ? "block" : "none";
  ["l1", "l2", "l3"].forEach(function (i) { document.getElementById(i).style.display = day ? "none" : "block"; });
  document.getElementById("l4").style.display = day ? "block" : "none";
  document.getElementById("gr").className = day ? "grain day" : "grain";
  var st = o.state || {};
  setAll(".dv-price1", "opacity", st.p1 ? 1 : 0); setAll(".dv-price2", "opacity", st.p2 ? 1 : 0);
  setAll(".dv-stamp", "opacity", st.stamp ? .94 : 0); setAll(".dv-price4", "opacity", st.late ? 1 : 0); setAll(".dv-now4", "opacity", st.now ? 1 : 0);
  setAll(".dv-portal", "opacity", st.portal ? 1 : 0); setAll(".dv-site", "opacity", st.portal ? 0 : 1);
  [1, 2, 3].forEach(function (n) {
    var on = (st.struck || 0) >= n;
    setAll(".dv-r" + n + " .dv-strike", "transform", on ? "scaleX(1)" : "scaleX(0)");
    setAll(".dv-r" + n + " .dv-t, .dv-r" + n + " .dv-sub, .dv-r" + n + " .dv-q", "opacity", on ? .42 : 1);
    setAll(".dv-toi" + n, "opacity", on ? 1 : 0);
  });
  setAll(".dv-r5-frame, .dv-r5 .dv-n", "opacity", st.r5 ? 1 : 0);
  setAll(".dv-w5, .dv-pin, .dv-sub5", "opacity", st.r5full ? 1 : 0);
  setAll(".dv-zero", "opacity", st.zero ? 1 : 0);
  if (st.zero) { setAll(".dv-case-v", "color", "transparent"); } else { setAll(".dv-case-v", "color", "#1a1612"); }
  var c = o.cam; c.blur = c.blur || 0;
  dvApplyCam(document.getElementById("rig"), document.getElementById("blur"), c);
