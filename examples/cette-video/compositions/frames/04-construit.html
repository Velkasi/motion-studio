      function paint(t) {
        var n = 0;
        while (n < N && keyTimes[n] <= t + 1e-6) n++;
        if (n !== shown) {
          shown = n;
          typed.textContent = PROMPT.slice(0, n);
        }
      }
      var typerT = T0;
      var typer = {};
      Object.defineProperty(typer, "t", {
        get: function () {
          return typerT;
        },
        set: function (v) {
          typerT = v;
          paint(v);
        },
        enumerable: true,
        configurable: true,
      });
      paint(-1);
      tl.fromTo(typer, { t: T0 }, { t: T1, duration: T1 - T0, ease: "none", immediateRender: false }, T0);

      /* cursor-click-ripple on the send button: move 2.00-2.46, click 2.55 */
      var MOVE_AT = 2.0;
      var MOVE_DUR = 0.46;
      var CLICK_AT = 2.55;
      var PRESS = 0.07;
      var RELEASE = 0.09;
      var RIPPLE_AT = CLICK_AT + 0.01;
      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, MOVE_AT);
      tl.fromTo(
        cursor,
        { x: 240, y: 180 },
        { x: 0, y: 0, duration: MOVE_DUR, ease: "power3.out", immediateRender: false },
        MOVE_AT,
      );
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.85, duration: PRESS, ease: "power2.in", immediateRender: false }, CLICK_AT);
      tl.fromTo(
        cursor,
        { scale: 0.85 },
        { scale: 1, duration: RELEASE, ease: "power2.out", immediateRender: false },
        CLICK_AT + PRESS,
      );
      tl.fromTo(send, { scale: 1 }, { scale: 0.94, duration: PRESS, ease: "power2.in", immediateRender: false }, CLICK_AT);
      tl.fromTo(
        send,
        { scale: 0.94 },
        { scale: 1, duration: RELEASE, ease: "power2.out", immediateRender: false },
        CLICK_AT + PRESS,
      );
      tl.fromTo(ripple, { scale: 0.8 }, { scale: 3.4, duration: 0.6, ease: "power2.out", immediateRender: false }, RIPPLE_AT);
      tl.fromTo(ripple, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, RIPPLE_AT);
      tl.fromTo(
        ripple,
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false },
        RIPPLE_AT + 0.04,
      );
      off(caret, CLICK_AT + 0.01); /* sent */

      /* Scene seam (cut catalog: cut-the-curve, upward). The input rips up on power4.in,
         its fade dies at the cut (2.92); the editor picks up the same upward path on power4.out. */
      var CUT_UI = 2.92;
      tl.fromTo(ask, { y: 0 }, { y: -160, duration: 0.3, ease: "power4.in", immediateRender: false }, CUT_UI - 0.28);
      tl.fromTo(ask, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, CUT_UI - 0.2);
      tl.fromTo(ed, { opacity: 0.35 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, CUT_UI);
      tl.fromTo(ed, { y: 160 }, { y: 0, duration: 0.36, ease: "power4.out", immediateRender: false }, CUT_UI);

      /* Phrase seam: phrase 1 leaves upward word by word (same direction as the input),
         the last fade dies at 3.03; phrase 2 rises on its own cues. */
      var CUT_TXT = 3.03;
      var EX_MOVE = 0.3;
      var EX_FADE = 0.18;
      var EX_LAG = 0.07;
      var EX_STAG = 0.022;
      var exitUnits = [el("a1"), el("a2"), el("a3"), el("a4"), el("a5"), el("a6"), el("a7"), el("pill1")];
      var lastExit = CUT_TXT - EX_FADE - EX_LAG;
      exitUnits.forEach(function (unit, idx) {
        var st = lastExit - (exitUnits.length - 1 - idx) * EX_STAG;
        tl.fromTo(unit, { y: 0 }, { y: -56, duration: EX_MOVE, ease: "power4.in", immediateRender: false }, st);
        tl.fromTo(
          unit,
          { opacity: 1 },
          { opacity: 0, duration: EX_FADE, ease: "power1.in", immediateRender: false },
          st + EX_LAG,
        );
      });

      wordIn(el("b1"), 3.05); /* Et 3.07 */
      wordIn(el("b2"), 3.18); /* elle 3.20 */
      wordIn(el("b3"), 3.33); /* a 3.35 */
      pillIn(el("pill2"), el("pill2-bg"), pill2Ch, 3.44); /* tout construit 3.47 */

      /* Scene 2: waterfall-entry, eleven blocks drop into IMAGE left to right, 2.95 -> 3.90.
         Binary opacity, power4.out whip, gaps shrink (x0.9) so the wave accelerates. */
      var blocks = ed.querySelectorAll(".f04-blk");
      var bt = 2.95;
      var gap = 0.1244;
      for (var b = 0; b < blocks.length; b++) {
        var dur = b === 0 ? 0.2 : Math.max(0.13, 0.16 - 0.003 * b);
        var dy = b === 0 ? -72 : b < 8 ? -50 : -42;
        on(blocks[b], bt);
        tl.fromTo(blocks[b], { y: dy }, { y: 0, duration: dur, ease: "power4.out", immediateRender: false }, bt);
        bt += gap;
        gap *= 0.9;
      }

      /* VOIX waveform and MUSIQUE bar draw in at 3.60 */
      tl.fromTo(
        bars,
        { opacity: 0, scaleY: 0.15 },
        { opacity: 1, scaleY: 1, duration: 0.22, ease: "power3.out", stagger: 0.0022, immediateRender: false },
        3.6,
      );
      on(musMask, 3.62);
      tl.fromTo(musMask, { xPercent: -100 }, { xPercent: 0, duration: 0.62, ease: "power2.out", immediateRender: false }, 3.62);
      tl.fromTo(mus, { xPercent: 100 }, { xPercent: 0, duration: 0.62, ease: "power2.out", immediateRender: false }, 3.62);

      /* playhead: appears with the tracks, runs from 3.75 to the end (hold otherwise) */
      tl.fromTo(ph, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, 3.6);
      tl.fromTo(ph, { x: 0 }, { x: 560, duration: DURATION - 3.75, ease: "none", immediateRender: false }, 3.75);

      /* pin the timeline length to the frame duration (no exit: the root transition is the exit) */
      tl.set({}, {}, DURATION);

      window.__timelines["04-construit"] = tl;
    })();
  </script>
