        ft(unit, { x: 0 }, { x: -230, duration: EX_MOVE, ease: "power4.in" }, st);
        ft(unit, { opacity: 1 }, { opacity: 0, duration: EX_FADE, ease: "power1.in" }, st + EX_LAG);
