<template>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      src: url("assets/fonts/InstrumentSans-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Instrument Sans";
      src: url("assets/fonts/InstrumentSans-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Instrument Sans", sans-serif;
      color: #1a1612;
    }

    /* ---------- ground-light (track 0, full duration) ---------- */
    #f08-ground {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      background: #f6f1e9;
      overflow: hidden;
    }
    #f08-ground-warm {
      position: absolute;
      left: 260px;
      top: 30px;
      width: 1400px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(194, 91, 40, 0.09), rgba(194, 91, 40, 0.04) 55%, rgba(194, 91, 40, 0));
    }

    /* ---------- scene (track 1, full duration) ---------- */
    #f08-scene {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }

    /* small phrase above center, word by word */
    #f08-phrase {
      position: absolute;
      left: 0;
      top: 250px;
      width: 1920px;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 14px;
      font-family: "Instrument Sans", sans-serif;
      font-weight: 600;
      font-size: 54px;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #1a1612;
      white-space: nowrap;
    }
    .f08-w {
      display: inline-block;
      opacity: 0;
    }

    /* giant word, centered; letters split into inline-blocks for the tracking tighten */
    #f08-giant-wrap {
      position: absolute;
      left: 0;
      top: 343px;
      width: 1920px;
      height: 234px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    #f08-giant {
      display: block;
      flex: 0 0 auto;
      padding-right: 13px; /* compensates the trailing -0.05em so the ink is centered */
      font-family: "Instrument Sans", sans-serif;
      font-weight: 700;
      font-size: 260px;
      line-height: 0.9;
      letter-spacing: -13px; /* -0.05em, static: never tweened */
      white-space: nowrap;
      color: #1a1612;
      opacity: 0;
    }

    /* hand-drawn accent underline */
    #f08-underline-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
    }
    #f08-underline {
      fill: none;
      stroke: #c25b28;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- grain (track 2, full duration) ---------- */
    #f08-grain {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23g)'/></svg>");
      background-size: 220px 220px;
    }
  </style>

  <div id="root" data-composition-id="08-apprend" data-width="1920" data-height="1080" data-duration="2.75">
    <div id="f08-ground" class="clip" data-start="0" data-duration="2.75" data-track-index="0">
      <div id="f08-ground-warm" data-layout-ignore></div>
    </div>

    <div id="f08-scene" class="clip" data-start="0" data-duration="2.75" data-track-index="1">
      <div id="f08-phrase">
        <span id="f08-w0" class="f08-w">Et</span>
        <span id="f08-w1" class="f08-w">ça,</span>
        <span id="f08-w2" class="f08-w">ça</span>
      </div>

      <div id="f08-giant-wrap">
        <div id="f08-giant">s’apprend.</div>
      </div>

      <svg id="f08-underline-svg" data-layout-ignore viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
        <path id="f08-underline" d="M 384 642 C 520 634, 700 650, 900 640 C 1100 630, 1300 646, 1516 630"></path>
      </svg>
    </div>

    <div id="f08-grain" class="clip" data-start="0" data-duration="2.75" data-track-index="2" data-layout-ignore></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      function $(id) {
        return document.getElementById(id);
      }

      var DUR = 2.25;
      // word cues (frame-local): Et@0.16 ça@0.30 ça@0.84 s'apprend@1.07 (voice ends 1.35)
      var T_W = [0.16, 0.3, 0.84];
      var T_GIANT = 1.07;
      var T_LINE = 1.3;
      var LINE_DUR = 0.45;

      var tl = gsap.timeline({ paused: true });

      /* ---------- small phrase, word by word on the voice ---------- */
      for (var w = 0; w < T_W.length; w++) {
        tl.fromTo(
          $("f08-w" + w),
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          T_W[w],
        );
      }

      /* ---------- giant word: tracking tighten via per-letter x transforms ---------- */
      var trackChars = function (root) {
        var t = root.textContent;
        root.textContent = "";
        var out = [];
        for (var i = 0; i < t.length; i++) {
          var s = document.createElement("span");
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          s.textContent = t[i];
          root.appendChild(s);
          out.push(s);
        }
        return out;
      };
      var trackIn = function (chars, spread, dur, ease, at) {
        var n = chars.length;
        chars.forEach(function (c, i) {
          tl.fromTo(c, { x: (i - (n - 1) / 2) * spread }, { x: 0, duration: dur, ease: ease, immediateRender: false }, at);
        });
      };
      // 0.35em -> -0.05em = 0.4em of travel per letter step (0.4 x 260px = 104px)
      tl.fromTo(
        $("f08-giant"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        T_GIANT,
      );
      trackIn(trackChars($("f08-giant")), 104, 0.5, "expo.out", T_GIANT);

      /* ---------- svg-path-draw: the accent underline, left to right, like a pen ---------- */
      var line = $("f08-underline");
      var len = 0;
      try {
        len = line.getTotalLength();
      } catch (e) {
        len = 0;
      }
      if (!len || !isFinite(len)) len = 1140;
      len = Math.ceil(len * 1.02);
      var OFF = len + 20; // start fully out, past the round-cap radius, so no dot shows at the start point
      line.setAttribute("stroke-dasharray", len + " " + (len + 40));
      line.setAttribute("stroke-dashoffset", String(OFF));
      tl.set($("f08-underline-svg"), { opacity: 1 }, T_LINE);
      tl.fromTo(
        line,
        { attr: { "stroke-dashoffset": OFF } },
        { attr: { "stroke-dashoffset": 0 }, duration: LINE_DUR, ease: "power2.out", immediateRender: false },
        T_LINE,
      );

      /* ---------- hold to the end (allocated stillness) ---------- */
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-apprend"] = tl;
    })();
  </script>
</template>
