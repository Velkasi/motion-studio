  <div id="root" data-composition-id="01-cette-video" data-width="1920" data-height="1080" data-duration="2.25">
    <!-- full-bleed ground (it IS level 0's ground): canvas + terracotta halo behind the player -->
    <div id="f01-bg" class="clip f01-groundlook" data-start="0" data-duration="2.25" data-track-index="0" data-layout-ignore></div>

    <!-- camera: ONE scale tween (Z0 -> 1, expo.out) around the Droste fixed point -->
    <div id="f01-cam" data-layout-allow-overflow>
      <!-- LEVEL block: ground + video-player (its screen holds the next level) + phrase.
           The script clones this block 4 times and nests each copy in the previous screen.
           Classes only inside (no ids), so copies never duplicate an id. -->
      <div id="f01-l0" class="f01-level">
        <div class="f01-lvground f01-groundlook"></div>

        <!-- video-player
             Self-contained block (frame 10 copies it onto the paper world with card-light).
             Card 1100 x 698.75, radius 14: a 16:9 screen 1100 x 618.75 on top + an 80px control bar below.
             Bar (padding 0 24, gap 24): play disc 56px accent with a white SVG triangle,

        <div class="f01-player">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // ---------- Droste geometry (analytic, no DOM measurement) ----------
      // A level is the whole 1920x1080 frame; its player screen (410, 72, 1100 x 618.75) shows the next level
      // at S = 1100 / 1920. The map p -> screenOrigin + S * p has one fixed point P; scaling the camera by 1/S
      // around P maps level n+1 exactly onto level n, so ONE scale tween around P is the whole pull-back.
      var S = 1100 / 1920;
      var SX = 410;
      var SY = 72;
      var PX = SX / (1 - S); // 960
      var PY = SY / (1 - S); // 168.585
      var DEPTH = 5; // level 0 + 4 nested copies; the seed sits in the 4th copy's screen (depth 5)
      var OVER = 1.03; // slight over-zoom: the innermost bezel and control bar stay off-frame at t = 0
      var Z0 = OVER / Math.pow(S, DEPTH); // about 16.69: the innermost screen fills the frame
      var TRACK_W = 808;

      var cam = document.getElementById("f01-cam");
      var lv0 = document.getElementById("f01-l0");
      var seed = document.getElementById("f01-seed");

      // ---------- build: 4 copies of the bare level, nested screen in screen ----------
      var levels = [lv0];
      for (var i = 1; i <= 4; i++) {
        var copy = lv0.cloneNode(true);
        copy.removeAttribute("id");
        levels.push(copy);
      }
      // level 0's ground is the static full-bleed clip #f01-bg
      lv0.removeChild(lv0.querySelector(".f01-lvground"));
      // collect every level's own elements BEFORE nesting (querySelector would otherwise hit a deeper copy first)
      var pick = function (sel) {
        return levels.map(function (l) {
          return l.querySelector(sel);
        });
      };
      var screens = pick(".f01-screen");
      var pills = pick(".f01-pill");
      var pillbgs = pick(".f01-pillbg");
      var wNe = pick(".f01-wne");
      var wLa = pick(".f01-wla");
      var wFaite = pick(".f01-wfaite");
      var played = pick(".f01-played");
      var heads = pick(".f01-head");
      var chars = levels.map(function (l) {
        return l.querySelectorAll(".f01-ch");
      });
      for (var j = 1; j < levels.length; j++) {
        screens[j - 1].appendChild(levels[j]);
      }
      screens[levels.length - 1].appendChild(seed);
      // seed phrase dead centre on screen at t = 0 (compensates the over-zoom around P)
      document.getElementById("f01-seedrow").style.top = (PY + (540 - PY) / OVER - 36).toFixed(2) + "px";

      var tl = gsap.timeline({ paused: true, defaults: { force3D: false } });

      // word-by-word (frame.md): each word on its voice timestamp
      var word = function (el, at) {
        tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at);
      };

      // ---------- build-time states ----------
      gsap.set(pills, { rotation: 0, force3D: false });
      gsap.set(cam, { transformOrigin: PX + "px " + PY + "px", scale: Z0, force3D: false });

      // ---------- SCENE 1 (0.00-0.80): « Cette vidéo, » alone, dead centre, camera static ----------
      tl.fromTo("#f01-seedhalo", { opacity: 0.55 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#f01-cette", { opacity: 0.35, y: 6, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0); // Cette@0.03
      word("#f01-video", 0.26); // vidéo@0.28

      // playhead (every level in sync): 0:01 of 0:44, moves slightly
      tl.fromTo(played, { scaleX: 0.023 }, { scaleX: 0.05, duration: 2.25, ease: "none" }, 0);
      tl.fromTo(heads, { x: 0.023 * TRACK_W }, { x: 0.05 * TRACK_W, duration: 2.25, ease: "none" }, 0);

      // ---------- SCENE 2 (0.80-2.25): ONE decelerating pull-back, then locked ----------
      tl.fromTo(cam, { scale: Z0 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, 0.8);

      // phrase under the player, every level in sync (true Droste: the same image at every depth)
      // [pill: aucune agence] traces first, then its letters write inside (aucune@0.85, agence@1.12)
      var PILL_AT = 0.84;
      tl.set(pillbgs, { opacity: 1, immediateRender: false }, PILL_AT);
      tl.fromTo(pillbgs, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, PILL_AT);
      tl.fromTo(pills, { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, PILL_AT);
      var column = function (n) {
        return chars.map(function (list) {
          return list[n];
        });
      };
      for (var c = 0; c < chars[0].length; c++) {
        tl.fromTo(column(c), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, PILL_AT + 0.18 + c * 0.02);
      }
      word(wNe, 1.38); // ne@1.40
      word(wLa, 1.53); // l’a@1.55
      word(wFaite, 1.73); // faite@1.75
      // hold: camera locked at 1.70, last word lands 2.03, only the playhead keeps moving to 2.25

      window.__timelines = window.__timelines || {};
      window.__timelines["01-cette-video"] = tl;
    })();
  </script>
