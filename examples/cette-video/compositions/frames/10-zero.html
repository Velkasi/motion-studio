  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById(id);
      };
      var DUR = 5.5; // 4.75 + the 0.75 s iris hold owned by the orchestrator
      var TRACK_W = 780;
      var NOW = 34; // film time when this frame plays (0:34 of 0:44)
      var TOTAL = 44;
      var FRAC = NOW / TOTAL;

      var tl = gsap.timeline({ paused: true });

      // word-by-word (frame.md): each word on its voice timestamp
      var word = function (id, at) {
        tl.fromTo($(id), { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, at);
      };

      /* ================= SCENE 1 (0.00-1.75): the jargon, then it falls away ================= */
      // [id, static rotation, fall distance, extra rotation while falling]
      var JAR = [
        ["f10-j-api", -5, 460, -14],
        ["f10-j-cron", 3, 520, 12],
        ["f10-j-dns", 4, 470, 16],
        ["f10-j-webhook", -3, 430, -10],
        ["f10-j-json", 5, 440, 14],
        ["f10-j-ftp", 6, 340, 18],
        ["f10-j-css", -2, 330, -12],
        ["f10-j-ssl", -4, 350, -16],
      ];
      JAR.forEach(function (j, i) {
        gsap.set($(j[0]), { rotation: j[1] });
        // scattered in, quick stagger under the first words
        tl.fromTo(
          $(j[0]),
          { opacity: 0, y: 14, rotation: j[1], filter: "blur(6px)" },
          { opacity: 1, y: 0, rotation: j[1], filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false },
          i * 0.06,
        );
      });
      // from « technique » (0.95) they fall down and away one by one, slight blur (not needed)
      var FALL_ORDER = [0, 4, 1, 6, 3, 7, 2, 5];
      FALL_ORDER.forEach(function (idx, k) {
        var j = JAR[idx];
        var at = 0.95 + k * 0.07;
        tl.fromTo(
          $(j[0]),
          { y: 0, rotation: j[1], filter: "blur(0px)" },
          { y: j[2], rotation: j[1] + j[3], filter: "blur(6px)", duration: 0.48, ease: "power2.in", immediateRender: false },
          at,
        );
        tl.fromTo($(j[0]), { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power1.in", immediateRender: false }, at);
      });

      // phrase, centred, word by word: Et@0.15 pas@0.31 besoin@0.47 d’être@0.70 technique@0.95
      word("f10-w-et", 0.13);
      word("f10-w-pas", 0.29);
      word("f10-w-besoin", 0.45);
      word("f10-w-detre", 0.68);
      word("f10-w-technique", 0.93);

      // cut-the-curve (upward, whole-line variant): the line rips up, fade dies right at the cut (1.80)
      tl.fromTo("#f10-p1", { y: 0 }, { y: -230, duration: 0.34, ease: "power4.in", immediateRender: false }, 1.46);
      tl.fromTo("#f10-p1", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 1.48);

      /* ================= SCENE 2 (1.75-4.75, held to 5.50): the player comes back, rewound to 0:00 ================= */
      // ...and the player rises into the centre, same direction, mirrored ease
      tl.fromTo("#f10-player", { y: 230 }, { y: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 1.8);
      tl.fromTo("#f10-player", { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, 1.8);

      // stat-bars-and-fills (progress fill, reversed): played part shrinks to 0 from the left origin,
      // playhead slides back, timecode rolls down to 0:00 by 3.15 (same start, same ease: one beat)
      var REW_AT = 2.0;
      var REW_DUR = 1.15;
      gsap.set("#f10-played", { scaleX: FRAC, transformOrigin: "0% 50%" });
      gsap.set("#f10-head", { x: FRAC * TRACK_W });
      tl.fromTo("#f10-played", { scaleX: FRAC }, { scaleX: 0, duration: REW_DUR, ease: "power2.inOut", immediateRender: false }, REW_AT);
      tl.fromTo("#f10-head", { x: FRAC * TRACK_W }, { x: 0, duration: REW_DUR, ease: "power2.inOut", immediateRender: false }, REW_AT);

      // seek-safe timecode proxy: GSAP writes proxy.v, the setter writes textContent (no onUpdate callback)
      var timeEl = $("f10-time");
      var fmt = function (s) {
        var n = Math.max(0, Math.round(s));
        var m = Math.floor(n / 60);
        var ss = n % 60;
        return m + ":" + (ss < 10 ? "0" : "") + ss + " / 0:" + TOTAL;
      };
      var proxy = { _v: NOW };
      Object.defineProperty(proxy, "v", {
        get: function () {
          return this._v;
        },
        set: function (x) {
          this._v = x;
          timeEl.textContent = fmt(x);
        },
      });
      proxy.v = NOW;
      tl.fromTo(proxy, { v: NOW }, { v: 0, duration: REW_DUR, ease: "power2.inOut", immediateRender: false }, REW_AT);

      // phrase under the player: c’est@1.91 pensé@2.07 pour@2.33 ceux@2.57 qui@2.69 partent@2.89
      word("f10-w-cest", 1.89);
      word("f10-w-pense", 2.05);
      word("f10-w-pour", 2.31);
      word("f10-w-ceux", 2.55);
      word("f10-w-qui", 2.67);
      word("f10-w-partent", 2.87);

      // [pill: de zéro.] traces first (2 frames before « de »@3.15), then its letters write inside (zéro@3.33)
      var PILL_AT = 3.12;
      gsap.set("#f10-pillbg", { scaleX: 0 });
      gsap.set("#f10-pill", { rotation: -8 });
      tl.set("#f10-pillbg", { opacity: 1, immediateRender: false }, PILL_AT);
      tl.fromTo("#f10-pillbg", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, PILL_AT);
      tl.fromTo("#f10-pill", { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, PILL_AT);
      var letters = function (sel, at) {
        document.querySelectorAll(sel).forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, at + i * 0.02);
        });
      };
      letters("#f10-pill .f10-ch-de", 3.22);
      letters("#f10-pill .f10-ch-zero", 3.32);

      // the play button glows brighter from 3.60 (disc brightens, halo blooms a beat behind), then holds still
      tl.fromTo("#f10-playlit", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.6);
      tl.fromTo("#f10-halo", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, 3.7);

      // hold: everything settled by 4.60; the orchestrator's iris opens from (960, 460) at 4.75, frame held to 5.50
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["10-zero"] = tl;
    })();
  </script>
