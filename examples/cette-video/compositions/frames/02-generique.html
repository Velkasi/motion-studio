  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById("f02-" + id);
      };
      var DUR = 2.85;
      // one cue grid from the voice (kinetic-beat-slam: every beat reads its time from here)
      var CUE = { aucun1: 0.07, motion: 0.39, designer: 0.69, aucun2: 1.38, studio: 1.75, voiceEnd: 2.08 };

      var tl = gsap.timeline({ paused: true });

      // word-by-word (frame.md): each word lands ON its voice timestamp
      var word = function (el, at, to) {
        tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: to === undefined ? 1 : to, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at);
      };
      // accent pill (frame.md): traces from the left + straightens, THEN the letters write inside
      var pill = function (at) {
        var bg = $("pillbg");
        tl.set(bg, { opacity: 1, immediateRender: false }, at);
        tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, at);
        tl.fromTo($("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, at);
        var chars = document.querySelectorAll("#f02-pill .f02-ch");
        for (var i = 0; i < chars.length; i++) {
          tl.fromTo(chars[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, at + 0.18 + i * 0.02);
        }
      };

      // build-time state for the pill wrapper (its rotation tween starts later)
      gsap.set($("pill"), { rotation: 0 });

      // ---------- the roll: one continuous linear drift up, ~60px over the frame ----------
      tl.fromTo($("roll"), { y: 0 }, { y: -60, duration: DUR, ease: "none" }, 0);

      // ---------- block 1 (0.00): RÉALISATION, already there at the cut, settles into focus ----------
      tl.fromTo([$("r1"), $("n1")], { opacity: 0.4, y: 6, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 0);

      // ---------- block 2: MOTION DESIGN @0.05, name writes on the voice ----------
      word($("r2"), 0.05);
      word($("m1"), CUE.aucun1);
      word($("m2"), CUE.motion);
      word($("m3"), CUE.designer);

      // ---------- block 3: STUDIO @1.30, Aucun @1.38, [pill: studio.] @1.75 ----------
      word($("r3"), 1.3);
      word($("s1"), CUE.aucun2);
      pill(CUE.studio - 0.04); // traces 1 frame before the word

      // tiny camera kick on the pill (kinetic-beat-slam hit): short push, long power4 settle
      tl.fromTo($("cam"), { scale: 1 }, { scale: 1.035, duration: 0.09, ease: "power2.out", immediateRender: false }, CUE.studio);
      tl.fromTo($("cam"), { scale: 1.035 }, { scale: 1, duration: 0.6, ease: "power4.out", immediateRender: false }, CUE.studio + 0.09);
      // the halo behind the pill warms on the hit
      tl.fromTo($("haloB"), { opacity: 0.55, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: 0.6, ease: "power3.out", immediateRender: false }, CUE.studio - 0.02);

      // ---------- block 4 @2.10, dimmer: AGENCE / em dash ----------
      word($("r4"), 2.1, 0.5);
      word($("a1"), 2.18, 0.45);

      // hold: the roll keeps drifting to 2.85 (last reveal ends 2.48)

      window.__timelines = window.__timelines || {};
      window.__timelines["02-generique"] = tl;
    })();
