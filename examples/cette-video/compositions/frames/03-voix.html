      top: 0;

      height: 1080px;
      z-index: 2;

  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById("f03-" + name);
      };
      var all = function (scope, sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      var DURATION = 3.15;
      // Voice word cues: the single timing spine every reveal reads from.
      var CUE = {
        et: 0.21,
        cette: 0.4,
        voix: 0.62,
        ce: 1.34,
        nest: 1.45,
        pas: 1.58,
        un: 1.7,
        comedien: 1.88,
        non: 2.18,
        plus: 2.4
      };

      // Waveform geometry (must match the bar markup).
      var BAR_COUNT = 72;
      var PITCH = 21;
      var SPAN = 1503; // 208.5 -> 1711.5
      var FIRST_CENTER_OFFSET = 6; // bar 0 center sits 6 px right of the playhead start
      var SWEEP_END = 2.85;

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.00-1.25): waveform grows from the center line, playhead sweeps ----------
      tl.fromTo(
        byId("center"),
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false },
        0
      );

      // stat-bars-and-fills: scaleY 0 -> 1 (origin = center line, the waveform is mirrored), center-out stagger within 0.0-0.5.
      var bars = all(byId("wave"), ".f03-bar");
      var MID = (BAR_COUNT - 1) / 2;
      bars.forEach(function (bar, i) {
        var at = (Math.abs(i - MID) / MID) * 0.2;
        tl.fromTo(
          bar,
          { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false },
          at
        );
      });

      // Playhead: linear sweep over the whole waveform, 0.0-2.85.
      tl.fromTo(byId("playhead"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 0);
      tl.fromTo(byId("playhead"), { x: 0 }, { x: SPAN, duration: SWEEP_END, ease: "none", immediateRender: false }, 0);

      // Passed bars turn accent-light: seek-safe proxy whose setter recomputes the passed count (no onUpdate).
      var passed = 0;
      var applyPassed = function (n) {
        if (n === passed) return;
        for (var i = 0; i < BAR_COUNT; i++) {
          bars[i].classList.toggle("f03-on", i < n);
        }
        passed = n;
      };
      var sweep = {};
      var sweepX = 0;
      Object.defineProperty(sweep, "x", {
        get: function () {
          return sweepX;
        },
        set: function (v) {
          sweepX = v;
          var n = v < FIRST_CENTER_OFFSET ? 0 : Math.floor((v - FIRST_CENTER_OFFSET) / PITCH) + 1;
          applyPassed(Math.max(0, Math.min(BAR_COUNT, n)));
        }
      });
      tl.fromTo(sweep, { x: 0 }, { x: SPAN, duration: SWEEP_END, ease: "none", immediateRender: false }, 0);

      // word-by-word: each word ON its voice timestamp.
      var wordIn = function (w, at) {
        tl.fromTo(
          w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          at - 0.02
        );
      };
      var p1 = all(byId("p1"), ".f03-w");
      [CUE.et, CUE.cette, CUE.voix].forEach(function (t, i) {
        wordIn(p1[i], t);
      });

      // Waterfall cut (phrase 1 -> phrase 2): each word rips left on power4.in, fades early; the last dies at the cut.
      var CUT = CUE.ce - 0.02;
      var EXIT_FADE = 0.18;
      var EXIT_STAGGER = 0.022;
      p1.forEach(function (w, i) {
        var at = CUT - EXIT_FADE - (p1.length - 1 - i) * EXIT_STAGGER;
        tl.fromTo(w, { x: 0 }, { x: -230, duration: 0.34, ease: "power4.in", immediateRender: false }, at);
        tl.fromTo(w, { opacity: 1 }, { opacity: 0, duration: EXIT_FADE, ease: "power1.in", immediateRender: false }, at);
      });

      // ---------- Scene 2 (1.25-2.85): casting card rises, gets struck, phrase 2 + pill ----------
      tl.fromTo(
        byId("cast"),
        { opacity: 0, y: 70, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", immediateRender: false },
        CUE.ce - 0.02
      );

      var p2 = all(byId("p2"), ".f03-w");
      [CUE.ce, CUE.nest, CUE.pas, CUE.un, CUE.comedien].forEach(function (t, i) {
        wordIn(p2[i], t);
      });

      // svg-path-draw: measured dash setup, then the strike traces across the title on « comédien ».
      var drawPath = function (el, at, dur) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, at);
        tl.fromTo(
          el,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out", immediateRender: false },
          at
        );
      };
      drawPath(byId("strike"), CUE.comedien, 0.3);
      drawPath(byId("cross-a"), CUE.comedien + 0.14, 0.14);
      drawPath(byId("cross-b"), CUE.comedien + 0.22, 0.14);

      // The card dims to 45 % under its strike.
      tl.fromTo(
        byId("cast-body"),
        { opacity: 1 },
        { opacity: 0.45, duration: 0.4, ease: "power1.out", immediateRender: false },
        CUE.comedien + 0.08
      );

      // accent-pill: traces first (scaleX from the left, rotation -8 -> 0), then the letters write inside.
      var PILL_AT = CUE.non - 0.05;
      tl.fromTo(byId("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, PILL_AT);
      tl.fromTo(
        byId("pill-bg"),
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        PILL_AT
      );
      // Glow halo resolves a beat behind the silhouette.
      tl.fromTo(byId("pill-glow"), { opacity: 0 }, { opacity: 0.8, duration: 0.45, ease: "power2.out", immediateRender: false }, PILL_AT + 0.24);
      all(byId("pill"), ".f03-ch").forEach(function (c, i) {
        tl.fromTo(
          c,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", immediateRender: false },
          PILL_AT + 0.18 + i * 0.02
        );
      });

      // ---------- Scene 3 (2.85-3.15): waveform + card collapse into the light-point at (960,540) ----------
      var COLLAPSE_AT = 2.85;
      tl.fromTo(
        byId("light"),
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 0.35, duration: 0.1, ease: "power2.out", immediateRender: false },
        COLLAPSE_AT - 0.05
      );
      tl.fromTo(byId("light"), { scale: 0.35 }, { scale: 1, duration: 0.25, ease: "power2.in", immediateRender: false }, 2.9);

      // Squash to a line, then pinch the line to the point (power3.in). Origin 960px 540px => ends exactly at (960,540).
      tl.fromTo(
        byId("stage"),
        { scaleY: 1, transformOrigin: "960px 540px" },
        { scaleY: 0.012, transformOrigin: "960px 540px", duration: 0.11, ease: "power3.in", immediateRender: false },
        COLLAPSE_AT
      );
      tl.fromTo(
        byId("stage"),
        { scaleY: 0.012 },
        { scaleY: 0, duration: 0.1, ease: "power3.in", immediateRender: false },
        COLLAPSE_AT + 0.11
      );
      tl.fromTo(
        byId("stage"),
        { scaleX: 1, transformOrigin: "960px 540px" },
        { scaleX: 0, transformOrigin: "960px 540px", duration: 0.16, ease: "power3.in", immediateRender: false },
        COLLAPSE_AT + 0.05
      );

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-voix"] = tl;
    })();
  </script>
</template>
