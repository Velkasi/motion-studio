  <script>
    (function () {

      var DUR = 4.45;

      function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

      var tl = gsap.timeline({ paused: true });

      /* ---------- build-time Scene 1 layout (wrappers hold their row slot in CSS) ---------- */
      function SITE_FROM() { return { x: -162, y: 50, scale: 1 }; }
      function TOOLS_FROM() { return { x: -8, y: -70, scale: 1.15 }; }
      function AUTO_FROM() { return { x: -160, y: 190, scale: 1 }; }

      gsap.set($("tools"), TOOLS_FROM());
      gsap.set($("auto"), AUTO_FROM());

      all("#f06-stage .f06-w").forEach(function (w) {
        var t = parseFloat(w.getAttribute("data-cue"));
        tl.fromTo(w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          t);

      /* ===== Scene 1 (0.00-2.50): three objects land one per beat ===== */

      // 0.20 "Ton site": the site-mock lands, then its parts build
      tl.fromTo($("browser"),

      all("#f06-site .f06-sp").forEach(function (el) {

          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false },

      // 0.82 "tes outils": four tool tiles pop, each logo traces its outline then fills (svg-icon-enrichment)
      var TOOL_T = [0.82, 0.9, 0.98, 1.06];
      ["tg", "tn", "ts", "tm"].forEach(function (id, i) {
        var node = $(id);
        var t = TOOL_T[i];
        var logo = node.querySelector(".f06-logo");
        tl.fromTo(node,
          { opacity: 0, scale: 0.55, y: 18, rotation: -6 },
          { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.5, ease: "expo.out", immediateRender: false },
          t);
        tl.fromTo(logo,
          { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.34, ease: "power2.out", immediateRender: false },
          t + 0.06);
        tl.fromTo(logo,
          { attr: { "fill-opacity": 0 } },
          { attr: { "fill-opacity": 1 }, duration: 0.22, ease: "power1.out", immediateRender: false },
          t + 0.28);

      // 1.46 "tes automatisations": chain tiles land, accent links draw (svg-path-draw), dot travels once
      var AUTO_T = [1.46, 1.54, 1.62];
      ["a1", "a2", "a3"].forEach(function (id, i) {
        tl.fromTo($(id),
          { opacity: 0, scale: 0.6, y: 14 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: false },
          AUTO_T[i]);
      });
      var LINK_T = [1.66, 1.86];
      ["l1", "l2"].forEach(function (id, i) {
        var p = $(id);
        var len = 64;
        tl.set(p, { opacity: 1 }, LINK_T[i]);
        tl.fromTo(p,
          { attr: { "stroke-dashoffset": len } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.28, ease: "power2.out", immediateRender: false },
          LINK_T[i]);
      });

      // the dot: plain x tweens (no onUpdate, no repeat), Gmail -> under Make -> Stripe
      var dot = $("dot");
      tl.fromTo(dot, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, 1.98);
      tl.fromTo(dot, { x: 0 }, { x: 64, duration: 0.14, ease: "none", immediateRender: false }, 2.0);
      tl.fromTo(dot, { x: 64 }, { x: 136, duration: 0.1, ease: "none", immediateRender: false }, 2.14);
      tl.fromTo(dot, { x: 136 }, { x: 200, duration: 0.14, ease: "none", immediateRender: false }, 2.24);
      tl.fromTo(dot, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.8, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.38);
      // arrival: the last tile answers with a small nudge
      tl.fromTo($("a3t"), { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.38);
      tl.fromTo($("a3t"), { scale: 1.08 }, { scale: 1, duration: 0.28, ease: "power2.inOut", immediateRender: false }, 2.5);

      /* ===== Scene 2 (2.50-4.45): everything lines up with the player ===== */

      // the top phrase moves down and clears (the phrase slot moves under the row)
      tl.fromTo($("line1"),
        { y: 0, opacity: 1, filter: "blur(0px)" },
        { y: 70, opacity: 0, filter: "blur(8px)", duration: 0.24, ease: "power3.in", immediateRender: false },
        2.44);

      // glide into one row at y 470 (same direction for all: rightward, into slot)
      var GLIDE = 0.6;
      tl.fromTo($("site"), SITE_FROM(), { x: 0, y: 0, scale: 0.68, duration: GLIDE, ease: "power3.out", immediateRender: false }, 2.5);

      // the player slides into the first slot from the left
      tl.fromTo($("player"),

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
