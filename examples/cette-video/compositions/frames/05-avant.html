        { el: $("g-cool"), mx: 14, my: 5 },
      ];
      var ghostEls = ghosts.map(function (g) {
        return g.el;
      });
      var amp = { a: 1 };
      function applyGlitch(time) {
        var step = Math.floor(time / JITTER_STEP);
        for (var k = 0; k < ghosts.length; k++) {
          var g = ghosts[k];
          gsap.set(g.el, {
            x: (glitchHash(step * 13 + k * 7) * 2 - 1) * g.mx * amp.a,
            y: (glitchHash(step * 29 + k * 11) * 2 - 1) * g.my * amp.a,
          });
        }
        for (var j = 0; j < tears.length; j++) {
          gsap.set(tears[j], { x: (glitchHash(step * 17 + j * 5 + 3) * 2 - 1) * TEAR_MAX * amp.a });
        }
      }
      // frame-0 state (the glitch is live on the very first frame)
      gsap.set(ghostEls, { opacity: SPLIT_OPACITY });
      applyGlitch(0);
      tl.fromTo(
        amp,
        { a: 1 },
        {
          a: 0,
          duration: GL_DUR,
          ease: "power3.in",
          immediateRender: false,
          onUpdate: function () {
            applyGlitch(tl.time());
          },
        },
        GL_START,
      );
      // the clean resolve: clamp ghosts to exact rest
      tl.set(ghostEls, { x: 0, y: 0, opacity: 0 }, GL_START + GL_DUR);
      tl.set(tears, { x: 0 }, GL_START + GL_DUR);

      // the band sweeps up the stage (visible from frame 0 via CSS top: 760px)
      var band = $("band");
      tl.fromTo(band, { y: 0 }, { y: -1100, duration: 0.32, ease: "none", immediateRender: false }, 0);
      tl.set(band, { opacity: 0 }, 0.32);

      // giant-word « Avant, »: tracking 0.35em -> -0.05em via per-letter x transforms,
      // opacity + blur 12 -> 0, 0.5 s expo.out. Same tracking on the two ghost copies.
      var T_GIANT = 0.19;
      var SPREAD = 104; // 0.4em at 260px
      var gSets = [splitChars($("g-warm"), "f05-gl"), splitChars($("g-cool"), "f05-gl"), splitChars($("g-base"), "f05-gl")];
      tl.fromTo(
        $("giant"),
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        T_GIANT,
      );
      var gn = gSets[2].length;
      for (var gi = 0; gi < gn; gi++) {
        gSets.forEach(function (set) {
          set[gi].style.display = "inline-block";
          set[gi].style.whiteSpace = "pre";
        });
        tl.fromTo(
          [gSets[0][gi], gSets[1][gi], gSets[2][gi]],
          { x: (gi - (gn - 1) / 2) * SPREAD },
          { x: 0, duration: 0.5, ease: "expo.out", immediateRender: false },
          T_GIANT,
        );
      }

      // phrase words (both phrases): word by word on the voice
      $$(".f05-w").forEach(function (w) {
        tl.fromTo(
          w,
          { opacity: 0, y: 10, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
          parseFloat(w.getAttribute("data-cue")),
        );
      });

      /* ================= Seam 1.15: cut-the-curve, leftward (the camera is about to pan right) ================= */
      var T_SEAM = 1.15;
      var s1 = $("s1");
      tl.fromTo(s1, { x: 0 }, { x: -230, duration: 0.3, ease: "power4.in", immediateRender: false }, T_SEAM - 0.3);
      tl.fromTo(s1, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, T_SEAM - 0.32);
      tl.set(s1, { opacity: 0 }, T_SEAM);
      tl.fromTo($("ground-halo"), { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power1.out", immediateRender: false }, T_SEAM);

      /* ================= Scene 2 (1.15 to 4.10): one camera, two stations ================= */

      // camera + counter: one writer, pure function of time (viewport-change single source of truth)
      var world = $("world");
      var ENTRY_X = 230; // cut-the-curve entry distance, same as the exit
      var ENTRY_DUR = 0.3;
      var PAN_START = 2.44; // on « devis »
      var PAN_DUR = 0.5;
      var PAN_D = 1000; // camera pans right -> world translates left
      var PAN_BLUR = 8;
      var E_ENTRY = gsap.parseEase("power4.out");
      var E_PAN = gsap.parseEase("power2.inOut");

      // J+ counter: seek-safe proxy, integer days written to textContent, vertical roll, no overshoot
      var ROLL_START = 3.02;
      var ROLL_DUR = 0.58; // lands at 3.60
      var DAYS = 42;
      var ITEM_H = 230;
      var rollin = $("rollin");
      var dcur = $("dcur");
      var dnext = $("dnext");
      var ticksBox = $("ticks");
      var ticks = [];
      for (var k2 = 0; k2 < DAYS; k2++) {
        var tk = document.createElement("i");
        tk.className = "f05-tick";
        ticksBox.appendChild(tk);
        ticks.push(tk);
      }
      var lastN = -1;
      function renderCounter(t) {
        var p = clamp01((t - ROLL_START) / ROLL_DUR);
        var e = 1 - Math.pow(1 - p, 3); // decelerating out-curve, lands exactly, never passes 42
        var d = 1 + (DAYS - 1) * e;
        var n = Math.floor(d + 1e-6);
        var f = d - n;
        if (n >= DAYS) {
          n = DAYS;
          f = 0;
        }
        if (f < 0) f = 0;
        if (n !== lastN) {
          dcur.textContent = String(n);
          dnext.textContent = String(n + 1);
          for (var i = 0; i < ticks.length; i++) {
            var cls = "f05-tick";
            if (i > 0 && i % 7 === 0) cls += " f05-wk";
            if (i < n - 1) cls += " f05-on";
            else if (i === n - 1) cls += " f05-now";
            ticks[i].className = cls;
          }
          lastN = n;
        }
        rollin.style.transform = "translate3d(0px, " + (-f * ITEM_H).toFixed(2) + "px, 0px)";
        var vel = p > 0 && p < 1 ? ((DAYS - 1) * 3 * Math.pow(1 - p, 2)) / ROLL_DUR : 0;
        var bl = Math.min(4, vel * 0.02);
        rollin.style.filter = bl > 0.05 ? "blur(" + bl.toFixed(2) + "px)" : "none";
      }

      function renderAt(t) {
        var pe = clamp01((t - T_SEAM) / ENTRY_DUR);
        var pp = clamp01((t - PAN_START) / PAN_DUR);
        var x = ENTRY_X * (1 - E_ENTRY(pe)) - PAN_D * E_PAN(pp);
        var b = pp > 0 && pp < 1 ? Math.sin(Math.PI * pp) * PAN_BLUR : 0;
        world.style.transform = "translate3d(" + x.toFixed(2) + "px, 0px, 0px)";
        world.style.filter = b > 0.05 ? "blur(" + b.toFixed(2) + "px)" : "none";
        renderCounter(t);
      }
      renderAt(0);
      var driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          immediateRender: false,
          onUpdate: function () {
            renderAt(driver.t);
          },
        },
        0,
      );

      // station A arrives with the world (cut-the-curve entry: opacity 0.35 -> 1 under the deceleration)
      tl.fromTo($("halo-a"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, T_SEAM);
      tl.fromTo($("role"), { opacity: 0.35 }, { opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, T_SEAM);
      tl.fromTo(
        $("role-title"),
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
        1.76,
      );

      // the quote card builds up, price lands at 2.30
      tl.fromTo(
        $("quote"),
        { opacity: 0, y: 36, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false },
        1.4,
      );
      tl.fromTo(
        splitChars($("qnum"), "f05-qch"),
        { opacity: 0 },
        { opacity: 1, duration: 0.06, ease: "none", stagger: 0.018, immediateRender: false },
        1.58,
      );
      tl.fromTo(
        $("qline"),
        { opacity: 0, y: 10, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
        1.86,
      );
      tl.fromTo($("qbar1"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.96);
      tl.fromTo($("qbar2"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.02);
      tl.fromTo($("qrule2"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.0);
      tl.fromTo(
        $("price"),
        { opacity: 0, y: 14, scale: 1.1, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.26, ease: "power3.out", immediateRender: false },
        2.04,
      );

      // the pan leaves station A behind (dimmed, never removed)
      tl.fromTo($("sa"), { opacity: 1 }, { opacity: 0.45, duration: 0.45, ease: "power1.inOut", immediateRender: false }, 2.5);

      // station B: the delivery counter, revealed as the camera lands
      tl.fromTo($("halo-b"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, 2.6);
      tl.fromTo(
        $("clabel"),
        { opacity: 0, y: 10, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false },
        2.76,
      );
      tl.fromTo(
        $("num"),
        { opacity: 0, y: 14, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: false },
        2.82,
      );
      tl.fromTo($("ticks"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.88);

      // accent pill « et attendre. »: traces first (2 frames before « et »), then the letters write inside
      var T_PILL = 2.84;
      tl.fromTo($("pill-bg"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, T_PILL);
      tl.fromTo($("pill"), { rotation: -8 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, T_PILL);
      $$(".f05-pw").forEach(function (pw) {
        tl.fromTo(
          splitChars(pw, "f05-l"),
          { opacity: 0, x: -6 },
          { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", stagger: 0.02, immediateRender: false },
          parseFloat(pw.getAttribute("data-cue")),
        );
      });

      // hold to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
