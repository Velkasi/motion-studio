      function measure(p) {

        if (!(len > 0)) {
          var n = p.getAttribute("d").match(/-?\d+(\.\d+)?/g).map(Number);
          len = Math.sqrt((n[2] - n[0]) * (n[2] - n[0]) + (n[3] - n[1]) * (n[3] - n[1]));
        }
        return len;
      }

      ft($("toi"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "none" }, 0);

        { id: "dev", pop: 0.92, snap: 2.84, cx: 440, cy: 530, mx: 746, my: 586, dx: -99, dy: -48, rot: -4 },

        A.setAttribute("stroke-dashoffset", String(la));
        B.setAttribute("stroke-dasharray", lb + " " + lb);
        B.setAttribute("stroke-dashoffset", String(-lb));
        gsap.set(B, { svgOrigin: s.cx + " " + s.cy });
        gsap.set(burst, { svgOrigin: s.mx + " " + s.my });

        // node pops (scale + blur settle, expo.out)
        ft(card, { scale: 0.84, y: 14, filter: "blur(8px)" }, { scale: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, s.pop);
